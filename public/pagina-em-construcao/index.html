<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Brevemente</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<style>
/* O mesmo desenho da página 404 do site, no tema claro (grelha, brilho vermelho, cartão, botões, logótipo por baixo) */
@font-face{font-family:'Exo 2';src:url(assets/exo2-variable.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;position:relative;overflow-x:hidden;
  font-family:'Exo 2',sans-serif;color:#18181b;background:#fff;-webkit-font-smoothing:antialiased;text-align:center}
.brilho{position:fixed;pointer-events:none;opacity:.4}
.brilho.um{top:-20%;left:-20%;width:80%;height:80%;background:radial-gradient(ellipse at top left,rgba(180,0,0,.3) 0%,rgba(120,0,0,.15) 50%,transparent 80%);filter:blur(100px)}
.brilho.dois{bottom:-10%;right:-10%;width:60%;height:60%;background:radial-gradient(ellipse at bottom right,rgba(80,0,0,.2) 0%,transparent 70%);filter:blur(80px)}
.grelha{position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:linear-gradient(#18181b 1px,transparent 1px),linear-gradient(90deg,#18181b 1px,transparent 1px);background-size:40px 40px}
.linha-fundo{position:fixed;left:0;right:0;bottom:0;height:2px;opacity:.5;background:linear-gradient(90deg,transparent,#cc0000,transparent)}
main{position:relative;z-index:1;width:100%;max-width:576px;display:flex;flex-direction:column;align-items:center}
.card{width:100%;padding:40px;border-radius:10px;border:1px solid #e4e4e7;background:rgba(255,255,255,.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 24px 60px -28px rgba(24,24,27,.3);margin-bottom:40px}
.dominio{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;font-weight:600;letter-spacing:.04em;color:#b91c1c;overflow-wrap:anywhere}
.ponto{width:7px;height:7px;flex:none;border-radius:50%;background:#dc2626;animation:pulsa 1.8s ease-out infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}80%,100%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
h1{font-size:24px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
p{font-size:16px;line-height:1.625;color:#71717a;margin-bottom:28px}
.botoes{display:flex;gap:12px;justify-content:center}
.botoes a{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 24px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:background-color .2s}
.principal{background:#b91c1c;color:#fff}.principal:hover{background:#dc2626}
.secundario{background:#fff;color:#27272a;border:1px solid #d4d4d8}.secundario:hover{background:#fafafa}
.logo{opacity:.7;transition:opacity .5s}.logo:hover{opacity:1}
.logo img{height:48px;width:auto;mix-blend-mode:multiply;display:block}
@media (max-width:640px){.card{padding:32px 20px}h1{font-size:20px}p{font-size:14px}.botoes{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.ponto{animation:none}}
</style>
</head>
<body>
  <div class="brilho um"></div><div class="brilho dois"></div><div class="grelha"></div>
  <main>
    <div class="card">
      <div class="dominio"><span class="ponto"></span><span id="dominio">Em construção</span></div>
      <h1>Brevemente</h1>
      <p>Estamos a dar os últimos retoques para lhe mostrar algo à altura. Fica a promessa: vai valer a pena.</p>
      <div class="botoes">
        <a class="principal" href="https://visualdesignmoz.com">Conhecer a VisualDesign</a>
        <a class="secundario" href="https://visualdesignmoz.com/login">Entrar no painel</a>
      </div>
    </div>
    <a class="logo" href="https://visualdesignmoz.com" title="VisualDesign"><img src="assets/logo-entrada.jpg" alt="VisualDesign"></a>
  </main>
  <div class="linha-fundo"></div>
<script>
// o domínio vem do endereço aberto (sem o "www.")
(function(){var h=location.hostname.replace(/^www\./,'');if(h)document.getElementById('dominio').textContent=h})();
</script>
</body>
</html>
