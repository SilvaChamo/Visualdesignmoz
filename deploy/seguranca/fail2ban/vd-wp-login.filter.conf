# Filtro do fail2ban: login falhado no WordPress (Silva, 26/10/2026). Um login com sucesso responde 302; um falhado volta a mostrar o formulário (200).
# (O fail2ban tira a data da linha antes de aplicar a expressão, por isso não se escreve o [data].) O registo do Apache já tem o IP verdadeiro do visitante (vd-ip-real.conf), por isso o <HOST> é o do atacante, não o do servidor.
[Definition]
failregex = ^<HOST> .*"POST /+wp-login\.php[^"]*" 200
ignoreregex =
