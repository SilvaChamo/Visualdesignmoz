# Bloqueio de pedidos de spam e de sondas de portas dos fundos, antes de chegarem ao PHP (Silva, 21/10/2026).
# Vai em /etc/nginx/conf.d/vd-bloqueio.conf (contexto http). Os sites usam-no pelo vd-bloqueio.inc, que o
# vd-bloqueio-instalar põe em cada site (nginx.conf_vd-bloqueio e nginx.ssl.conf_vd-bloqueio).

# Endereços de spam que o Google ainda rastreia (?sale/search/detail/?ITMCODE=…): 410 "desaparecido" — nunca chega ao WordPress
# e diz ao Google para os esquecer. O Googlebot verdadeiro também recebe 410 (é o que se quer).
map $request_uri $vd_spam_410 {
    default 0;
    "~*(^|[?&/])ITMCODE=" 1;
    "~*[?]sale(/|%2f)search" 1;
}

# Sondas de portas dos fundos (nomes que não existem num site normal): a ligação fecha-se sem resposta (444)
map $request_uri $vd_sonda_444 {
    default 0;
    "~*(^|/)filefuns\.php($|\?)" 1;
    "~*^/([a-z0-9_-]+/)?cache\.php($|\?)" 1;
    "~*^/(images|Backup|wp-content/uploads|wp-admin/(css|maint|images))/.*\.php($|\?)" 1;
}

# Limite de ritmo no xmlrpc.php e no wp-login.php (ataques de adivinhar palavras-passe): por IP verdadeiro do visitante (o nginx é a
# frente do Apache e vê-o). 30 pedidos por minuto com folga de 20 de seguida — largo para o Jetpack e para quem entra, curto para
# um robô. O resto dos endereços tem chave vazia e nunca é limitado.
# IPs do Silva: nunca são limitados (26/10/2026: "negar bloqueio do meu IP"). O IP dele muda dentro da 41.220.201.x: acrescentar aqui.
geo $vd_ip_livre {
    default 0;
    41.220.201.71 1;
    41.220.201.107 1;
}
map "$vd_ip_livre:$request_uri" $vd_chave_login {
    default "";
    "~*^0:/+xmlrpc\.php" $binary_remote_addr;
    "~*^0:/wp-login\.php" $binary_remote_addr;
}
limit_req_zone $vd_chave_login zone=vd_login:10m rate=30r/m;
limit_req_status 429;
