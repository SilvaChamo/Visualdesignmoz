# Bloqueio de pedidos de spam e de sondas de portas dos fundos, antes de chegarem ao PHP (Silva, 21/10/2026).
# Vai em /etc/nginx/conf.d/vd-bloqueio.conf (contexto http). Os sites usam-no pelo vd-bloqueio.inc, que o
# vd-bloqueio-instalar põe em cada site (nginx.conf_vd-bloqueio e nginx.ssl.conf_vd-bloqueio).

# Endereços de spam que o Google ainda rastreia (?sale/search/detail/?ITMCODE=…): 410 "desaparecido" — nunca chega ao WordPress
# e diz ao Google para os esquecer. O Googlebot verdadeiro também recebe 410 (é o que se quer).
map $request_uri $vd_spam_410 {
    default 0;
    "~*(^|[?&/])ITMCODE=" 1;
    "~*[?]sale(/|%2f)search" 1;
}

# Sondas de portas dos fundos (nomes que não existem num site normal): a ligação fecha-se sem resposta (444)
map $request_uri $vd_sonda_444 {
    default 0;
    "~*(^|/)filefuns\.php($|\?)" 1;
    "~*^/([a-z0-9_-]+/)?cache\.php($|\?)" 1;
    "~*^/(images|Backup|wp-content/uploads|wp-admin/(css|maint|images))/.*\.php($|\?)" 1;
}
