name: "Ops - DNS: mltmark.com no Contabo + Cloudflare → Contabo sincronizado (ns1..ns4 autoritários)"

# ============================================================================
# "Avança com tudo. Quero as duas plataformas conectadas"; "eu já disse há muito
# tempo para sincronizar isso" (Silva, 16/10/2026).
# 1. mltmark.com: os registos A que ainda apontavam para o Hetzner (37.27.17.25,
#    avariado desde 14/10 — site e e-mail em baixo) passam para o Contabo.
# 2. Instala deploy/vd-dns-sync.py no Contabo (/usr/local/bin/vd-dns-sync) e corre-o
#    uma vez: cada zona activa da Cloudflare de um domínio alojado no Hestia fica com
#    os mesmos registos no Hestia — ns1..ns4 deixam de responder REFUSED. A Cloudflare
#    manda; cada alteração de DNS feita no painel volta a correr o script para esse
#    domínio (route.ts, espelharNoServidor). Sem cron.
# 3. Confirma de fora.
# MODO: "seco" só mostra, registo a registo, o que mudaria (não instala nem muda nada);
# "aplicar" faz as mudanças.
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-dns-sync-instalar.yml'

env:
  MODO: seco

jobs:
  mltmark:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set +e
          API=https://api.cloudflare.com/client/v4
          cf() { curl -sS -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H 'Content-Type: application/json' "$@"; }
          ZID=$(cf "$API/zones?name=mltmark.com" | jq -r '.result[0].id')
          echo "Registos do mltmark.com na Cloudflare:"
          cf "$API/zones/$ZID/dns_records?per_page=100" | jq -r '.result[] | select(.type!="TXT") | "  \(.type) \(.name) \(.content) proxy=\(.proxied)"'
          cf "$API/zones/$ZID/dns_records?type=A&per_page=100" | jq -r '.result[] | select(.content=="37.27.17.25") | "\(.id) \(.name)"' | while read -r rid nome; do
            echo -n "$nome: 37.27.17.25 → "
            [ "$MODO" = aplicar ] || { echo "169.58.148.144 (seco: não mudado)"; continue; }
            cf -X PATCH "$API/zones/$ZID/dns_records/$rid" --data '{"content":"169.58.148.144"}' | jq -r '"\(.result.content) ok=\(.success)"'
          done

  sincronizar:
    needs: mltmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar e correr no Contabo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          S="ssh -i ~/.ssh/k root@${{ secrets.CONTABO_HOST }}"
          if [ "$MODO" != aplicar ]; then
            scp -i ~/.ssh/k deploy/vd-dns-sync.py "root@${{ secrets.CONTABO_HOST }}:/tmp/vd-dns-sync-seco.py"
            echo "===== o que mudaria (nada é alterado) ====="
            $S 'python3 /tmp/vd-dns-sync-seco.py --seco; rm -f /tmp/vd-dns-sync-seco.py'
            exit 0
          fi
          scp -i ~/.ssh/k deploy/vd-dns-sync.py "root@${{ secrets.CONTABO_HOST }}:/usr/local/bin/vd-dns-sync"
          $S 'chmod 755 /usr/local/bin/vd-dns-sync && python3 -m py_compile /usr/local/bin/vd-dns-sync && echo instalado'
          echo "===== o que vai mudar ====="
          $S '/usr/local/bin/vd-dns-sync --seco'
          echo "===== a sincronizar ====="
          $S '/usr/local/bin/vd-dns-sync'
          echo "===== segunda passagem (deve ficar vazia: nada a mudar) ====="
          $S '/usr/local/bin/vd-dns-sync --seco | grep -v "fica só na Cloudflare\|ainda não activa" || echo "nada a mudar"'

  confirmar:
    needs: sincronizar
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for d in aamihe.com basededadosagro.com concordia.co.mz elimservicos.com entrecamposblog.com lirandzojewelry.com menocrazy.app mltmark.com msdn-moz.org oshercollective.com provisualcorporate.co.mz shalomdeco.com visualdesignmoz.com; do
            st=$(dig +norec SOA $d @169.58.148.144 | grep -o 'status: [A-Z]*' | head -1 | cut -d' ' -f2)
            aa=$(dig +norec SOA $d @169.58.148.144 | grep -o 'flags: [a-z ]*' | grep -qw aa && echo autoritário || echo "não-autoritário")
            mx_ct=$(dig +norec +short MX $d @169.58.148.144 | sort | tr '\n' ' ')
            mx_cf=$(dig +short MX $d @1.1.1.1 | sort | tr '\n' ' ')
            echo "$d: $st $aa | MX igual à Cloudflare: $([ "$mx_ct" = "$mx_cf" ] && echo sim || echo "NÃO ($mx_ct / $mx_cf)")"
          done
          echo
          echo "mltmark.com (público): $(dig +short A mltmark.com @1.1.1.1 | tr '\n' ' ')  mail: $(dig +short A mail.mltmark.com @1.1.1.1)"
          curl -sS -o /dev/null -w "https://mltmark.com: HTTP %{http_code}\n" --max-time 20 https://mltmark.com/
