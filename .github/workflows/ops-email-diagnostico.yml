name: Ops - Diagnóstico do envio de e-mail da conta (só leitura)

# Só LÊ, não altera nada: porque é que o correio de silva.chamo@visualdesignmoz.com não sai (Hotmail, Mac Mail, VhostMail) e porque aparece
# o basededadosagro.com no meio. Mostra como o Exim encaminha os endereços, que domínios de e-mail há em cada conta do servidor, os últimos
# registos do Exim desses endereços, a fila e o DNS de envio (MX, SPF, DKIM, DMARC, PTR). Sem palavras-passe nem ficheiros de contas.
# Pedido do Silva a 18/11/2026. Corre ao enviar o ramo e à mão.

on:
  workflow_dispatch:
  push:
    branches: [corrigir-envio-de-email-silva-chamo]
    paths: ['.github/workflows/ops-email-diagnostico.yml']

concurrency:
  group: ops-email-diagnostico
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico do correio (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -u
            EX=$(command -v exim4 || command -v exim)
            echo "### exim: $EX · $($EX -bV 2>&1 | head -1) · fila: $($EX -bpc 2>&1) mensagens"
            echo; echo "### Como o Exim encaminha (exim -bt)"
            for E in silva.chamo@visualdesignmoz.com Mailer-Daemon@visualdesignmoz.com postmaster@visualdesignmoz.com silva.chamo@basededadosagro.com; do
              echo "--- $E"; $EX -bt "$E" 2>&1 | head -8
            done
            echo; echo "### Domínios de e-mail de cada conta do servidor (Hestia)"
            for F in /usr/local/hestia/data/users/*/mail.conf; do
              U=$(echo "$F" | cut -d/ -f6)
              echo "conta $U: $(grep -o "DOMAIN='[^']*'" "$F" | cut -d"'" -f2 | tr '\n' ' ')"
            done
            echo; echo "### Pastas de domínios do Exim e caixas (só nomes)"
            for D in visualdesignmoz.com basededadosagro.com; do
              echo "--- $D: $(ls -ld /etc/exim4/domains/$D 2>&1 | awk '{print $1,$3,$NF}')"
              echo "    ficheiros: $(ls /etc/exim4/domains/$D 2>&1 | tr '\n' ' ')"
              echo "    aliases: $(cut -c1-150 /etc/exim4/domains/$D/aliases 2>/dev/null | head -8 | tr '\n' ';')"
              echo "    caixas (passwd, só os nomes): $(cut -d: -f1 /etc/exim4/domains/$D/passwd 2>/dev/null | tr '\n' ' ')"
            done
            echo; echo "### Registos do Exim: o endereço, o Mailer-Daemon e o basededadosagro (últimos)"
            L=/var/log/exim4/mainlog
            echo "--- silva.chamo (últimas 25):"; grep -i "silva.chamo" $L | tail -25 | cut -c1-260
            echo "--- Mailer-Daemon@visualdesignmoz (últimas 10):"; grep -i "mailer-daemon@visualdesignmoz" $L | tail -10 | cut -c1-260
            echo "--- falhas (** e ==) recentes:"; { zcat -f ${L}.1.gz 2>/dev/null | tail -n 4000; tail -n 6000 $L; } | grep -E ' (\*\*|==) ' | tail -25 | cut -c1-300
            echo "--- basededadosagro nos registos (últimas 15):"; grep -i "basededadosagro" $L | tail -15 | cut -c1-260
            echo "--- rejeições (rejectlog, últimas 15):"; tail -n 15 /var/log/exim4/rejectlog 2>/dev/null | cut -c1-260
            echo; echo "### Configuração do Exim que menciona os dois domínios (sem segredos)"
            grep -rnE "visualdesignmoz|basededadosagro" /etc/exim4/exim4.conf.template /etc/exim4/conf.d /etc/exim4/*.conf /etc/exim4/*.list 2>/dev/null | cut -c1-200 | head -20
            echo "--- remetente/relay: $(grep -nE '^(smtp_relay|dkim|hide mysql|primary_hostname|qualify_domain|MAIN_.*DOMAIN)' /etc/exim4/exim4.conf.template 2>/dev/null | head -8 | tr '\n' ';')"
            echo; echo "### DNS de envio (por este servidor)"
            IP=$(curl -s -m 8 https://api.ipify.org)
            echo "IP público: $IP · PTR: $(dig +short -x $IP | head -2 | tr '\n' ' ') · hostname: $(hostname -f)"
            for D in visualdesignmoz.com basededadosagro.com; do
              echo "--- $D"
              echo "MX:    $(dig +short MX $D | tr '\n' ';')"
              echo "SPF:   $(dig +short TXT $D | grep -i 'v=spf1' | tr '\n' ';')"
              echo "DKIM:  $(dig +short TXT mail._domainkey.$D | cut -c1-80 | tr '\n' ';')"
              echo "DMARC: $(dig +short TXT _dmarc.$D | tr '\n' ';')"
            done
            echo; echo "### Ligação ao exterior (porta 25 de saída) e listas negras do IP"
            timeout 8 bash -c 'exec 3<>/dev/tcp/gmail-smtp-in.l.google.com/25 && head -c 60 <&3' 2>&1 | head -1
            R=$(echo $IP | awk -F. '{print $4"."$3"."$2"."$1}')
            for BL in zen.spamhaus.org b.barracudacentral.org bl.spamcop.net; do echo "$BL: $(dig +short $R.$BL | head -2 | tr '\n' ' ')(vazio = fora da lista)"; done
