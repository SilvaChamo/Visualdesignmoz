name: Ops - Diagnóstico do envio de e-mail da conta (só leitura)

# Só LÊ, não altera nada: porque é que o correio de silva.chamo@visualdesignmoz.com não sai (Hotmail, Mac Mail, VhostMail) e porque aparece
# o basededadosagro.com no meio. Mostra como o Exim encaminha os endereços, que domínios de e-mail há em cada conta do servidor, os últimos
# registos do Exim desses endereços, a fila e o DNS de envio (MX, SPF, DKIM, DMARC, PTR). Sem palavras-passe nem ficheiros de contas.
# Pedido do Silva a 18/11/2026. Corre ao enviar o ramo e à mão.

on:
  workflow_dispatch:
  push:
    branches: [corrigir-envio-de-email-silva-chamo]
    paths: ['.github/workflows/ops-email-diagnostico.yml']

concurrency:
  group: ops-email-diagnostico
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico do correio (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -u
            EX=/usr/sbin/exim4
            echo "### Como o Exim decide (routers) para silva.chamo@visualdesignmoz.com"
            $EX -d+route -bt silva.chamo@visualdesignmoz.com 2>&1 | grep -iE "router|local_domains|domain|check_local|require_files|file|passwd|transport|lookup|failed|deferred" | cut -c1-200 | head -45
            echo; echo "### Routers e autenticadores do Exim (nomes e linhas-chave)"
            T=/etc/exim4/exim4.conf.template
            grep -nE '^(begin |[a-zA-Z_0-9]+:[[:space:]]*$)' $T | tr '\n' ' ' | cut -c1-1800; echo
            echo "--- trecho do router localuser:"; awk '/^localuser:/{f=1} f{print; if(++n>14) exit}' $T
            echo "--- trecho do router dovecot_virtual_delivery:"; awk '/^dovecot_virtual_delivery:/{f=1} f{print; if(++n>14) exit}' $T
            echo "--- local_domains / domínios locais:"; grep -nE 'domainlist (local_domains|relay_to_domains)|^hostlist|MAIN_LOCAL_DOMAINS' $T | cut -c1-200 | head -8
            echo "--- utilizador de sistema com este nome? $(getent passwd silva.chamo | cut -d: -f1,3,6)"
            echo; echo "### Fila do Exim (12 mensagens): remetente, destinatário, idade, estado"
            $EX -bp 2>&1 | head -60 | cut -c1-200
            echo; echo "### Registos de hoje e de ontem: autenticação e envios de silva.chamo (qualquer domínio)"
            L=/var/log/exim4/mainlog
            for F in $L ${L}.1; do [ -f $F ] && { echo "--- $F: $(wc -l < $F) linhas"; grep -ciE "silva\.chamo" $F | sed 's/^/ocorrências de silva.chamo: /'; grep -iE "silva\.chamo" $F | tail -12 | cut -c1-280; }; done
            echo "--- autenticações recentes (A=) com falhas:"; grep -E "authenticator failed|A=.*(dovecot|login|plain)" $L | tail -12 | cut -c1-250
            echo "--- todas as linhas com Mailer-Daemon@visualdesignmoz hoje/ontem:"; { cat ${L}.1 2>/dev/null; cat $L; } | grep -i "mailer-daemon@visualdesignmoz" | tail -8 | cut -c1-250
            echo "--- paniclog do Exim:"; tail -n 10 /var/log/exim4/paniclog 2>/dev/null | cut -c1-250
            echo; echo "### Dovecot (autenticação) e submissão"
            for F in /var/log/dovecot.log /var/log/mail.log; do [ -f $F ] && { echo "--- $F (silva.chamo, últimas 15):"; grep -i "silva.chamo" $F | tail -15 | cut -c1-260; }; done
            echo "--- portas à escuta: $(ss -ltn 2>/dev/null | awk '{print $4}' | grep -E ':(25|465|587|993|143)$' | sort -u | tr '\n' ' ')"
            echo; echo "### Certificado do servidor de correio (o nome que o cliente vê em 587/465)"
            for H in mail.visualdesignmoz.com mail.basededadosagro.com; do
              echo "--- $H: $(getent hosts $H | awk '{print $1}' | tr '\n' ' ')"
              echo | timeout 8 openssl s_client -starttls smtp -connect $H:587 -servername $H 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ' | cut -c1-260; echo
            done
            echo; echo "### O que o servidor configura para o cliente de e-mail (autoconfig) da conta"
            grep -rn "basededadosagro" /etc/nginx/conf.d /etc/nginx/vd* /etc/dovecot/conf.d /etc/dovecot/*.conf 2>/dev/null | cut -c1-200 | head -10
            echo "autoconfig/autodiscover: $(curl -sk -m 8 https://autoconfig.visualdesignmoz.com/mail/config-v1.1.xml?emailaddress=silva.chamo@visualdesignmoz.com | grep -oE '<(hostname|username|domain)>[^<]*<' | head -8 | tr '\n' ' ')"
