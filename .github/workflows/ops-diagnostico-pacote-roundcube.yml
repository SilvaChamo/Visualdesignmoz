name: "Ops - Contabo: diagnóstico mudança de pacote e assinatura com imagem no Roundcube (só leitura)"
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-diagnostico-pacote-roundcube.yml']
jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== PACOTES ====="
            ls /usr/local/hestia/data/packages/ | head -30
            grep -h "v-change-user-package" /usr/local/hestia/log/*.log 2>/dev/null | tail -15
            echo "--- erros recentes do Hestia ---"; tail -25 /usr/local/hestia/log/error.log 2>/dev/null
            echo "--- contas e pacote actual ---"; /usr/local/hestia/bin/v-list-users plain | awk -F'\t' '{print $1, $2}' | head -30
            echo "===== ROUNDCUBE ====="
            for d in /etc/roundcube /var/lib/roundcube /usr/share/roundcube /var/www/roundcube; do [ -e $d ] && echo "existe: $d"; done
            C=$(ls /etc/roundcube/config.inc.php 2>/dev/null || ls /var/lib/roundcube/config/config.inc.php 2>/dev/null)
            echo "config: $C"
            grep -nE "temp_dir|log_dir|upload|htmleditor|max_message|signature|image|plugins" $C 2>/dev/null | head -30
            grep -rnE "temp_dir|log_dir" /etc/roundcube/*.php 2>/dev/null | head
            for t in /var/lib/roundcube/temp /var/lib/roundcube/logs /var/log/roundcube /tmp; do [ -e $t ] && ls -ld $t; done
            echo "--- erros do roundcube ---"; tail -30 /var/log/roundcube/errors.log 2>/dev/null; tail -15 /var/lib/roundcube/logs/errors.log 2>/dev/null
            echo "--- php ---"; for f in /etc/php/*/fpm/pool.d/*roundcube* /etc/php/*/fpm/pool.d/www.conf; do [ -f $f ] && { echo "$f"; grep -E "^user|^group|upload_max|post_max|open_basedir" $f; }; done 2>/dev/null | head -20
            php -r 'echo "upload_max_filesize=".ini_get("upload_max_filesize")." post_max_size=".ini_get("post_max_size")."\n";'
            grep -rn "roundcube\|webmail" /etc/nginx/conf.d/*.conf 2>/dev/null | head -5
            tail -20 /var/log/nginx/error.log 2>/dev/null | grep -i "roundcube\|webmail\|upload\|permission" | tail -10
