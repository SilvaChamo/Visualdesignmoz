name: "Ops - Copiador de email Hetzner -> Contabo (append-only)"

# ============================================================================
# Copia mensagens de email do Hetzner (fonte de verdade) para o Contabo.
# - NUNCA apaga no destino (sem --delete). So acrescenta o que e novo.
# - Runner do GitHub como intermediario: rsync Hetzner -> runner -> Contabo.
# - Reconstroi indice no Contabo (doveadm force-resync); versoes de Dovecot
#   diferentes (2.4 Hetzner / 2.3 Contabo).
# - A lista de caixas e DESCOBERTA no Hetzner. first_pass=true cria no Hestia
#   os dominios/contas que faltarem antes de sincronizar.
# - Loop le a lista pelo FD 3 e todo o ssh/rsync leva </dev/null, senao o ssh
#   consome a lista e o loop para na 1a linha (bug da 1a versao).
# DESLIGADO (Silva, 17/10/2026: "o Hetzner ja nao esta em uso em nenhum lugar"): ja nao corre de 20 em 20
# minutos; so corre se alguem o lancar a mao no separador Actions.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      first_pass:
        description: "Criar dominios/contas em falta no Contabo antes de sincronizar"
        type: boolean
        default: false

concurrency:
  group: email-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sincronizar email
    runs-on: ubuntu-latest
    steps:
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync sshpass

      - name: Preparar acessos
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_ROOT_PASSWORD: ${{ secrets.CONTABO_ROOT_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          printf '%s' "$CONTABO_ROOT_PASSWORD" > ~/.contabo_pw
          chmod 600 ~/.contabo_pw
          ssh-keyscan -p "$HETZNER_PORT" "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Descobrir caixas no Hetzner"
        env:
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -u
          ssh -n -i ~/.ssh/hetzner -p "$HETZNER_PORT" -o StrictHostKeyChecking=accept-new "$HETZNER_USER@$HETZNER_HOST" \
            'find /home/admin/imap /home/oshercollective/imap -maxdepth 3 -type d -name Maildir 2>/dev/null; for b in /home/admin/Maildir /home/oshercollective/Maildir; do [ -d "$b" ] && echo "$b"; done' \
            | sort > hetzner_maildirs.txt
          echo "Encontradas $(wc -l < hetzner_maildirs.txt) caixas:"
          cat hetzner_maildirs.txt

      - name: "Resolver dominio/conta/hestia-user de cada caixa"
        run: |
          set -u
          hu_for_domain() {
            case "$1" in
              visualdesignmoz.com|files.visualdesignmoz.com|mltmark.com|basededadosagro.com) echo vdadmin;;
              aamihe.com) echo aamihe;;
              provisualcorporate.co.mz) echo provisualcorporate;;
              oshercollective.com|lirandzojewelry.com|msdn-moz.org|elimservicos.com|shalomdeco.com) echo oshercollective;;
              *) echo "";;
            esac
          }
          : > plan.txt   # linhas: SRC|DOMAIN|ACCT|HU
          while read -r SRC <&3; do
            [ -z "$SRC" ] && continue
            case "$SRC" in
              */imap/*)
                DOMAIN=$(printf '%s' "$SRC" | sed -E 's#.*/imap/([^/]+)/[^/]+/Maildir#\1#')
                ACCT=$(printf '%s' "$SRC" | sed -E 's#.*/imap/[^/]+/([^/]+)/Maildir#\1#') ;;
              /home/admin/Maildir)          DOMAIN=visualdesignmoz.com; ACCT=admin ;;
              /home/oshercollective/Maildir) DOMAIN=shalomdeco.com;      ACCT=oshercollective ;;
              *) echo "?? ignoro $SRC"; continue ;;
            esac
            HU=$(hu_for_domain "$DOMAIN")
            if [ -z "$HU" ]; then echo "?? sem hestia-user para $DOMAIN"; continue; fi
            printf '%s|%s|%s|%s\n' "$SRC" "$DOMAIN" "$ACCT" "$HU" >> plan.txt
          done 3< hetzner_maildirs.txt
          echo "Plano ($(wc -l < plan.txt) caixas):"
          cat plan.txt

      - name: "(first_pass) Criar dominios/contas em falta no Contabo"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.first_pass }}
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -u
          HB=/usr/local/hestia/bin
          co() { sshpass -f ~/.contabo_pw ssh -n -o StrictHostKeyChecking=accept-new "root@$CONTABO_HOST" "$@" </dev/null; }
          SEEN_DOM=""
          while IFS='|' read -r SRC DOMAIN ACCT HU <&3; do
            [ -z "${DOMAIN:-}" ] && continue
            case " $SEEN_DOM " in
              *" $DOMAIN "*) : ;;
              *)
                SEEN_DOM="$SEEN_DOM $DOMAIN"
                if co "$HB/v-list-mail-domain $HU $DOMAIN" >/dev/null 2>&1; then
                  echo "dominio $DOMAIN (=$HU) ja existe"
                else
                  echo "+ criar mail domain $DOMAIN (=$HU)"
                  co "$HB/v-add-mail-domain $HU $DOMAIN" 2>&1 || echo "  (falhou)"
                fi ;;
            esac
            if co "$HB/v-list-mail-account $HU $DOMAIN $ACCT" >/dev/null 2>&1; then
              echo "  = $ACCT@$DOMAIN ja existe"
            else
              PW=$(head -c 18 /dev/urandom | base64 | tr -d '/+=' | cut -c1-20)
              echo "  + criar $ACCT@$DOMAIN (password temporaria)"
              co "$HB/v-add-mail-account $HU $DOMAIN $ACCT '$PW'" 2>&1 || echo "  (falhou)"
            fi
          done 3< plan.txt
          echo "==== admin@ dos dominios sem caixa propria -> forward para admin@visualdesignmoz.com ===="
          for D in aamihe.com mltmark.com basededadosagro.com files.visualdesignmoz.com provisualcorporate.co.mz; do
            HU=vdadmin
            [ "$D" = "aamihe.com" ] && HU=aamihe
            [ "$D" = "provisualcorporate.co.mz" ] && HU=provisualcorporate
            co "$HB/v-list-mail-domain $HU $D" >/dev/null 2>&1 || co "$HB/v-add-mail-domain $HU $D" 2>&1 || true
            if ! co "$HB/v-list-mail-account $HU $D admin" >/dev/null 2>&1; then
              co "$HB/v-add-mail-account $HU $D admin '$(head -c 15 /dev/urandom | base64 | tr -d '/+=' | cut -c1-18)'" 2>&1 || true
            fi
            co "$HB/v-add-mail-account-forward $HU $D admin admin@visualdesignmoz.com" 2>&1 || true
          done

      - name: "Sincronizar caixa a caixa (append-only + force-resync)"
        env:
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          EXCL="--exclude=tmp/ --exclude=dovecot-uidlist --exclude=dovecot.index* --exclude=dovecot.list.index* --exclude=dovecot-keywords --exclude=dovecot.mailbox.log"
          COMMON="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          CM="-o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=180"
          HE_E="ssh -i $HOME/.ssh/hetzner -p $HETZNER_PORT $COMMON $CM -o BatchMode=yes"
          CO_E="ssh $COMMON $CM"
          co() { timeout 150 sshpass -f ~/.contabo_pw ssh $COMMON $CM -n "root@$CONTABO_HOST" "$@" </dev/null; }
          OK=0; SKIP=0; FAIL=0; NOCHG=0
          while IFS='|' read -r SRC DOMAIN ACCT HU <&3; do
            [ -z "${SRC:-}" ] && continue
            DST="/home/$HU/mail/$DOMAIN/$ACCT"
            LOCAL="work/$DOMAIN/$ACCT"; mkdir -p "$LOCAL"
            echo "---- $ACCT@$DOMAIN ----"
            # 1) Hetzner -> runner
            if ! timeout 300 rsync -a --timeout=120 $EXCL -e "$HE_E" \
                 "$HETZNER_USER@$HETZNER_HOST:$SRC/" "$LOCAL/" </dev/null; then
              echo "  FALHOU rsync do Hetzner"; FAIL=$((FAIL+1)); rm -rf "$LOCAL"; continue
            fi
            # 2) garantir pasta destino
            co "mkdir -p $DST/cur $DST/new $DST/tmp" >/dev/null 2>&1 || true
            # 3) runner -> Contabo (append-only). -i (itemize) p/ saber se mudou algo
            timeout 300 sshpass -f ~/.contabo_pw rsync -a --timeout=120 $EXCL -i \
                 -e "$CO_E" "$LOCAL/" "root@$CONTABO_HOST:$DST/" </dev/null > push.out 2>&1
            RC=$?
            if [ "$RC" -ne 0 ]; then
              echo "  FALHOU rsync para o Contabo (rc=$RC)"; tail -3 push.out; FAIL=$((FAIL+1)); rm -rf "$LOCAL"; continue
            fi
            CHG=$(grep -cE '^[<>ch][fdL]' push.out || true)
            # 4) so reconstruir indice se algo foi transferido
            if [ "${CHG:-0}" -gt 0 ]; then
              RES=$(co "chown -R $HU:mail /home/$HU/mail/$DOMAIN/$ACCT && timeout 120 doveadm force-resync -u $ACCT@$DOMAIN '*' 2>&1 | tail -2" || echo "force-resync-timeout")
              N=$(co "doveadm mailbox status -u $ACCT@$DOMAIN messages INBOX 2>/dev/null || true" || true)
              case "$RES" in
                *"doesn't exist"*|*"Error"*) echo "  SKIP ($RES)"; SKIP=$((SKIP+1)) ;;
                *) echo "  OK  ($CHG itens, INBOX=$N) $RES"; OK=$((OK+1)) ;;
              esac
            else
              echo "  sem alteracoes"; NOCHG=$((NOCHG+1))
            fi
            rm -rf "$LOCAL"
          done 3< plan.txt
          echo "======================================="
          echo "OK=$OK  SEM-ALTERACAO=$NOCHG  SKIP=$SKIP  FAIL=$FAIL"
          [ "$FAIL" -eq 0 ]
