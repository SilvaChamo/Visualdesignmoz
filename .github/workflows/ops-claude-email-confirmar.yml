name: "Ops - E-mail (só leitura): o Mac do Silva já entra nas 5 caixas?"

# 13/10/2026: depois de o Contabo aceitar também as palavras-passe do Hetzner, o Silva reabriu o Mail e as Notas e já
# não lhe pediram a palavra-passe. SÓ LEITURA: conta entradas bem/mal sucedidas nas 5 caixas desde a mudança
# (05:28 UTC = 07:28 no servidor) e mostra o estado da limpeza automática. Nada é alterado.

on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-email-confirmar.yml']

jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set +e
            L=$(awk '$3 >= "07:28:00" && $1 == "Oct" && $2 == "13"' /var/log/dovecot.log 2>/dev/null)
            echo "===== desde a mudança (13/10 07:28, hora do servidor) ====="
            for u in silva.chamo info suporte mailmarketing geral; do
              ok=$(echo "$L" | grep -c "Login: user=<$u@visualdesignmoz.com>")
              mal=$(echo "$L" | grep -iE "auth failed|password mismatch" | grep -c "user=<$u@visualdesignmoz.com>")
              ult=$(echo "$L" | grep "Login: user=<$u@visualdesignmoz.com>" | tail -1 | awk '{print $3}')
              echo "  $u@visualdesignmoz.com: entradas=$ok  falhas=$mal  última entrada=${ult:--}"
            done
            echo "  aplicação: $(echo "$L" | grep 'ID sent' | grep 'rip=41\.220\.' | grep -oE 'name=[^,]*' | sort | uniq -c | tr '\n' ' ')"
            echo "===== todas as caixas ====="
            echo "  entradas com sucesso: $(echo "$L" | grep -c 'Login: user=<')"
            echo "  falhas:               $(echo "$L" | grep -ciE 'auth failed|password mismatch')"
            echo "===== limpeza automática ====="
            echo "  $(/usr/local/sbin/visualdesign-hetzner-passwd-sync 2>&1)"
            grep -c . /etc/dovecot/hetzner-passwd/.estado | sed 's/^/  caixas com a palavra-passe do Hetzner: /'
