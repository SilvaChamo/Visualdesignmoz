name: Ops - Porque o PHP de uma conta e lento (disco, OPcache e ficheiros, so leitura)

# O perfil do PHP de 30/10/2026 mostrou o entrecamposblog.com parado em chamadas a ficheiros (file_exists, is_file, include, file_get_contents): o PHP
# espera pelo disco ou compila tudo em cada pedido. Só LÊ: pressão de I/O, CPU e memória do servidor, discos, OPcache do PHP dedicado da conta
# contra o partilhado, extensões, open_basedir, tempo de percorrer a pasta do site e tamanho das pastas de cache. Não altera nada.

on:
  push:
    branches: [php-lento-disco-e-opcache]
    paths: ['.github/workflows/ops-php-disco.yml']
  workflow_dispatch:
    inputs:
      conta:
        description: 'Conta'
        required: true
        default: 'entrecampos'
      dominio:
        description: 'Domínio'
        required: true
        default: 'entrecamposblog.com'

concurrency:
  group: ops-php-disco
  cancel-in-progress: false

jobs:
  leitura:
    runs-on: ubuntu-latest
    steps:
      - name: Disco e OPcache (servidor, só leitura)
        uses: appleboy/ssh-action@v1.2.5
        env:
          CONTA: ${{ inputs.conta || 'entrecampos' }}
          DOMINIO: ${{ inputs.dominio || 'entrecamposblog.com' }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          envs: CONTA,DOMINIO
          script: |
            set -u
            echo "$CONTA" | grep -qE '^[a-z0-9_-]{2,32}$' || { echo "Conta inválida"; exit 1; }
            echo "$DOMINIO" | grep -qE '^[a-z0-9.-]{3,80}$' || { echo "Domínio inválido"; exit 1; }
            V=8.3; D=/etc/php/$V/fpm-contas/$CONTA; R=/home/$CONTA/web/$DOMINIO/public_html
            t() { echo; echo "=================== $1"; }
            t "1. Pressão do servidor (some = alguém espera; avg10 alto = o servidor está a esperar por isto)"
            for r in io cpu memory; do echo "$r: $(grep -E '^(some|full)' /proc/pressure/$r 2>/dev/null | tr '\n' ' ')"; done
            vmstat 1 4 2>/dev/null | tail -5
            t "2. Discos"
            df -h / /home 2>/dev/null; lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,ROTA 2>/dev/null | head -12
            mount | grep -E ' / | /home ' | cut -c1-160
            command -v iostat >/dev/null && iostat -x 1 3 2>/dev/null | tail -14 || echo "(sem iostat)"
            t "3. OPcache e extensões: PHP dedicado da conta contra o partilhado"
            for cfg in "dedicado|$D/php.ini|$D/conf.d" "partilhado|/etc/php/$V/fpm/php.ini|/etc/php/$V/fpm/conf.d"; do
              n=${cfg%%|*}; r=${cfg#*|}; ini=${r%%|*}; cd_=${r#*|}
              echo "--- $n: módulos activos: $(ls "$cd_" 2>/dev/null | sed -n 's/^[0-9]*-\(.*\)\.ini$/\1/p' | tr '\n' ' ')"
              PHP_INI_SCAN_DIR="$cd_" /usr/sbin/php-fpm$V -c "$ini" -i 2>/dev/null | grep -E '^(opcache\.(enable|enable_cli|memory_consumption|max_accelerated_files|validate_timestamps|revalidate_freq|interned_strings_buffer|jit)|realpath_cache_size|realpath_cache_ttl|open_basedir) ' | sed 's/ =>.*=> / = /' | tr '\n' ';'; echo
            done
            echo "--- pools da conta (open_basedir, limites):"; grep -HE '^(php_admin_value\[open_basedir\]|pm|pm\.max_children|request_terminate_timeout|php_value|php_admin_value)' $D/pool.d/*.conf 2>/dev/null | cut -c1-200 | head -20
            t "4. A pasta do site: tamanho e tempo a percorrer"
            echo "ficheiros em public_html: $(find "$R" -type f 2>/dev/null | wc -l) · pastas: $(find "$R" -type d 2>/dev/null | wc -l)"
            echo "wp-content: $(du -sh "$R/wp-content" 2>/dev/null | cut -f1) · uploads: $(du -sh "$R/wp-content/uploads" 2>/dev/null | cut -f1) · cache: $(du -sh "$R/wp-content/cache" 2>/dev/null | cut -f1) · plugins: $(ls "$R/wp-content/plugins" 2>/dev/null | wc -l)"
            echo "ficheiros em wp-content/cache: $(find "$R/wp-content/cache" -type f 2>/dev/null | wc -l) · em wp-content/upgrade: $(find "$R/wp-content/upgrade" -type f 2>/dev/null | wc -l)"
            s=$(date +%s.%N); find "$R/wp-content/plugins" -type f 2>/dev/null | wc -l | tr '\n' ' '; e=$(date +%s.%N); echo "ficheiros em plugins · tempo a percorrer: $(echo "$e - $s" | bc -l | cut -c1-5) s"
            s=$(date +%s.%N); sudo -u "$CONTA" php -r 'for($i=0;$i<2000;$i++){ file_exists("'$R'/wp-content/plugins/wp-optimize/wp-optimize.php"); clearstatcache(); }' 2>&1 | head -2; e=$(date +%s.%N); echo "2000 file_exists reais (php-cli): $(echo "$e - $s" | bc -l | cut -c1-5) s"
            echo "--- dono dos ficheiros (amostra): $(stat -c '%U:%G %a' "$R/index.php" "$R/wp-config.php" "$R/wp-content/plugins/elementor/elementor.php" 2>&1 | tr '\n' ' ')"
            t "5. Quem mais lê o disco agora"
            ps -eo pid,user:12,stat,pcpu,args --sort=-pcpu 2>/dev/null | awk '$3 ~ /D/ {print}' | head -8
            ps -eo user:12,pcpu,pmem,comm --sort=-pcpu | head -8
            t "fim da leitura (nada foi alterado)"
