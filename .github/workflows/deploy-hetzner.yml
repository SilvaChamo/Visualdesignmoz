name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy on push to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files to Hetzner
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HETZNER_PORT }}" \
            --exclude 'node_modules' --exclude '.next' --exclude '.git' --exclude '*.env*' --exclude '.DS_Store' \
            ./ "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/visualdesign-site/"

      - name: Build and restart on Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # 'npm ci && npm run build' corre aqui outra vez, agora no próprio
          # servidor — em picos de carga/rede facilmente passa dos 10 min por
          # omissão desta acção, que corta a ligação a meio (foi o que aconteceu
          # nos deploys recentes, interrompendo antes até do pm2 restart correr).
          command_timeout: 30m
          script: |
            set -e
            cd /opt/visualdesign-site
            touch .env.local
            set_env_var() {
              local key="$1" value="$2"
              if grep -q "^${key}=" .env.local; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env.local
              else
                echo "${key}=${value}" >> .env.local
              fi
            }
            set_env_var DYNADOT_ENV "production"
            set_env_var DYNADOT_API_KEY "${{ secrets.DYNADOT_API_KEY }}"
            set_env_var DYNADOT_SECRET_KEY "${{ secrets.DYNADOT_SECRET_KEY }}"
            set_env_var CRON_SECRET "${{ secrets.CRON_SECRET }}"
            set_env_var CLOUDFLARE_API_TOKEN_ACCOUNT "${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT }}"
            set_env_var CLOUDFLARE_ACCOUNT_ID "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            # HESTIA_* só para o código compilar/carregar sem erro — DEFAULT_HOSTING_PROVIDER
            # fica de propósito por definir aqui, para as contas novas continuarem a ir
            # para o DirectAdmin como sempre (só o Contabo liga o Hestia).
            set_env_var HESTIA_HOST "${{ secrets.HESTIA_HOST }}"
            set_env_var HESTIA_USER "${{ secrets.HESTIA_USER }}"
            set_env_var HESTIA_PASSWORD "${{ secrets.HESTIA_PASSWORD }}"
            # getServerHost() lê NEXT_PUBLIC_SERVER_IP; nunca foi definido aqui
            # — funcionava por coincidência, porque o valor por omissão no
            # código (DEFAULT_SERVER_IP) já era este IP do Hetzner. Definido
            # explicitamente para não depender dessa coincidência (achado
            # ao corrigir o mesmo problema, real, no Contabo — 1 set).
            set_env_var NEXT_PUBLIC_SERVER_IP "${{ secrets.HETZNER_HOST }}"
            # node_modules já ficou corrompido antes por um deploy anterior ter sido
            # cortado a meio (timeout) — 'npm ci' sozinho não repara isso (ENOTEMPTY
            # ao tentar apagar uma pasta parcialmente removida). Começar sempre do
            # zero evita essa classe de falha, ao custo de um install mais lento.
            rm -rf node_modules
            npm ci
            npm run build
            pm2 restart visualdesign-site || pm2 start npm --name "visualdesign-site" -- start -- -p 3003
            pm2 save

            # Cron real dos avisos de renovação e do sync DirectAdmin<->Supabase —
            # sem isto nenhum dos dois corre sozinho (ficavam dependentes de um
            # admin clicar manualmente no painel). Idempotente: substitui só as
            # linhas marcadas com a própria tag, nunca mexe no resto do crontab.
            #
            # NOTA (confirmado ao vivo 1 set): 'src/proxy.ts' redirecciona (308)
            # qualquer pedido feito a 127.0.0.1 para 'localhost' — sem o cabeçalho
            # Host correcto abaixo, estes curls nunca executam a lógica, só levam
            # o redirect e ficam silenciosamente sem fazer nada (era o caso de
            # dns-retry e da-sync antes desta correcção).
            CRON_SECRET_VALUE=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2-)
            (crontab -l 2>/dev/null | grep -v '# visualdesign-renewal-check'; \
              echo "*/30 * * * * curl -fsS -H \"Host: visualdesignmoz.com\" \"http://127.0.0.1:3003/api/cron/renewal-check?secret=${CRON_SECRET_VALUE}\" >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-renewal-check") | crontab -
            (crontab -l 2>/dev/null | grep -v '# visualdesign-da-sync'; \
              echo "*/20 * * * * curl -fsS -H \"Host: visualdesignmoz.com\" -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3003/api/cron/da-sync >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-da-sync") | crontab -
            # Reprocessa domínios comprados cujo DNS (zona Cloudflare + nameservers)
            # ficou por concluir (dns_status='pending') — antes só recuperava com um
            # admin a carregar manualmente em "Reprocessar Configuração DNS".
            (crontab -l 2>/dev/null | grep -v '# visualdesign-dns-retry'; \
              echo "*/30 * * * * curl -fsS -H \"Host: visualdesignmoz.com\" -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3003/api/cron/dns-retry >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-dns-retry") | crontab -
            # Reprocessa domínios cujo DNS já está confirmado mas cuja autenticação
            # na Brevo ainda não foi confirmada (a Brevo pode demorar até 48h a
            # confirmar propagação) — antes disto só ficava resolvido se alguém
            # fosse ao site da Brevo carregar manualmente em "Autenticar".
            (crontab -l 2>/dev/null | grep -v '# visualdesign-brevo-retry'; \
              echo "*/30 * * * * curl -fsS -H \"Host: visualdesignmoz.com\" -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3003/api/cron/brevo-retry >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-brevo-retry") | crontab -
