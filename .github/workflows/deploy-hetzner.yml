name: Deploy to Hetzner

on:
  # Hetzner desligado em 2026-10-19 — o site a sério passou a ser servido pela
  # Contabo (ver deploy-contabo.yml, agora também a disparar a cada push a
  # main). Deixou de disparar sozinho para não falhar em cada push; fica só
  # manual, para o caso de o Hetzner voltar a ligar-se. O paths-ignore que
  # existia aqui só fazia sentido com o gatilho push; sem ele, não é preciso.
  workflow_dispatch:

# uma publicação de cada vez: um push novo espera que a anterior acabe (duas sobrepostas já estragaram node_modules)
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on push to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # O código novo vai para uma pasta à parte (…-build), não para a do site em funcionamento: o site continua a
      # servir a versão anterior enquanto a nova é instalada e construída (ver "Publicar sem cortes" mais abaixo).
      - name: Sync files to Hetzner
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HETZNER_PORT }}" \
            --exclude 'node_modules' --exclude '.next' --exclude '.git' --exclude '*.env*' --exclude '.DS_Store' \
            ./ "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/visualdesign-site-build/"

      - name: Build and restart on Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # 'npm ci && npm run build' corre aqui outra vez, agora no próprio
          # servidor — em picos de carga/rede facilmente passa dos 10 min por
          # omissão desta acção, que corta a ligação a meio (foi o que aconteceu
          # nos deploys recentes, interrompendo antes até do pm2 restart correr).
          command_timeout: 30m
          script: |
            set -e
            cd /opt/visualdesign-site
            touch .env.local
            set_env_var() {
              # grep -v + reescrever em vez de "sed -i s|...|...|" — um valor
              # secreto com caracteres especiais (ex.: aconteceu com
              # BREVO_API_KEY) quebrava o delimitador do sed e fazia o
              # deploy inteiro falhar.
              local key="$1" value="$2"
              grep -v "^${key}=" .env.local > .env.local.tmp || true
              mv .env.local.tmp .env.local
              echo "${key}=${value}" >> .env.local
            }
            set_env_var DYNADOT_ENV "production"
            set_env_var DYNADOT_API_KEY "${{ secrets.DYNADOT_API_KEY }}"
            set_env_var DYNADOT_SECRET_KEY "${{ secrets.DYNADOT_SECRET_KEY }}"
            set_env_var CRON_SECRET "${{ secrets.CRON_SECRET }}"
            set_env_var CLOUDFLARE_API_TOKEN_ACCOUNT "${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT }}"
            set_env_var CLOUDFLARE_ACCOUNT_ID "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            # Global API Key (14 ago 2026, ver deploy-contabo.yml) — o token
            # acima não consegue criar zonas novas na Cloudflare nem escrever
            # registos DNS (permissão em falta). Nunca tinha sido ligada aqui,
            # por isso toda a escrita de DNS em produção falhava sempre com
            # "Authentication error" — descoberto 24 ago via elimservicos.com.
            set_env_var CLOUDFLARE_EMAIL "${{ secrets.CLOUDFLARE_EMAIL }}"
            set_env_var CLOUDFLARE_GLOBAL_API_KEY "${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}"
            # Sem isto, o passo de DNS de e-mail e o remetente Brevo de
            # autoProvisionPurchasedDomain falham sempre em silêncio depois de
            # uma compra/transferência de domínio (nunca tinha sido ligado ao
            # deploy, só existia no .env.local local) — descoberto 19 ago via
            # o caso real do aamihe.com.
            set_env_var BREVO_API_KEY "${{ secrets.BREVO_API_KEY }}"
            # HESTIA_* só para o código compilar/carregar sem erro — DEFAULT_HOSTING_PROVIDER
            # fica de propósito por definir aqui, para as contas novas continuarem a ir
            # para o DirectAdmin como sempre (só o Contabo liga o Hestia).
            set_env_var HESTIA_HOST "${{ secrets.HESTIA_HOST }}"
            set_env_var HESTIA_USER "${{ secrets.HESTIA_USER }}"
            set_env_var HESTIA_PASSWORD "${{ secrets.HESTIA_PASSWORD }}"
            # Publicar sem cortes (Silva, 14/10/2026 — o site mostrava "502 Bad Gateway" a cada publicação): antes, o
            # "rm -rf node_modules", o "npm ci" e o build corriam na pasta do site em funcionamento e, durante os ~3 min,
            # o site não respondia. Agora instala-se e constrói-se na pasta à parte (STAGE, onde o rsync acima pôs o
            # código novo) com o site a servir a versão anterior; no fim troca-se em segundos (como no Contabo,
            # deploy-contabo.yml). Se a instalação ou o build falharem (set -e), o site fica como estava.
            LIVE=/opt/visualdesign-site
            STAGE=/opt/visualdesign-site-build
            # a pasta à parte precisa de ~2 GB (node_modules + .next) além da versão em funcionamento: sem espaço, pára
            # já, antes de mexer em nada (o servidor tem também as bases de dados e o e-mail)
            LIVRE_KB=$(df -Pk /opt | awk 'NR==2 {print $4}')
            if [ "${LIVRE_KB:-0}" -lt 4000000 ]; then echo "ERRO: só $((LIVRE_KB / 1024)) MB livres em /opt; são precisos 4 GB para construir à parte. O site fica como está."; exit 1; fi
            # as variáveis (.env.local, escrito acima na pasta do site) entram no build (NEXT_PUBLIC_*)
            for f in "$LIVE"/.env*; do if [ -f "$f" ]; then cp -a "$f" "$STAGE"/; fi; done
            cd "$STAGE"
            # sempre do zero na pasta à parte: um node_modules ou um .next de uma publicação cortada a meio nunca
            # chegam ao site (ENOTEMPTY, "client reference manifest ... does not exist")
            rm -rf node_modules .next
            npm ci
            npm run build
            # Troca (o site só pára estes segundos): o código por rsync, com as mesmas exclusões de sempre (os .env*,
            # .git e .DS_Store da pasta do site ficam intactos); node_modules e .next por mv (instantâneo, mesmo disco).
            pm2 stop visualdesign-site || true
            rsync -a --delete --exclude 'node_modules' --exclude '.next' --exclude '.git' --exclude '*.env*' --exclude '.DS_Store' "$STAGE"/ "$LIVE"/
            rm -rf "$LIVE/node_modules.old" "$LIVE/.next.old"
            if [ -d "$LIVE/node_modules" ]; then mv "$LIVE/node_modules" "$LIVE/node_modules.old"; fi
            if [ -d "$LIVE/.next" ]; then mv "$LIVE/.next" "$LIVE/.next.old"; fi
            mv "$STAGE/node_modules" "$LIVE/node_modules"
            mv "$STAGE/.next" "$LIVE/.next"
            cd "$LIVE"
            pm2 start visualdesign-site || pm2 start npm --name "visualdesign-site" -- start -- -p 3003
            pm2 save
            # a versão anterior só se apaga depois de a nova estar a correr
            rm -rf "$LIVE/node_modules.old" "$LIVE/.next.old"

            # Cron real dos avisos de renovação e do sync DirectAdmin<->Supabase —
            # sem isto nenhum dos dois corre sozinho (ficavam dependentes de um
            # admin clicar manualmente no painel). Idempotente: substitui só as
            # linhas marcadas com a própria tag, nunca mexe no resto do crontab.
            CRON_SECRET_VALUE=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2-)
            (crontab -l 2>/dev/null | grep -v '# visualdesign-renewal-check'; \
              echo "7,37 * * * * curl -fsS \"http://127.0.0.1:3003/api/cron/renewal-check?secret=${CRON_SECRET_VALUE}\" >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-renewal-check") | crontab -
            (crontab -l 2>/dev/null | grep -v '# visualdesign-da-sync'; \
              echo "13,33,53 * * * * curl -fsS -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3003/api/cron/da-sync >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-da-sync") | crontab -
            # Reprocessa domínios comprados cujo DNS (zona Cloudflare + nameservers)
            # ficou por concluir (dns_status='pending') — antes só recuperava com um
            # admin a carregar manualmente em "Reprocessar Configuração DNS".
            (crontab -l 2>/dev/null | grep -v '# visualdesign-dns-retry'; \
              echo "19,49 * * * * curl -fsS -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3003/api/cron/dns-retry >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-dns-retry") | crontab -
