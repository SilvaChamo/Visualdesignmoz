name: Ops - Campos de pacote do alojamento (só leitura)

# Mostra o que o Hestia deste servidor aceita num pacote: versão, os pacotes existentes, como o Hestia valida cada
# campo e que comandos de pacote existem. NÃO altera nada.

on:
  workflow_dispatch:

concurrency:
  group: ops-campos-pacote
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Ler campos de pacote (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            H=/usr/local/hestia
            echo "=== v-add-user-package: verificação de consistência (linhas 26-100) ==="
            sed -n 26,100p $H/bin/v-add-user-package
            echo "=== func/main.sh: validadores de CPU/memória/swap (1470-1545) ==="
            sed -n 1470,1545p $H/func/main.sh
            echo "=== shells válidos ==="
            cat /etc/shells | grep -v '^#'
            echo "=== modelos (web / proxy / backend / dns) ==="
            for c in v-list-web-templates v-list-web-templates-proxy v-list-web-templates-backend v-list-dns-templates; do echo "--- $c"; $H/bin/$c plain 2>/dev/null | tr '\n' ' '; echo; done
            echo "=== v-rename-user-package ==="
            grep -v '^#\|^$' $H/bin/v-rename-user-package | head -50
            echo "=== v-copy-user-package ==="
            grep -v '^#\|^$' $H/bin/v-copy-user-package | head -40
