name: "Ops - Contabo: host.visualdesignmoz.com (443 e 2026) redirecciona para visualdesignmoz.com/vhost/2026/"

# ============================================================================
# Pedido do Silva (13/10/2026): só dois endereços — o site https://visualdesignmoz.com/ e o painel
# https://visualdesignmoz.com/vhost/2026/. O antigo https://host.visualdesignmoz.com:2026/evo/ (e qualquer
# endereço em host.visualdesignmoz.com, na 443 ou na 2026) passa a redireccionar para o painel.
#  - fica de fora /.well-known/ (renovação do certificado de host.) e /api/ (webhooks);
#  - se o nginx -t falhar, repõe os ficheiros como estavam e não recarrega.
# Não mexe em dados, e-mail nem DNS. Corre só quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.
# ============================================================================

on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-contabo-host-redirect.yml']

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Redireccionar host. para o painel
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 10m
          script: |
            set +e
            DIR=/home/vdadmin/conf/web/host.visualdesignmoz.com
            P2026=/etc/nginx/conf.d/visualhost-porta2026.conf
            BK=/root/visualhost-backup-$(date +%Y%m%d%H%M%S)
            mkdir -p "$BK" && cp -a "$P2026" "$BK"/ 2>/dev/null
            echo "cópia de segurança em $BK"

            echo "===== 1. host. na 443 e 80 ====="
            for f in nginx.ssl.conf_vhost2026 nginx.conf_vhost2026; do
            cat > "$DIR/$f" <<'NGINX'
            # VisualHost (13/10/2026): host.visualdesignmoz.com deixou de ser endereço do painel — vai tudo para o
            # endereço único https://visualdesignmoz.com/vhost/2026/ (menos a renovação do certificado e /api/).
            set $vh_ir 1;
            if ($request_uri ~ "^/(\.well-known|api)/") { set $vh_ir 0; }
            if ($vh_ir = 1) { return 307 https://visualdesignmoz.com/vhost/2026/; }
            NGINX
            echo "  escrito $DIR/$f"
            done

            echo "===== 2. porta 2026 ====="
            cat > "$P2026" <<'NGINX'
            # VisualHost: https://host.visualdesignmoz.com:2026/ — endereço do painel (DirectAdmin) no Hetzner. Desde
            # 13/10/2026 só redirecciona para o endereço único do painel, https://visualdesignmoz.com/vhost/2026/.
            server {
                listen 2026 ssl;
                server_name host.visualdesignmoz.com;

                ssl_certificate     /home/vdadmin/conf/web/host.visualdesignmoz.com/ssl/host.visualdesignmoz.com.pem;
                ssl_certificate_key /home/vdadmin/conf/web/host.visualdesignmoz.com/ssl/host.visualdesignmoz.com.key;

                # quem escrever http:// nesta porta também vai para o painel
                error_page 497 =307 https://visualdesignmoz.com/vhost/2026/;

                location / {
                    return 307 https://visualdesignmoz.com/vhost/2026/;
                }
            }
            NGINX

            echo "===== 3. testar e recarregar ====="
            if nginx -t >/dev/null 2>&1; then
              nginx -t 2>&1 | tail -1
              systemctl reload nginx && echo "  nginx recarregado"
            else
              nginx -t 2>&1 | tail -5
              echo "ERRO: nginx -t falhou — reponho como estava"
              rm -f "$DIR/nginx.ssl.conf_vhost2026" "$DIR/nginx.conf_vhost2026"
              cp -a "$BK/$(basename "$P2026")" "$P2026"
              nginx -t >/dev/null 2>&1 && systemctl reload nginx
              exit 1
            fi

            echo "===== 4. verificação ====="
            sleep 2
            for u in https://host.visualdesignmoz.com:2026/evo/ https://host.visualdesignmoz.com:2026/ http://host.visualdesignmoz.com:2026/ https://host.visualdesignmoz.com/ https://host.visualdesignmoz.com/vhost https://visualdesignmoz.com/vhost/2026/ https://visualdesignmoz.com/; do
              echo -n "  $u -> "; curl -s -o /tmp/r.html -w "%{http_code} %{redirect_url}" --max-time 20 "$u"; echo " | $(grep -o '<title>[^<]*' /tmp/r.html | head -1)"; rm -f /tmp/r.html
            done
