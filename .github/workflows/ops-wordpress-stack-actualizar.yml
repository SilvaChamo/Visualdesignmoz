name: Ops - Actualizar o mu-plugin do stack (Jetpack bloqueado) nos sites WordPress que já existem

# Copia o `deploy/wordpress/visualdesign/stack.php` para o mu-plugin de cada site WordPress do servidor que já o tem (os sites novos recebem-no do
# `wp-cache-on-site.sh`), para o Jetpack e a família deixarem de se poder instalar e activar (Silva, 30/10/2026: o xmlrpc.php fica sempre bloqueado) e para
# as imagens serem comprimidas e convertidas em WebP (até 250 KB) ao subir.
# Antes de copiar testa a sintaxe com `php -l`; guarda a cópia do ficheiro antigo em /root/stack-actualizar-<data>/; mantém o dono do ficheiro.
# Mostra, por site, se já tem o Jetpack (e o apaga só quando o próprio WordPress correr a limpeza, na próxima visita ao painel).
# Sem «aplicar» só lê. Nunca toca no pm2 nem no nginx.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Aplicar (desligado = só ler)'
        type: boolean
        default: false

concurrency:
  group: ops-wordpress-stack-actualizar
  cancel-in-progress: false

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar o stack
        id: pacote
        run: echo "stack=$(base64 -w0 deploy/wordpress/visualdesign/stack.php)" >> "$GITHUB_OUTPUT"

      - name: Actualizar no servidor
        uses: appleboy/ssh-action@v1.2.5
        env:
          STACK: ${{ steps.pacote.outputs.stack }}
          APLICAR: ${{ inputs.aplicar }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          envs: STACK,APLICAR
          script: |
            set -u
            FALHOU=0
            # o registo do GitHub nem sempre se consegue abrir: o resumo sai também como anotação da tarefa (uma linha, separada por «|»)
            : > /tmp/saida-stack.txt; exec > >(tee -a /tmp/saida-stack.txt) 2>&1
            trap 'sleep 1; echo "::notice title=Resumo::$(tr "\n" "|" < /tmp/saida-stack.txt | cut -c1-3500)"' EXIT
            T=/tmp/stack-novo.php; echo "$STACK" | base64 -d > "$T"
            php -l "$T" >/dev/null 2>&1 || { echo "ERRO: o stack.php novo tem erro de sintaxe; nada foi mudado"; exit 1; }
            grep -q "VD_BLOCKED_JETPACK_PLUGINS" "$T" && grep -q "vd_img_otimizar_upload" "$T" && grep -q "vd-contexto-admin" "$T" && grep -q "vd-wpo-gzip" "$T" || { echo "ERRO: o stack.php não tem a lista do Jetpack, a compressão de imagens, o alias do Jet Elements e o contexto de administração e o corte do pedido do Gzip do WP-Optimize"; exit 1; }
            B=/root/stack-actualizar-$(date +%Y%m%d-%H%M%S); [ "$APLICAR" = "true" ] && { install -d -m 700 "$B"; echo "cópias em $B"; }
            echo "=== sites WordPress (conta · domínio · stack · jetpack)"
            for f in /home/*/web/*/public_html/wp-content/mu-plugins/visualdesign/stack.php; do
              [ -f "$f" ] || continue
              u=$(echo "$f" | cut -d/ -f3); dom=$(echo "$f" | cut -d/ -f5); raiz=/home/$u/web/$dom/public_html
              ja=$(grep -c "vd-wpo-gzip" "$f")
              jp=$([ -d "$raiz/wp-content/plugins/jetpack" ] && echo "TEM O JETPACK" || echo "sem Jetpack")
              if [ "$APLICAR" = "true" ] && [ "$ja" = 0 ]; then
                cp -p "$f" "$B/$u-$dom-stack.php"
                if cat "$T" > "$f" && chown --reference="$B/$u-$dom-stack.php" "$f"; then echo "$u $dom: stack actualizado · $jp"; else echo "$u $dom: FALHOU ao copiar o stack"; FALHOU=1; fi
              else
                echo "$u $dom: stack $([ "$ja" -gt 0 ] && echo 'já actualizado' || echo 'POR ACTUALIZAR') · $jp"
              fi
            done
            echo "=== sites WordPress sem o mu-plugin do stack (nada a fazer aqui):"
            for d in /home/*/web/*/public_html; do
              [ -f "$d/wp-config.php" ] || continue
              [ -f "$d/wp-content/mu-plugins/visualdesign/stack.php" ] || echo "$(echo "$d" | cut -d/ -f3) $(echo "$d" | cut -d/ -f5)"
            done
            echo "=== sites críticos"
            for s in https://basededadosagro.com https://entrecamposblog.com https://mltmark.com; do c=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$s" 2>&1 | cut -c1-40); printf '%s %s\n' "$s" "$c"; case "$c" in 200|301|302) ;; *) FALHOU=1;; esac; done
            # a tarefa fica a vermelho se um site não actualizou ou um site crítico não respondeu (o registo do GitHub nem sempre se consegue abrir)
            [ "${FALHOU:-0}" = 0 ] || { echo "ATENÇÃO: ver as linhas acima"; exit 1; }
