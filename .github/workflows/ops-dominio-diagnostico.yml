name: Ops - Diagnóstico de um domínio depois da passagem de conta (só leitura)

# Só LÊ, não altera nada: para um domínio que acabou de passar de uma conta para outra, mostra de que conta é agora, se sobrou configuração
# da conta antiga, o que o nginx e o Apache têm para ele, o certificado que o servidor entrega de facto, o que respondem a página e o
# wp-login (por este servidor e pelo DNS público) e os erros recentes. Sem wp-config nem variáveis. Pedido do Silva a 30/10/2026.

on:
  workflow_dispatch:
    inputs:
      dominio:
        description: 'Domínio (ex.: entrecamposblog.com)'
        required: true
        default: 'entrecamposblog.com'
  push:
    branches: [continuar-correccoes-contas-e-dominios]
    paths: ['.github/workflows/ops-dominio-diagnostico.yml']

concurrency:
  group: ops-dominio-diagnostico
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico do domínio (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOMINIO: ${{ inputs.dominio || 'entrecamposblog.com' }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          envs: DOMINIO
          script: |
            set -u
            H=/usr/local/hestia/bin
            echo "=== hora: $(date '+%H:%M:%S %Z')"
            echo "=== sites que têm de estar no ar (3 tentativas cada: código e tempo)"
            for s in https://visualdesignmoz.com https://basededadosagro.com https://mltmark.com; do
              for i in 1 2 3; do printf '%s %s\n' "$s" "$(curl -s -o /dev/null -m 15 -w '%{http_code} %{time_total}s %{redirect_url}' "$s" 2>&1 | cut -c1-100)"; sleep 1; done
            done
            echo "--- visualdesignmoz por este servidor: $(curl -sk -o /dev/null -m 10 -w '%{http_code}' --resolve visualdesignmoz.com:443:127.0.0.1 https://visualdesignmoz.com/)"
            echo "--- app na porta 3002: $(curl -s -o /dev/null -m 8 -w '%{http_code}' http://127.0.0.1:3002/)"
            pm2 jlist 2>/dev/null | python3 -c "import sys,json; [print('pm2', a['name'], a['pm2_env']['status'], 'reinícios', a['pm2_env'].get('restart_time')) for a in json.load(sys.stdin)]" 2>&1 | head -6
            echo
            echo "=== basededadosagro.com"
            for u in vdadmin bsededados; do echo "web.conf de $u: $(grep -c "DOMAIN='basededadosagro.com'" /usr/local/hestia/data/users/$u/web.conf 2>/dev/null) · SUSPENDED=$(grep "DOMAIN='basededadosagro.com'" /usr/local/hestia/data/users/$u/web.conf 2>/dev/null | grep -o "SUSPENDED='[^']*'") · TPL/PROXY=$(grep "DOMAIN='basededadosagro.com'" /usr/local/hestia/data/users/$u/web.conf 2>/dev/null | grep -oE "(TPL|PROXY|BACKEND)='[^']*'" | tr '\n' ' ')"; done
            echo "conf da conta: $(ls /home/bsededados/conf/web/basededadosagro.com 2>&1 | tr '\n' ' ')"
            echo "nginx que mencionam a porta 3010 ou o domínio:"; grep -rlE "3010|basededadosagro" /etc/nginx 2>/dev/null | head -8
            echo "serviço: $(systemctl is-active basededadosagro-site) · porta 3010: $(curl -s -o /dev/null -m 8 -w '%{http_code}' http://127.0.0.1:3010/)"
            echo "últimas passagens do domínio:"; grep -h "basededadosagro" /usr/local/hestia/log/system.log 2>/dev/null | tail -n 8 | cut -c1-170
            echo "cópia da passagem: $(ls -d /root/vh-passagens/*basededadosagro* 2>/dev/null | tail -1) · conteúdo: $(ls $(ls -d /root/vh-passagens/*basededadosagro* 2>/dev/null | tail -1) 2>&1 | tr '\n' ' ')"
            echo
            echo "=== Hestia: de onde vem o erro do pool (func/domain.sh)"
            sed -n 95,135p /usr/local/hestia/func/domain.sh
            echo "--- pools.d que existem: $(find -L /etc/php -type d -name pool.d 2>/dev/null | tr '\n' ' ')"
            echo "--- modelo default: $(grep -hE '^(user|listen|php_admin_value\[error_log)' /usr/local/hestia/data/templates/web/php-fpm/default.tpl 2>/dev/null | head -4 | tr '\n' ' ')"
            grep -rn "WEB_BACKEND\|BACKEND_TEMPLATE" /usr/local/hestia/conf/hestia.conf 2>/dev/null | head -3
