name: "Ops - Força bruta (só leitura): página e avisos com os dados reais do Contabo"

# 13/10/2026, depois de publicar a página Força bruta (PR #50). SÓ LEITURA:
#  1) corre no servidor o mesmo script da página (/api/vhost/forca-bruta, acao=listar) e mostra os totais e 3 linhas
#     de cada separador — confirma que lê bem o Hestia e o fail2ban de verdade;
#  2) confirma que o cron dos avisos ficou instalado, o que ele respondeu e o registo dos já avisados.
# Corre só quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.

on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-forca-bruta-verificar.yml']

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script da página com os dados reais
        env:
          SSHPASS: ${{ secrets.CONTABO_ROOT_PASSWORD }}
        run: |
          set -e
          sudo apt-get install -y -qq sshpass >/dev/null
          python3 - <<'PY' > /tmp/fb.py
          import re
          s = open('src/app/api/vhost/forca-bruta/route.ts').read()
          print(re.search(r'const PY = String\.raw`(.*?)`;', s, re.S).group(1))
          PY
          B64=$(base64 -w0 /tmp/fb.py); ARG=$(printf '{"acao":"listar"}' | base64 -w0)
          sshpass -e ssh -o StrictHostKeyChecking=accept-new root@"${{ secrets.CONTABO_HOST }}" "python3 -c \"\$(echo $B64 | base64 -d)\" $ARG" > /tmp/r.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/r.json'))
          print('bloqueados:', len(d['bloqueados']), '| tentativas (IPs):', len(d['tentativas']), '| tentativas (total):', sum(x['n'] for x in d['tentativas']), '| registo:', len(d['registo']))
          print('durações:', d['duracoes'])
          for k in ('bloqueados', 'tentativas', 'registo'):
              for x in d[k][:3]: print(' ', k, x)
          print('com fim calculado:', sum(1 for b in d['bloqueados'] if b['ate']), '| só à mão:', sum(1 for b in d['bloqueados'] if not b['ate']), '| de Moçambique:', sum(1 for b in d['bloqueados'] if b['mz']))
          PY

      - name: Cron dos avisos
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set +e
            echo -n "cron instalado: "; crontab -l 2>/dev/null | grep -c "# visualdesign-forca-bruta"
            echo "últimas respostas do cron:"; grep -o '{"ok"[^}]*}\|{"error"[^}]*}' /var/log/visualdesign-cron.log 2>/dev/null | grep -E 'bloqueados|forca-bruta|primeiraVez|novos' | tail -3 | sed 's/^/  /'
            echo -n "registo dos já avisados: "; ls -la /var/lib/visualdesign/forca-bruta-avisados.json 2>/dev/null || echo "ainda não existe"
