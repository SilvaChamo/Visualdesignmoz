name: "Ops - Servidor recuperado do backup Hetzner de 13/10: inventário (só leitura)"

# ============================================================================
# Silva, 16/10/2026: o Hetzner original (37.27.17.25) parou a 14/10 (sem SSH/web/
# email). Criou-se um servidor NOVO (77.42.120.104) a partir do backup de 13/10,
# só para tirar de lá os dados (sites, bases de dados, email) e levá-los para o
# Hestia do Contabo — o DirectAdmin não é preciso (licença presa ao IP antigo).
#
# SÓ LEITURA: confirma o SSH, mostra o que arrancou sozinho (site/pm2, crons,
# fila do Exim) e faz o inventário de contas, domínios, email e bases de dados.
# Aborta se a máquina não tiver NEW_IP ou tiver o IP do Hetzner original.
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-hetzner-recuperado.yml'

env:
  NEW_IP: "77.42.120.104"

jobs:
  recuperado:
    name: servidor recuperado (só leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Portas que respondem no IP novo
        run: |
          set +e
          for p in 22 2234 80 443 2026 2222 25; do
            timeout 6 bash -c "echo > /dev/tcp/$NEW_IP/$p" 2>/dev/null; rc=$?
            case $rc in 0) r=ABERTA;; 124) r="sem resposta";; *) r=RECUSADA;; esac
            echo "porta $p: $r"
          done
      - name: O que está a correr + inventário
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.NEW_IP }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: NEW_IP
          command_timeout: 10m
          script: |
            set +e
            echo "===== confirmar que esta é a máquina NOVA ====="
            ip -4 -o addr show | awk '{print $2, $4}'
            if ! ip -4 -o addr show | grep -qw "$NEW_IP"; then echo "ABORTAR: $NEW_IP não está nesta máquina"; exit 1; fi
            # o disco copiado traz o IP antigo na configuração de rede — aparece também, mas a Hetzner só
            # entrega esse IP ao servidor original; a ligação foi feita a NEW_IP, por isso esta é a máquina nova
            ip -4 -o addr show | grep -qw "37.27.17.25" && echo "(nota: o IP antigo 37.27.17.25 vem da configuração copiada do backup)"
            echo "ok: máquina nova ($NEW_IP)"
            echo
            echo "===== data do estado do disco ====="
            last -x reboot 2>/dev/null | head -3
            ls -lt --time-style=+%F_%T /var/log/ 2>/dev/null | sed -n 2,5p
            echo
            echo "===== o que arrancou sozinho (efeitos externos) ====="
            echo "--- pm2 ---"; pm2 jlist 2>/dev/null | python3 -c "import json,sys;[print(p['name'],p['pm2_env']['status']) for p in json.load(sys.stdin)]" 2>&1
            echo "--- crontab root (linhas activas) ---"; crontab -l 2>/dev/null | grep -v '^#' | grep -v '^$'
            echo "--- log das tarefas visualdesign (últimas linhas) ---"; tail -5 /var/log/visualdesign-cron.log 2>/dev/null
            echo "--- exim ---"; echo "estado: $(systemctl is-active exim 2>&1); mensagens na fila: $(exim -bpc 2>/dev/null)"
            echo
            echo "===== serviços ====="
            for s in ssh sshd directadmin httpd apache2 mariadb mysqld dovecot exim named docker; do echo "$s: $(systemctl is-active $s 2>&1)"; done
            df -h / | tail -1
            echo
            echo "===== contas e domínios (DirectAdmin) ====="
            for u in $(ls /usr/local/directadmin/data/users/); do
              echo "--- $u ($(du -sh /home/$u 2>/dev/null | cut -f1)) ---"
              for d in $(cat /usr/local/directadmin/data/users/$u/domains.list 2>/dev/null); do
                echo "  $d  site=$(du -sh /home/$u/domains/$d/public_html 2>/dev/null | cut -f1)  email=$(du -sh /home/$u/imap/$d 2>/dev/null | cut -f1)  caixas=$(ls /home/$u/imap/$d 2>/dev/null | wc -l)"
              done
            done
            echo
            echo "===== bases de dados ====="
            . /usr/local/directadmin/conf/mysql.conf 2>/dev/null
            mysql -u"$user" -p"$passwd" -N -e "SELECT table_schema, ROUND(SUM(data_length+index_length)/1024/1024,1) AS mb FROM information_schema.tables GROUP BY table_schema ORDER BY mb DESC;" 2>&1 | head -60

  contabo:
    name: contabo (o que já existe no Hestia, só leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Contas e domínios no Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            H=/usr/local/hestia/bin
            for u in $($H/v-list-users plain | cut -f1); do
              echo "--- $u ---"
              $H/v-list-web-domains $u plain 2>/dev/null | cut -f1 | sed 's/^/  web:  /'
              $H/v-list-mail-domains $u plain 2>/dev/null | cut -f1 | sed 's/^/  mail: /'
            done
            df -h / | tail -1
