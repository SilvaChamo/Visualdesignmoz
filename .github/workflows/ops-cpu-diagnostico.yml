name: "Ops - Teste de fora: aamihe.com e bloqueio dos robôs (SÓ LEITURA)"
on:
  push:
    branches: [ops/cpu-diagnostico]
jobs:
  fora:
    runs-on: ubuntu-latest
    steps:
      - name: Pedidos de fora
        run: |
          for u in https://aamihe.com/ https://www.aamihe.com/ https://aamihe.com/en/ https://aamihe.com/wp-login.php https://aamihe.com/wp-adminwp-conflg.php https://aamihe.com/manager.php https://aamihe.com/xmlrpc.php; do
            echo -n "$u -> "; curl -s -o /dev/null -w "%{http_code} (%{time_total}s)\n" --max-time 20 "$u" || echo "sem resposta (bloqueado)"
          done
