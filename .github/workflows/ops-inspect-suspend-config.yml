name: "Ops - Fase 117. Remove so a entrada elimservicos do panel_users (sem tocar no site)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica login associado e remove
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== tem login real associado (auth_user_id)? confirma provider guardado ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT username, auth_user_id, hosting_provider, acl FROM panel_users WHERE username='elimservicos';" 2>&1
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT da_username, provider FROM panel_auth_accounts WHERE da_username='elimservicos';" 2>&1

            echo ""
            echo "===== remove SO a entrada de conta (panel_users) - nao mexe em panel_sites nem no servidor ====="
            docker exec supabase-db psql -U postgres -d postgres -c "DELETE FROM panel_users WHERE username='elimservicos';" 2>&1
            docker exec supabase-db psql -U postgres -d postgres -c "DELETE FROM panel_auth_accounts WHERE da_username='elimservicos';" 2>&1

            echo ""
            echo "===== confirma: elimservicos.com continua no panel_sites, dono oshercollective ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT domain, owner FROM panel_sites WHERE domain ILIKE '%elimservicos%';" 2>&1

            echo ""
            echo "===== confirma: o site continua a responder normalmente ====="
            curl -sSI --max-time 10 https://elimservicos.com/ 2>&1 | head -3
