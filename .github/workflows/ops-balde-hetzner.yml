name: Ops - Balde do Hetzner para o Contabo

# Passa o conteúdo do balde do Hetzner (visualdesign-storage) para o Contabo, para se poder cancelar a conta do Hetzner
# (Silva, 26/10/2026). Em fases, para ver o que há antes de mexer:
#   inventario  SÓ LÊ (só SELECT na base de dados, nada é escrito): espaço livre, o que ocupa espaço (aamihe incluído), onde estão as chaves
#               do balde (só diz se existem), e para cada WordPress do servidor: se ainda usa plugins/URLs do balde e se as imagens da
#               biblioteca de media já estão no disco do Contabo (não precisa das chaves do balde para isto).
#   copiar      faz uma cópia completa do balde para /root/balde-hetzner-copia (rclone copy: só acrescenta, nunca apaga nem
#               move; não toca nos sites). Precisa do remoto hetzner-s3 do rclone e recusa-se se não houver espaço livre para o
#               balde inteiro mais 10 GB de folga.
# A troca dos sites (tirar os plugins do balde e as imagens passarem a vir do Contabo) só se faz depois de se ver o resultado
# destas duas fases. Corre com nice/ionice para não pesar nos outros sites do servidor (basededadosagro.com, etc.).

on:
  workflow_dispatch:
    inputs:
      fase:
        description: 'inventario (só lê) ou copiar (cópia completa do balde, sem apagar nada)'
        type: choice
        options:
          - inventario
          - copiar
        default: inventario

concurrency:
  group: ops-balde-hetzner
  cancel-in-progress: false

jobs:
  balde:
    runs-on: ubuntu-latest
    steps:
      - name: Balde do Hetzner (inventário ou cópia)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          FASE: ${{ inputs.fase }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 30m
          envs: FASE
          script: |
            set -u
            export PATH="$PATH:/usr/local/bin"
            case "$FASE" in (inventario|copiar) ;; (*) echo "Fase inválida"; exit 1;; esac
            BUCKET=visualdesign-storage
            CONF=/root/.config/rclone/rclone.conf
            COPIA=/root/balde-hetzner-copia
            WP=/usr/local/bin/wp
            RC="nice -n 10 ionice -c3 rclone --config $CONF"
            TEM_RCLONE=0
            if command -v rclone >/dev/null 2>&1 && [ -f "$CONF" ]; then TEM_RCLONE=1; fi

            if [ "$FASE" = "copiar" ]; then
              [ "$TEM_RCLONE" = 1 ] || { echo "Sem rclone ou sem $CONF (remoto hetzner-s3) — não há como copiar o balde a partir daqui"; exit 1; }
              echo "=== Espaço no servidor ==="
              df -h / /home | awk '!v[$0]++'
              echo "=== Cópia completa do balde para $COPIA ==="
              BYTES=$($RC size "hetzner-s3:$BUCKET" --json --fast-list 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin)["bytes"])' 2>/dev/null)
              case "$BYTES" in (''|*[!0-9]*) echo "Não consegui saber o tamanho do balde — não copio"; exit 1;; esac
              mkdir -p "$COPIA"
              LIVRE=$(df -PB1 "$COPIA" | awk 'NR==2{print $4}')
              FOLGA=$((10 * 1024 * 1024 * 1024))
              echo "balde: $((BYTES / 1048576)) MB; livre: $((LIVRE / 1048576)) MB; folga exigida: 10240 MB"
              if [ "$LIVRE" -lt $((BYTES + FOLGA)) ]; then
                echo "SEM ESPAÇO para o balde inteiro com folga — não copio nada."
                exit 1
              fi
              $RC copy "hetzner-s3:$BUCKET" "$COPIA" --fast-list --transfers 4 --checkers 8 --stats 60s --stats-one-line 2>&1 | tail -n 30
              echo "--- comparação final (o que ainda falta ou difere)"
              $RC check "hetzner-s3:$BUCKET" "$COPIA" --one-way --size-only --fast-list 2>&1 | tail -n 5
              echo "cópia local: $(du -sh "$COPIA" | cut -f1) em $COPIA"
              exit 0
            fi

            echo "=== Espaço no servidor ==="
            df -h / /home | awk '!v[$0]++'
            echo
            echo "=== O que mais ocupa em /home (2 níveis) ==="
            nice -n 10 ionice -c3 du -xh --max-depth=2 /home 2>/dev/null | sort -rh | head -20
            echo
            echo "=== Lixo do painel (.vh-lixo) ==="
            du -sh /home/*/.vh-lixo 2>/dev/null
            du -sh /home/vdadmin/.vh-lixo/* 2>/dev/null | sort -rh | head -10
            echo
            echo "=== aamihe.com: o que ocupa dentro de public_html ==="
            A=/home/aamihe/web/aamihe.com/public_html
            if [ -d "$A" ]; then
              [ -f "$A/wp-config.php" ] && echo "wp-config.php: SIM (WordPress ainda nesta pasta)" || echo "wp-config.php: NÃO"
              echo "entradas: $(ls -A "$A" | wc -l)"
              du -sh "$A"/* "$A"/.[!.]* 2>/dev/null | sort -rh | head -12
              echo "--- maiores ficheiros"
              find "$A" -type f -size +20M -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -8 | awk -F'\t' '{printf "%d MB\t%s\n", $1/1048576, $2}'
            fi
            echo
            echo "=== Onde estão as chaves do balde (só se existem; nada é mostrado) ==="
            command -v rclone >/dev/null 2>&1 && echo "rclone: instalado" || echo "rclone: NÃO instalado"
            [ -f "$CONF" ] && echo "$CONF: existe" || echo "$CONF: NÃO existe"
            find /root /home /etc /usr/local /opt -maxdepth 6 \( -name rclone.conf -o -name 'wp-s3-hetzner.php' -o -name '.s3cfg' \) 2>/dev/null | head
            echo "wp-config com referência ao balde:"; grep -lE "your-objectstorage|AS3CF_SETTINGS|S3_UPLOADS" /home/*/web/*/public_html/wp-config.php 2>/dev/null
            echo

            if [ "$TEM_RCLONE" = 1 ]; then
              echo "=== Balde $BUCKET ==="
              $RC lsd "hetzner-s3:$BUCKET" 2>&1 | head -20
              echo "--- prefixos em wp/"
              $RC lsd "hetzner-s3:$BUCKET/wp" 2>&1 | head -40
              echo "--- tamanho total"
              $RC size "hetzner-s3:$BUCKET" --fast-list 2>&1
            else
              echo "=== Balde: sem remoto rclone neste servidor — não se lista o balde ==="
            fi

            for cfg in $(ls /home/*/web/*/public_html/wp-config.php 2>/dev/null | grep -viE "backup|lixo"); do
              D=$(dirname "$cfg"); U=$(stat -c %U "$D"); d=$(basename "$(dirname "$D")"); UP="$D/wp-content/uploads"
              W="sudo -u $U $WP --path=$D --skip-plugins --skip-themes"
              echo
              echo "=================== $d (utilizador $U) ==================="
              P=$($W db prefix 2>/dev/null | tail -1)
              if [ -z "$P" ]; then echo "wp-cli não respondeu (prefixo da base de dados) — salto este site"; continue; fi
              echo "--- wp-config (sem chaves nem segredos)"
              grep -nE "AS3CF|serve-from-s3|remove-local-file|object-prefix|'bucket'|S3_UPLOADS|WP_CONTENT_URL|UPLOADS_" "$cfg" | grep -viE "key|secret" | cut -c1-200
              echo "--- plugins do balde (activos e mu-plugins)"
              $W plugin list --status=active --field=name 2>/dev/null | grep -iE "s3|offload|as3cf|hetzner"
              ls "$D/wp-content/mu-plugins" 2>/dev/null | grep -iE "hetzner|s3|as3cf"
              echo "--- referências ao balde na base de dados (só SELECT)"
              q() { $W db query "$1" --skip-column-names 2>&1 | grep -vi "deprecated" | tail -1; }
              echo "posts: $(q "SELECT COUNT(*) FROM ${P}posts WHERE LOCATE('your-objectstorage.com', post_content) > 0")  postmeta: $(q "SELECT COUNT(*) FROM ${P}postmeta WHERE LOCATE('your-objectstorage.com', meta_value) > 0")  options: $(q "SELECT COUNT(*) FROM ${P}options WHERE LOCATE('your-objectstorage.com', option_value) > 0")"
              echo "--- definições do Offload Media na base de dados (sem chaves)"
              $W db query "SELECT option_value FROM ${P}options WHERE option_name='tantan_wordpress_s3'" --skip-column-names 2>&1 | grep -oE 's:[0-9]+:"(bucket|region|serve-from-s3|remove-local-file|object-prefix|enable-object-prefix|object-versioning|use-yearmonth-folders|force-https|delivery-provider|provider)";[^;]*;' | head -20
              echo "--- uploads no disco: $(du -sh "$UP" 2>/dev/null | cut -f1), $(find "$UP" -type f 2>/dev/null | wc -l) ficheiros"
              $W db query "SELECT p.meta_value, IFNULL(m.meta_value,'') FROM ${P}postmeta p LEFT JOIN ${P}postmeta m ON m.post_id=p.post_id AND m.meta_key='_wp_attachment_metadata' WHERE p.meta_key='_wp_attached_file'" --skip-column-names 2>/dev/null > /tmp/anexos_$$.txt
              total=$(wc -l < /tmp/anexos_$$.txt); falta=0; faltam_mini=0; : > /tmp/falta_$$.txt
              while IFS=$'\t' read -r rel meta; do
                [ -n "$rel" ] || continue
                dir=$(dirname "$rel"); [ "$dir" = "." ] && dir=""
                if [ ! -f "$UP/$rel" ]; then falta=$((falta + 1)); [ "$falta" -le 10 ] && echo "$rel" >> /tmp/falta_$$.txt; fi
                for f in $(printf '%s' "$meta" | grep -oE 's:4:"file";s:[0-9]+:"[^"]+"' | sed -E 's/^s:4:"file";s:[0-9]+:"//; s/"$//' | grep -v '/'); do
                  [ -f "$UP/${dir:+$dir/}$f" ] || faltam_mini=$((faltam_mini + 1))
                done
              done < /tmp/anexos_$$.txt
              echo "biblioteca de media: $total anexos; originais em falta no disco do Contabo: $falta; miniaturas em falta: $faltam_mini"
              if [ "$falta" -gt 0 ]; then
                echo "em falta (com a chave no balde, se o Offload a guardou, e se o balde ainda a serve):"
                while IFS= read -r rel; do
                  case "$rel" in (*"'"*) continue;; esac
                  info=$($W db query "SELECT meta_value FROM ${P}postmeta WHERE meta_key='amazonS3_info' AND post_id=(SELECT post_id FROM ${P}postmeta WHERE meta_key='_wp_attached_file' AND meta_value='$rel' LIMIT 1)" --skip-column-names 2>/dev/null)
                  chave=$(printf '%s' "$info" | grep -oE 's:3:"key";s:[0-9]+:"[^"]+"' | sed -E 's/^s:3:"key";s:[0-9]+:"//; s/"$//' | head -1)
                  balde=$(printf '%s' "$info" | grep -oE 's:6:"bucket";s:[0-9]+:"[^"]+"' | sed -E 's/^s:6:"bucket";s:[0-9]+:"//; s/"$//' | head -1)
                  if [ -n "$chave" ]; then
                    res=$(curl -sI -m 20 "https://hel1.your-objectstorage.com/${balde:-$BUCKET}/$chave" | tr -d '\r' | awk 'NR==1{c=$2} tolower($1)=="content-length:"{l=$2} END{print "HTTP " c ", " l " bytes"}')
                    echo "  $rel  ->  ${balde:-$BUCKET}/$chave  [$res]"
                  else
                    echo "  $rel  ->  sem chave do Offload"
                  fi
                done < /tmp/falta_$$.txt
              fi
              rm -f /tmp/anexos_$$.txt /tmp/falta_$$.txt
              if [ "$TEM_RCLONE" = 1 ]; then
                P2="hetzner-s3:$BUCKET/wp/$d/uploads"
                echo "--- no balde: $($RC size "$P2" --fast-list 2>&1 | tr '\n' ' ')"
              fi
            done
            echo
            echo "Inventário concluído: nada foi alterado."
