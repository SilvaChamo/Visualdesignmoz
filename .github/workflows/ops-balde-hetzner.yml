name: Ops - Balde do Hetzner para o Contabo

# Passa o conteúdo do balde do Hetzner (visualdesign-storage) para o Contabo, para se poder cancelar a conta do Hetzner
# (Silva, 26/10/2026). Em fases, para ver o que há antes de mexer:
#   inventario  SÓ LÊ (só SELECT na base de dados, nada é escrito): espaço livre, o que ocupa espaço (aamihe incluído), onde estão as chaves
#               do balde (só diz se existem), e para cada WordPress do servidor: se ainda usa plugins/URLs do balde e se as imagens da
#               biblioteca de media já estão no disco do Contabo (não precisa das chaves do balde para isto).
#   copiar      faz uma cópia completa do balde para /root/balde-hetzner-copia (rclone copy: só acrescenta, nunca apaga nem
#               move; não toca nos sites). Precisa do remoto hetzner-s3 do rclone e recusa-se se não houver espaço livre para o
#               balde inteiro mais 10 GB de folga.
#   migrar      (um domínio de cada vez) traz do balde, por HTTP público e sem chaves, os ficheiros que a biblioteca do WordPress
#               tem no Offload Media e faltam no disco do Contabo (original e miniaturas); SÓ se os originais vierem todos,
#               guarda cópia de segurança em /root/balde-hetzner-troca/, desactiva o Offload Media, tira os plugins do Hetzner
#               (s3-endpoint-fix.php, vd-hetzner-media-urls.php), limpa a cache e confirma que a página já não chama o balde.
#               Para desfazer: ver os comandos que a fase escreve no fim.
# Corre com nice/ionice para não pesar nos outros sites do servidor (basededadosagro.com, etc.).

on:
  workflow_dispatch:
    inputs:
      fase:
        description: 'inventario (só lê), copiar (cópia completa do balde, precisa do rclone) ou migrar (um domínio)'
        type: choice
        options:
          - inventario
          - copiar
          - migrar
        default: inventario
      dominio:
        description: 'Só para migrar: o domínio do WordPress (ex.: oshercollective.com)'
        type: string
        default: ''

concurrency:
  group: ops-balde-hetzner
  cancel-in-progress: false

jobs:
  balde:
    runs-on: ubuntu-latest
    steps:
      - name: Balde do Hetzner (inventário ou cópia)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          FASE: ${{ inputs.fase }}
          DOMINIO: ${{ inputs.dominio }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 30m
          envs: FASE,DOMINIO
          script: |
            set -u
            export PATH="$PATH:/usr/local/bin"
            case "$FASE" in (inventario|copiar|migrar) ;; (*) echo "Fase inválida"; exit 1;; esac
            BUCKET=visualdesign-storage
            CONF=/root/.config/rclone/rclone.conf
            COPIA=/root/balde-hetzner-copia
            WP=/usr/local/bin/wp
            RC="nice -n 10 ionice -c3 rclone --config $CONF"
            TEM_RCLONE=0
            if command -v rclone >/dev/null 2>&1 && [ -f "$CONF" ]; then TEM_RCLONE=1; fi

            if [ "$FASE" = "copiar" ]; then
              [ "$TEM_RCLONE" = 1 ] || { echo "Sem rclone ou sem $CONF (remoto hetzner-s3) — não há como copiar o balde a partir daqui"; exit 1; }
              echo "=== Espaço no servidor ==="
              df -h / /home | awk '!v[$0]++'
              echo "=== Cópia completa do balde para $COPIA ==="
              BYTES=$($RC size "hetzner-s3:$BUCKET" --json --fast-list 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin)["bytes"])' 2>/dev/null)
              case "$BYTES" in (''|*[!0-9]*) echo "Não consegui saber o tamanho do balde — não copio"; exit 1;; esac
              mkdir -p "$COPIA"
              LIVRE=$(df -PB1 "$COPIA" | awk 'NR==2{print $4}')
              FOLGA=$((10 * 1024 * 1024 * 1024))
              echo "balde: $((BYTES / 1048576)) MB; livre: $((LIVRE / 1048576)) MB; folga exigida: 10240 MB"
              if [ "$LIVRE" -lt $((BYTES + FOLGA)) ]; then
                echo "SEM ESPAÇO para o balde inteiro com folga — não copio nada."
                exit 1
              fi
              $RC copy "hetzner-s3:$BUCKET" "$COPIA" --fast-list --transfers 4 --checkers 8 --stats 60s --stats-one-line 2>&1 | tail -n 30
              echo "--- comparação final (o que ainda falta ou difere)"
              $RC check "hetzner-s3:$BUCKET" "$COPIA" --one-way --size-only --fast-list 2>&1 | tail -n 5
              echo "cópia local: $(du -sh "$COPIA" | cut -f1) em $COPIA"
              exit 0
            fi

            if [ "$FASE" = "migrar" ]; then
              case "$DOMINIO" in (''|*[!a-z0-9.-]*) echo "Indique o domínio do WordPress (ex.: oshercollective.com)"; exit 1;; esac
              D=$(find /home -maxdepth 4 -type d -path "/home/*/web/$DOMINIO/public_html" 2>/dev/null | head -1)
              [ -n "$D" ] && [ -f "$D/wp-config.php" ] || { echo "WordPress de $DOMINIO não encontrado no Contabo"; exit 1; }
              U=$(stat -c %U "$D"); UP="$D/wp-content/uploads"; MU="$D/wp-content/mu-plugins"
              W="sudo -u $U $WP --path=$D --skip-plugins --skip-themes"
              WC="sudo -u $U $WP --path=$D"
              sql() { $W db query "$1" --skip-column-names 2>/dev/null | grep -v '^$' | tail -n1; }
              P=$($W db prefix 2>/dev/null | tail -1)
              [ -n "$P" ] || { echo "wp-cli não respondeu (prefixo da base de dados)"; exit 1; }
              TS=$(date +%Y%m%d-%H%M%S); B="/root/balde-hetzner-troca/$DOMINIO-$TS"; mkdir -p "$B"
              ligacoes() { curl -sL -m 30 "$1" | grep -oE "https?://[a-z0-9.-]*your-objectstorage\.com[^\"' )<]*" | sort -u | wc -l; }
              echo "=== $DOMINIO (utilizador $U) — cópia de segurança em $B ==="
              echo "ANTES: página inicial com links ao balde: $(ligacoes "https://$DOMINIO/?vd=a$TS")"

              echo "=== 1. Trazer do balde o que falta no disco ==="
              ORIG_FALHAS=0; TRAZIDOS=0; MINI_FALHAS=0
              $W db query "SELECT source_id, bucket, path FROM ${P}as3cf_items" --skip-column-names 2>/dev/null | grep -v '^$' > "$B/itens.txt"
              echo "itens do Offload Media: $(wc -l < "$B/itens.txt")"
              while IFS=$'\t' read -r id bkt key; do
                case "$id" in (''|*[!0-9]*) continue;; esac
                [ -n "$bkt" ] && [ -n "$key" ] || continue
                rel=$(sql "SELECT meta_value FROM ${P}postmeta WHERE post_id=$id AND meta_key='_wp_attached_file' LIMIT 1")
                meta=$(sql "SELECT meta_value FROM ${P}postmeta WHERE post_id=$id AND meta_key='_wp_attachment_metadata' LIMIT 1")
                [ -n "$rel" ] || { echo "  item $id sem _wp_attached_file — salto"; continue; }
                ldir=$(dirname "$rel"); kdir=$(dirname "$key"); orig=$(basename "$rel")
                nomes="$orig $(printf '%s' "$meta" | grep -oE 's:4:"file";s:[0-9]+:"[^"]+"' | sed -E 's/^s:4:"file";s:[0-9]+:"//; s/"$//' | grep -v '/')"
                for n in $nomes; do
                  dest="$UP/$ldir/$n"; [ "$ldir" = "." ] && dest="$UP/$n"
                  [ -s "$dest" ] && continue
                  [ -d "$(dirname "$dest")" ] || { mkdir -p "$(dirname "$dest")"; chown "$U:$U" "$(dirname "$dest")"; }
                  if curl -fsS -m 90 -o "$dest.parte" "https://hel1.your-objectstorage.com/$bkt/$kdir/$n" 2>/dev/null && [ -s "$dest.parte" ]; then
                    mv "$dest.parte" "$dest"; chown "$U:$U" "$dest"; chmod 644 "$dest"; TRAZIDOS=$((TRAZIDOS + 1)); echo "  trazido: ${dest#$UP/}  ($(stat -c %s "$dest") bytes)"
                  else
                    rm -f "$dest.parte"
                    if [ "$n" = "$orig" ]; then ORIG_FALHAS=$((ORIG_FALHAS + 1)); echo "  FALHOU o ORIGINAL: $bkt/$kdir/$n"; else MINI_FALHAS=$((MINI_FALHAS + 1)); echo "  miniatura não está no balde: $kdir/$n"; fi
                  fi
                done
              done < "$B/itens.txt"
              echo "trazidos: $TRAZIDOS; originais que falharam: $ORIG_FALHAS; miniaturas que o balde não tem: $MINI_FALHAS"
              if [ "$ORIG_FALHAS" -gt 0 ]; then echo "Há originais que não vieram — NÃO mexo no site."; exit 1; fi

              echo "=== 2. Tirar o balde do site ==="
              $W option get active_plugins --format=json > "$B/active_plugins.json" 2>/dev/null
              for f in s3-endpoint-fix.php vd-hetzner-media-urls.php hetzner-s3-uploads.php; do
                if [ -f "$MU/$f" ]; then mv "$MU/$f" "$B/$f" && echo "  mu-plugin posto de lado: $f"; fi
              done
              if $WC plugin is-active amazon-s3-and-cloudfront 2>/dev/null; then
                $WC plugin deactivate amazon-s3-and-cloudfront 2>&1 | tail -2
                echo "amazon-s3-and-cloudfront" > "$B/desactivado.txt"
              else echo "  Offload Media não estava activo"; fi

              echo "=== 3. Limpar a cache ==="
              $WC cache flush 2>&1 | tail -1
              $WC eval 'if (function_exists("WP_Optimize") && WP_Optimize()->get_page_cache()) { WP_Optimize()->get_page_cache()->purge(); echo "cache de páginas do WP-Optimize limpa"; } else { echo "sem cache de páginas do WP-Optimize"; }' 2>&1 | tail -1
              echo

              echo "=== 3a. Regras do balde no .htaccess (redirecionam para o balde o que não existe em uploads) ==="
              HT="$D/.htaccess"
              if [ -f "$HT" ] && grep -q "BEGIN VD-HETZNER-UPLOADS" "$HT"; then
                cp -p "$HT" "$B/htaccess.antes"
                IMUT=0; if lsattr "$HT" 2>/dev/null | awk '{print $1}' | grep -q i; then IMUT=1; chattr -i "$HT"; fi
                sed '/# BEGIN VD-HETZNER-UPLOADS/,/# END VD-HETZNER-UPLOADS/d' "$HT" > "$HT.novo" && cat "$HT.novo" > "$HT"; rm -f "$HT.novo"
                if [ "$IMUT" = 1 ]; then chattr +i "$HT"; fi
                echo "  bloco VD-HETZNER-UPLOADS removido do .htaccess (original em $B/htaccess.antes)"
              else
                echo "  nenhum bloco VD-HETZNER-UPLOADS"
              fi
              [ -f "$HT" ] && echo "  linhas do .htaccess que ainda falam do balde: $(grep -c 'objectstorage' "$HT")"
              echo "=== 3b. Ficheiros estáticos (fora do WordPress) que ainda chamam o balde ==="
              ESTAT=$(nice -n 10 ionice -c3 grep -rIl --exclude-dir=cache --exclude-dir=uploads --exclude-dir=node_modules "your-objectstorage.com" "$D" 2>/dev/null | head -50)
              [ -n "$ESTAT" ] || echo "  nenhum"
              for f in $ESTAT; do
                urls=$(grep -oE "https://hel1\.your-objectstorage\.com/[a-z0-9-]+/wp/$DOMINIO/uploads/[0-9]{4}/[0-9]{2}/[0-9]{8}/[^\"' )<>]+" "$f" | sort -u)
                tudo_local=1
                for url in $urls; do
                  loc=$(printf '%s' "$url" | sed -E "s#^https://hel1\.your-objectstorage\.com/[a-z0-9-]+/wp/$DOMINIO/uploads/([0-9]{4}/[0-9]{2})/[0-9]{8}/#\1/#")
                  [ -s "$UP/$loc" ] || { tudo_local=0; echo "  ${f#$D/}: falta no disco $loc"; }
                done
                if [ -n "$urls" ] && [ "$tudo_local" = 1 ]; then
                  mkdir -p "$B/estaticos"; cp -p "$f" "$B/estaticos/$(printf '%s' "${f#$D/}" | tr '/' '_')"
                  sed -E "s#https://hel1\.your-objectstorage\.com/[a-z0-9-]+/wp/$DOMINIO/uploads/([0-9]{4}/[0-9]{2})/[0-9]{8}/#https://$DOMINIO/wp-content/uploads/\1/#g" "$f" > "$f.novo" && cat "$f.novo" > "$f" && rm -f "$f.novo"
                  echo "  corrigido: ${f#$D/} ($(printf '%s\n' "$urls" | wc -l) URL(s) do balde -> ficheiro local)"
                else
                  echo "  NÃO corrigido (links que não sei trocar): ${f#$D/}"
                fi
              done
              echo

              echo "=== 4. Verificação ==="
              echo "DEPOIS: página inicial com links ao balde: $(ligacoes "https://$DOMINIO/?vd=b$TS") (sem cache) e $(ligacoes "https://$DOMINIO/") (com cache)"
              echo "página inicial: HTTP $(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://$DOMINIO/")"
              curl -sL -m 30 "https://$DOMINIO/?vd=c$TS" | grep -oE '<link[^>]*rel=.(shortcut )?icon.[^>]*>' | head -3
              for href in $(curl -sL -m 30 "https://$DOMINIO/?vd=d$TS" | grep -oE '<link[^>]*rel=.(shortcut )?icon.[^>]*>' | grep -oE 'href=.[^"'"'"' ]+' | sed -E 's/^href=.//' | sort -u | head -3); do
                echo "  ícone $href -> HTTP $(curl -s -o /dev/null -m 30 -w '%{http_code}' "$href")"
              done
              echo
              echo "Para DESFAZER (no servidor, como root):"
              echo "  mv $B/*.php $MU/"
              echo "  cp -p $B/htaccess.antes $D/.htaccess   (só se o .htaccess tiver sido alterado)"
              echo "  (ficheiros estáticos corrigidos: os originais estão em $B/estaticos/, com o caminho a _ em vez de /)"
              echo "  sudo -u $U $WP --path=$D plugin activate amazon-s3-and-cloudfront"
              exit 0
            fi

            echo "=== Espaço no servidor ==="
            df -h / /home | awk '!v[$0]++'
            echo
            echo "=== O que mais ocupa em /home (2 níveis) ==="
            nice -n 10 ionice -c3 du -xh --max-depth=2 /home 2>/dev/null | sort -rh | head -20
            echo
            echo "=== Lixo do painel (.vh-lixo) ==="
            du -sh /home/*/.vh-lixo 2>/dev/null
            du -sh /home/vdadmin/.vh-lixo/* 2>/dev/null | sort -rh | head -10
            echo
            echo "=== aamihe.com: o que ocupa dentro de public_html ==="
            A=/home/aamihe/web/aamihe.com/public_html
            if [ -d "$A" ]; then
              [ -f "$A/wp-config.php" ] && echo "wp-config.php: SIM (WordPress ainda nesta pasta)" || echo "wp-config.php: NÃO"
              echo "entradas: $(ls -A "$A" | wc -l)"
              du -sh "$A"/* "$A"/.[!.]* 2>/dev/null | sort -rh | head -12
              echo "--- maiores ficheiros"
              find "$A" -type f -size +20M -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -8 | awk -F'\t' '{printf "%d MB\t%s\n", $1/1048576, $2}'
            fi
            echo
            echo "=== Onde estão as chaves do balde (só se existem; nada é mostrado) ==="
            command -v rclone >/dev/null 2>&1 && echo "rclone: instalado" || echo "rclone: NÃO instalado"
            [ -f "$CONF" ] && echo "$CONF: existe" || echo "$CONF: NÃO existe"
            find /root /home /etc /usr/local /opt -maxdepth 6 \( -name rclone.conf -o -name 'wp-s3-hetzner.php' -o -name '.s3cfg' \) 2>/dev/null | head
            echo "wp-config com referência ao balde:"; grep -lE "your-objectstorage|AS3CF_SETTINGS|S3_UPLOADS" /home/*/web/*/public_html/wp-config.php 2>/dev/null
            echo

            if [ "$TEM_RCLONE" = 1 ]; then
              echo "=== Balde $BUCKET ==="
              $RC lsd "hetzner-s3:$BUCKET" 2>&1 | head -20
              echo "--- prefixos em wp/"
              $RC lsd "hetzner-s3:$BUCKET/wp" 2>&1 | head -40
              echo "--- tamanho total"
              $RC size "hetzner-s3:$BUCKET" --fast-list 2>&1
            else
              echo "=== Balde: sem remoto rclone neste servidor — não se lista o balde ==="
            fi

            for cfg in $(ls /home/*/web/*/public_html/wp-config.php 2>/dev/null | grep -viE "backup|lixo"); do
              D=$(dirname "$cfg"); U=$(stat -c %U "$D"); d=$(basename "$(dirname "$D")"); UP="$D/wp-content/uploads"
              W="sudo -u $U $WP --path=$D --skip-plugins --skip-themes"
              echo
              echo "=================== $d (utilizador $U) ==================="
              P=$($W db prefix 2>/dev/null | tail -1)
              if [ -z "$P" ]; then echo "wp-cli não respondeu (prefixo da base de dados) — salto este site"; continue; fi
              echo "--- wp-config (sem chaves nem segredos)"
              grep -nE "AS3CF|serve-from-s3|remove-local-file|object-prefix|'bucket'|S3_UPLOADS|WP_CONTENT_URL|UPLOADS_" "$cfg" | grep -viE "key|secret" | cut -c1-200
              echo "--- plugins do balde (activos e mu-plugins)"
              $W plugin list --status=active --field=name 2>/dev/null | grep -iE "s3|offload|as3cf|hetzner"
              ls "$D/wp-content/mu-plugins" 2>/dev/null | grep -iE "hetzner|s3|as3cf"
              echo "--- referências ao balde na base de dados (só SELECT)"
              for par in posts:post_content postmeta:meta_value options:option_value; do
                tab=${par%%:*}; col=${par##*:}
                r=$($W db query "SELECT COUNT(*) FROM ${P}${tab} WHERE LOCATE('your-objectstorage.com', ${col}) > 0" --skip-column-names 2>&1 | grep -vi deprecated | tr '\n' ' ')
                echo "${tab}: ${r:-<vazio>}"
              done
              echo "linhas que contêm o balde (nomes, não os valores):"
              $W db query "SELECT 'option', option_name, LENGTH(option_value) FROM ${P}options WHERE LOCATE('your-objectstorage.com', option_value) > 0 LIMIT 15" --skip-column-names 2>&1 | grep -vi deprecated
              $W db query "SELECT 'postmeta', post_id, meta_key FROM ${P}postmeta WHERE LOCATE('your-objectstorage.com', meta_value) > 0 LIMIT 15" --skip-column-names 2>&1 | grep -vi deprecated
              $W db query "SELECT 'post', ID, post_type, post_status FROM ${P}posts WHERE LOCATE('your-objectstorage.com', post_content) > 0 OR LOCATE('your-objectstorage.com', guid) > 0 LIMIT 15" --skip-column-names 2>&1 | grep -vi deprecated
              echo "--- definições do Offload Media na base de dados (sem chaves)"
              $W db query "SELECT option_value FROM ${P}options WHERE option_name='tantan_wordpress_s3'" --skip-column-names 2>&1 | grep -oE 's:[0-9]+:"(bucket|region|serve-from-s3|remove-local-file|object-prefix|enable-object-prefix|object-versioning|use-yearmonth-folders|force-https|delivery-provider|provider)";[^;]*;' | head -20
              echo "--- uploads no disco: $(du -sh "$UP" 2>/dev/null | cut -f1), $(find "$UP" -type f 2>/dev/null | wc -l) ficheiros"
              $W db query "SELECT p.meta_value, IFNULL(m.meta_value,'') FROM ${P}postmeta p LEFT JOIN ${P}postmeta m ON m.post_id=p.post_id AND m.meta_key='_wp_attachment_metadata' WHERE p.meta_key='_wp_attached_file'" --skip-column-names 2>/dev/null > /tmp/anexos_$$.txt
              total=$(wc -l < /tmp/anexos_$$.txt); falta=0; faltam_mini=0; : > /tmp/falta_$$.txt
              while IFS=$'\t' read -r rel meta; do
                [ -n "$rel" ] || continue
                dir=$(dirname "$rel"); [ "$dir" = "." ] && dir=""
                if [ ! -f "$UP/$rel" ]; then falta=$((falta + 1)); [ "$falta" -le 10 ] && echo "$rel" >> /tmp/falta_$$.txt; fi
                for f in $(printf '%s' "$meta" | grep -oE 's:4:"file";s:[0-9]+:"[^"]+"' | sed -E 's/^s:4:"file";s:[0-9]+:"//; s/"$//' | grep -v '/'); do
                  [ -f "$UP/${dir:+$dir/}$f" ] || faltam_mini=$((faltam_mini + 1))
                done
              done < /tmp/anexos_$$.txt
              echo "biblioteca de media: $total anexos; originais em falta no disco do Contabo: $falta; miniaturas em falta: $faltam_mini"
              if [ "$falta" -gt 0 ]; then
                echo "em falta (com a chave no balde, se o Offload a guardou, e se o balde ainda a serve):"
                while IFS= read -r rel; do
                  case "$rel" in (*"'"*) continue;; esac
                  info=$($W db query "SELECT meta_value FROM ${P}postmeta WHERE meta_key='amazonS3_info' AND post_id=(SELECT post_id FROM ${P}postmeta WHERE meta_key='_wp_attached_file' AND meta_value='$rel' LIMIT 1)" --skip-column-names 2>/dev/null)
                  chave=$(printf '%s' "$info" | grep -oE 's:3:"key";s:[0-9]+:"[^"]+"' | sed -E 's/^s:3:"key";s:[0-9]+:"//; s/"$//' | head -1)
                  balde=$(printf '%s' "$info" | grep -oE 's:6:"bucket";s:[0-9]+:"[^"]+"' | sed -E 's/^s:6:"bucket";s:[0-9]+:"//; s/"$//' | head -1)
                  guid=$($W db query "SELECT guid FROM ${P}posts WHERE ID=(SELECT post_id FROM ${P}postmeta WHERE meta_key='_wp_attached_file' AND meta_value='$rel' LIMIT 1)" --skip-column-names 2>/dev/null | grep -v '^$' | tail -n1)
                  url=""
                  if [ -n "$chave" ]; then url="https://hel1.your-objectstorage.com/${balde:-$BUCKET}/$chave"; fi
                  case "$guid" in (*your-objectstorage.com*) url="$guid";; esac
                  if [ -n "$url" ]; then
                    res=$(curl -sI -m 20 "$url" | tr -d '\r' | awk 'NR==1{c=$2} tolower($1)=="content-length:"{l=$2} END{print "HTTP " c ", " l " bytes"}')
                    echo "  $rel  ->  $url  [$res]"
                  else
                    echo "  $rel  ->  sem URL do balde (guid: ${guid:-vazio})"
                  fi
                done < /tmp/falta_$$.txt
              fi
              rm -f /tmp/anexos_$$.txt /tmp/falta_$$.txt
              if [ -n "$($W db query "SHOW TABLES LIKE '${P}as3cf_items'" --skip-column-names 2>/dev/null)" ]; then
                echo "--- tabela do Offload Media (${P}as3cf_items): $($W db query "SELECT COUNT(*) FROM ${P}as3cf_items" --skip-column-names 2>/dev/null | grep -v '^$' | tail -n1) linhas"
                echo "(fonte, bucket, região, caminho no balde, caminho original, tamanho do extra_info)"
                $W db query "SELECT source_id, bucket, region, path, original_path, LENGTH(extra_info) FROM ${P}as3cf_items ORDER BY id LIMIT 25" --skip-column-names 2>&1 | grep -vi deprecated | cut -c1-260
                echo "--- extra_info do primeiro item (só nomes de ficheiros e tamanhos)"
                $W db query "SELECT extra_info FROM ${P}as3cf_items ORDER BY id LIMIT 1" --skip-column-names 2>/dev/null | grep -oE 's:[0-9]+:"[^"]*(\.webp|\.png|\.jpe?g)"|"(bucket|path|is_private)"' | head -12
              fi
              if [ "$TEM_RCLONE" = 1 ]; then
                P2="hetzner-s3:$BUCKET/wp/$d/uploads"
                echo "--- no balde: $($RC size "$P2" --fast-list 2>&1 | tr '\n' ' ')"
              fi
            done
            echo
            echo "Inventário concluído: nada foi alterado."
