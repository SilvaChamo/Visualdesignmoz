name: "Ops - host.visualdesignmoz.com de volta para o Contabo"

# ============================================================================
# Pedido do Silva (16/10/2026): "mudar tudo agora para Contabo como estava".
# Às 13:07 UTC de hoje o registo host.visualdesignmoz.com passou para o Hetzner
# (37.27.17.25), que está avariado desde 14/10 — o link
# https://host.visualdesignmoz.com:2026/evo/ deixou de abrir. O Contabo
# (169.58.148.144) já responde nesse nome (portas 443 e 2026, certificado válido).
# Muda só esse registo: A host.visualdesignmoz.com → 169.58.148.144, DNS only.
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-dns-host-contabo.yml'

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -e
          H=host.visualdesignmoz.com
          CT=169.58.148.144
          cf() { curl -sS -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H 'Content-Type: application/json' "$@"; }
          ZID=$(cf "https://api.cloudflare.com/client/v4/zones?name=visualdesignmoz.com" | jq -r '.result[0].id')
          REC=$(cf "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?type=A&name=$H")
          echo "antes: $(echo "$REC" | jq -r '.result[] | "\(.content) proxied=\(.proxied)"')"
          [ "$(echo "$REC" | jq '.result | length')" = 1 ] || { echo "esperava 1 registo A para $H"; exit 1; }
          RID=$(echo "$REC" | jq -r '.result[0].id')
          cf -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$RID" \
            --data "{\"content\":\"$CT\",\"proxied\":false}" | jq -r '"depois: \(.result.content) proxied=\(.result.proxied) ok=\(.success)"'
          sleep 20
          set +e
          echo "público (1.1.1.1): $(dig +short A $H @1.1.1.1)"
          curl -sS -o /dev/null -D - --max-time 15 --resolve "$H:2026:$CT" "https://$H:2026/evo/" | grep -i -E '^HTTP|^location'
