name: Ops - Limite de memória do Redis (lê; com «aplicar» põe o limite)

# Mostra quem usa o Redis do servidor (bases, prefixos das chaves, processos ligados), a memória do servidor e do Redis. Com «aplicar»
# marcado, põe `maxmemory` e `maxmemory-policy` em funcionamento (CONFIG SET: sem reinício e sem corte) e grava-os no redis.conf
# (cópia do ficheiro em /root/redis-memoria-<data>/). Depois confirma o Redis, o estado da cache de cada site WordPress e os sites (200).
# Pedido do Silva a 28/10/2026 («aplica e mostre quando estiver a processar»).

on:
  # só para registar o fluxo a partir do ramo de trabalho, antes de estar em main: ao enviar uma alteração a ESTE ficheiro corre uma vez
  # SÓ A LER. Tira-se quando o ficheiro entrar em main.
  push:
    branches: [cache-e-extensoes-wordpress]
    paths: ['.github/workflows/ops-redis-memoria.yml']
  workflow_dispatch:
    inputs:
      maxmemoria:
        description: 'Limite de memória do Redis (ex.: 512mb)'
        required: true
        default: '512mb'
      politica:
        description: 'O que o Redis apaga ao chegar ao limite (allkeys-lru, volatile-lru…)'
        required: true
        default: 'allkeys-lru'
      aplicar:
        description: 'Aplicar de verdade (desmarcado: só lê)'
        type: boolean
        default: false

concurrency:
  group: ops-redis-memoria
  cancel-in-progress: false

jobs:
  redis:
    runs-on: ubuntu-latest
    steps:
      - name: Redis no servidor
        uses: appleboy/ssh-action@v1.2.5
        env:
          MAXMEM: ${{ inputs.maxmemoria || '512mb' }}
          POLITICA: ${{ inputs.politica || 'allkeys-lru' }}
          APLICAR: ${{ inputs.aplicar && 'sim' || 'nao' }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          envs: MAXMEM,POLITICA,APLICAR
          script: |
            set -u
            titulo() { echo; echo "=================== $1"; }
            echo "$MAXMEM" | grep -qE '^[0-9]+(mb|gb)$' || { echo "Limite inválido: $MAXMEM"; exit 1; }
            echo "$POLITICA" | grep -qE '^(allkeys-lru|allkeys-lfu|volatile-lru|volatile-lfu|volatile-ttl|noeviction)$' || { echo "Regra inválida: $POLITICA"; exit 1; }
            titulo "1. Memória do servidor"
            free -m | awk 'NR<=2'
            titulo "2. Redis agora"
            redis-cli ping
            redis-cli info server | grep -E 'redis_version|uptime_in_days|config_file'
            redis-cli info memory | grep -E '^(used_memory_human|used_memory_peak_human|maxmemory_human|maxmemory_policy)'
            redis-cli info stats | grep -E '^(evicted_keys|expired_keys|keyspace_hits|keyspace_misses)'
            echo "--- bases em uso:"; redis-cli info keyspace | grep -E '^db'
            echo "--- ligações por processo (quem fala com o Redis):"
            ss -tnp 2>/dev/null | grep -E ':6379 ' | grep -oE 'users:\(\("[^"]+"' | sort | uniq -c | sort -rn | head -n 10
            titulo "3. O que há em cada base (amostra de até 600 chaves: prefixo · com/sem validade)"
            for db in $(redis-cli info keyspace | grep -oE '^db[0-9]+' | tr -d db); do
              echo "--- base $db:"
              redis-cli -n "$db" --scan --count 200 2>/dev/null | head -n 600 | while read -r k; do
                t=$(redis-cli -n "$db" ttl "$k"); [ "$t" = "-1" ] && v=sem-validade || v=com-validade
                echo "$(echo "$k" | sed -E 's/^([^:]{1,28}).*/\1/') $v"
              done | sort | uniq -c | sort -rn | head -n 8
            done
            titulo "4. Configuração gravada no ficheiro"
            F=$(redis-cli info server | grep -oE 'config_file:.*' | cut -d: -f2 | tr -d '\r'); echo "ficheiro: ${F:-?}"
            [ -n "${F:-}" ] && grep -nE '^(maxmemory|maxmemory-policy)' "$F"

            if [ "$APLICAR" = "sim" ]; then
              titulo "5. A aplicar: maxmemory $MAXMEM · regra $POLITICA"
              D=/root/redis-memoria-$(date +%Y%m%d-%H%M%S); mkdir -p "$D"; chmod 700 "$D"
              [ -n "${F:-}" ] && cp -p "$F" "$D/redis.conf.bak" && echo "cópia do ficheiro em $D"
              redis-cli config set maxmemory "$MAXMEM"
              redis-cli config set maxmemory-policy "$POLITICA"
              redis-cli config rewrite
              echo "--- a seguir:"
              redis-cli info memory | grep -E '^(used_memory_human|maxmemory_human|maxmemory_policy)'
              [ -n "${F:-}" ] && grep -nE '^(maxmemory|maxmemory-policy)' "$F"
              titulo "6. Os sites WordPress com Redis ligado continuam bem?"
              WP=$(command -v wp || echo /usr/local/bin/wp)
              for DOM in entrecamposblog.com desporto.entrecamposblog.com producoes.visualdesignmoz.com; do
                CONTA=""; for d in /home/*/web/"$DOM"; do [ -d "$d" ] && CONTA=$(echo "$d" | cut -d/ -f3) && break; done
                [ -z "$CONTA" ] && continue
                echo "--- $DOM: $(sudo -u "$CONTA" "$WP" --path=/home/$CONTA/web/$DOM/public_html redis status 2>/dev/null | grep -E '^(Status|Errors):' | paste -sd' ')"
              done
              echo "--- basededadosagro.com: $(curl -s -m 30 -o /dev/null -w '%{http_code}' https://basededadosagro.com/)"
            fi
            titulo "fim ($([ "$APLICAR" = sim ] && echo aplicado || echo só leitura))"
