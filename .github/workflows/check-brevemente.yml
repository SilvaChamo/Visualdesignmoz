name: "Ver página Brevemente no ar (só leitura)"
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/check-brevemente.yml']
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://visualdesignmoz.com/pagina-em-construcao/index.html https://visualdesignmoz.com/pagina-em-construcao/ https://visualdesignmoz.com/teste-404; do
            echo "== $u -> $(curl -sS -o /tmp/p -w '%{http_code}' --max-time 20 "$u")"; grep -o '<h1>[^<]*</h1>\|class="dominio"\|PÁGINA NÃO ENCONTRADA\|rounded-\[8px\]' /tmp/p | sort | uniq -c | head
          done
          curl -sS --max-time 20 https://visualdesignmoz.com/versao | grep -o "[0-9a-f]\{7,40\}" | head -3
