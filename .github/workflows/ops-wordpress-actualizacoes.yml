name: Ops - Actualizações de plugins que o painel não vê (só leitura)

# Compara o que o WordPress mostra em Plugins (actualizações disponíveis) com o que o painel lê (`wp plugin list`): idade e conteúdo da
# lista de actualizações guardada pelo WordPress, o cron do WordPress (e do sistema) que a devia renovar e a coluna «update» do wp-cli.
# Só lê. Com «refrescar» marcado também força uma nova verificação das actualizações (apaga e recria só a lista guardada
# `update_plugins`, o mesmo que o botão «Verificar de novo» do WordPress) e mostra o resultado, com e sem o contexto de administração.
# Pedido do Silva a 28/10/2026 (regra 4 de regras.md: só leitura primeiro).

on:
  # só para correr a partir do ramo de trabalho, antes de o ficheiro estar em main: corre uma vez ao enviar uma alteração a ESTE
  # ficheiro, só a leitura (sem refrescar). Tira-se quando o ficheiro entrar em main.
  push:
    branches: [cache-e-extensoes-wordpress]
    paths: ['.github/workflows/ops-wordpress-actualizacoes.yml']
  workflow_dispatch:
    inputs:
      dominio:
        description: 'Domínio do site (ex.: entrecamposblog.com)'
        required: true
        default: 'entrecamposblog.com'
      refrescar:
        description: 'Forçar nova verificação das actualizações (só apaga e recria a lista guardada)'
        type: boolean
        default: false

concurrency:
  group: ops-wordpress-actualizacoes
  cancel-in-progress: false

jobs:
  leitura:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizações de plugins (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOMINIO: ${{ inputs.dominio || 'entrecamposblog.com' }}
          REFRESCAR: ${{ inputs.refrescar && 'sim' || 'nao' }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          envs: DOMINIO,REFRESCAR
          script: |
            set -u
            case "$DOMINIO" in (*[!a-z0-9.-]*|''|*..*) echo "Domínio inválido"; exit 1;; esac
            titulo() { echo; echo "=================== $1"; }
            CONTA=""
            for d in /home/*/web/"$DOMINIO"; do [ -d "$d" ] && CONTA=$(echo "$d" | cut -d/ -f3) && break; done
            [ -z "$CONTA" ] && { echo "O domínio $DOMINIO não está em nenhuma conta do servidor."; exit 0; }
            RAIZ=/home/$CONTA/web/$DOMINIO/public_html
            WP=$(command -v wp || echo /usr/local/bin/wp)
            W="sudo -u $CONTA $WP --path=$RAIZ"
            LER_TRANSIENT='$t = get_site_transient("update_plugins"); echo "última verificação: ".(isset($t->last_checked) ? date("d/m/Y H:i:s", $t->last_checked)." (há ".round((time()-$t->last_checked)/60)." min)" : "nunca")."\n"; $n = isset($t->response) ? count($t->response) : 0; echo "plugins com actualização na lista guardada: $n\n"; if ($n) foreach ($t->response as $f => $o) echo "  $f -> ".($o->new_version ?? "?")."\n"; echo "cache de objectos externa: ".(wp_using_ext_object_cache() ? "sim" : "não")."\n";'
            titulo "$DOMINIO (conta $CONTA) · hora: $(date '+%d/%m/%Y %H:%M:%S %Z')"

            titulo "1. Cron do WordPress"
            echo "DISABLE_WP_CRON no wp-config: $(grep -E "DISABLE_WP_CRON" "$RAIZ/wp-config.php" | cut -c1-80 | head -1)"
            echo "--- eventos que renovam as actualizações:"
            $W cron event list --fields=hook,next_run_relative --format=csv 2>/dev/null | grep -E 'hook|wp_update_plugins|wp_version_check|wp_update_themes'
            echo "--- cron do sistema desta conta (wp / wp-cron):"
            crontab -u "$CONTA" -l 2>/dev/null | grep -E 'wp |wp-cron' | cut -c1-200 || echo "(nenhum)"

            titulo "2. Lista de actualizações guardada pelo WordPress (o que o painel herda)"
            $W eval "$LER_TRANSIENT" 2>&1 | head -n 30

            titulo "3. O que o painel lê: wp plugin list (só os que têm actualização)"
            $W plugin list --fields=name,version,update,update_version --format=csv 2>&1 | grep -vE ',none,' | head -n 30
            echo "total de plugins: $($W plugin list --format=count 2>/dev/null)"

            if [ "$REFRESCAR" = "sim" ]; then
              titulo "4. Depois de forçar a verificação (contexto normal do wp-cli)"
              $W eval 'delete_site_transient("update_plugins"); wp_update_plugins();'" $LER_TRANSIENT" 2>&1 | head -n 30
              echo "--- plugin list a seguir:"
              $W plugin list --fields=name,version,update,update_version --format=csv 2>&1 | grep -vE ',none,' | head -n 30

              titulo "5. Idem, com o contexto de administração (WP_ADMIN) definido antes de carregar o WordPress"
              $W --exec='define("WP_ADMIN", true);' eval 'delete_site_transient("update_plugins"); wp_update_plugins();'" $LER_TRANSIENT" 2>&1 | head -n 30
            fi
            titulo "fim da leitura"
