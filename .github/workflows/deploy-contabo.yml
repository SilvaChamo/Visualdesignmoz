name: Deploy to Contabo (teste)

# ============================================================================
# AVISO PARA QUALQUER AGENTE/PESSOA A MEXER AQUI (2026-08-10):
# Apesar do nome "teste", o utilizador já confirmou que este site é o
# candidato a tornar-se o site PRINCIPAL assim que a configuração terminar
# (ver plano de corte em project_hestia-migration-longterm-plan na memória) —
# não é uma instância descartável. Não trates comportamento estranho aqui
# como "é só sandbox, ignora": os dois sítios abaixo marcados "sandbox"
# (DYNADOT_ENV, MPESA_ENV) são a ÚNICA razão de partes do site não
# funcionarem como no mundo real (ex: verificação de domínios não reconhece
# domínios reais como registados). Antes de mudar isso para produção a
# sério, confirma sempre com o utilizador — envolve dinheiro real
# (registos de domínio reais, cobranças M-Pesa reais a clientes).
# ============================================================================

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Contabo test instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files to Contabo
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'node_modules' --exclude '.next' --exclude '.git' --exclude '*.env*' --exclude '.DS_Store' \
            ./ "root@${{ secrets.CONTABO_HOST }}:/opt/visualdesign-site-teste/"

      - name: Build and (re)start on Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          # Instância de TESTE: liga-se à MESMA base de dados de produção
          # (para os testes serem reais) mas de propósito SEM os cron jobs
          # (renewal-check / da-sync / mailmarketing queue) que o Hetzner tem
          # — correr os dois em simultâneo duplicaria efeitos reais (emails,
          # cobranças). Esta instância é só para teste manual no browser.
          command_timeout: 30m
          script: |
            set -e
            cd /opt/visualdesign-site-teste
            touch .env.local
            set_env_var() {
              local key="$1" value="$2"
              if grep -q "^${key}=" .env.local; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env.local
              else
                echo "${key}=${value}" >> .env.local
              fi
            }
            # Activado a pedido do utilizador (2026-08-11) para ele próprio testar
            # uma compra/transferência de domínio a sério a partir deste site de
            # teste. Chaves de produção — partilha a mesma conta Dynadot da
            # instância de produção (Hetzner), por isso um domínio comprado aqui
            # é um domínio real, a sério, com custo real.
            #
            # REGRA DE SEGURANÇA: só o utilizador humano pode concluir uma compra
            # real a partir daqui (clicar "comprar" no site). Nenhum agente/sessão
            # Claude deve alguma vez chamar a API de registo de domínios
            # directamente (script, curl, teste automatizado) enquanto este
            # ambiente estiver em "production" — só leitura/consulta é permitida.
            set_env_var DYNADOT_ENV "production"
            set_env_var DYNADOT_API_KEY "${{ secrets.DYNADOT_API_KEY }}"
            set_env_var DYNADOT_SECRET_KEY "${{ secrets.DYNADOT_SECRET_KEY }}"
            set_env_var DYNADOT_SANDBOX_API_KEY "${{ secrets.DYNADOT_SANDBOX_API_KEY }}"
            set_env_var DYNADOT_SANDBOX_SECRET_KEY "${{ secrets.DYNADOT_SANDBOX_SECRET_KEY }}"
            set_env_var CRON_SECRET "${{ secrets.CRON_SECRET }}"
            set_env_var CLOUDFLARE_API_TOKEN_ACCOUNT "${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT }}"
            set_env_var CLOUDFLARE_ACCOUNT_ID "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            set_env_var NEXT_PUBLIC_SUPABASE_URL "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            set_env_var NEXT_PUBLIC_SUPABASE_ANON_KEY "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
            set_env_var SUPABASE_SERVICE_ROLE_KEY "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            # Domínio próprio desta instância — sem isto, vários links (reset de
            # password, "aceder ao painel" em emails, origem do OAuth) caem no
            # domínio de produção mesmo a partir daqui.
            set_env_var NEXT_PUBLIC_SITE_URL "https://teste.visualdesignmoz.com"
            # Só para LEITURA (listar contas antigas do DirectAdmin no painel
            # admin) — sem isto a página "Contas" falhava sempre a mostrar as
            # contas antigas e ficava lenta/com erro. Suspender/apagar/mudar
            # password numa conta DirectAdmin a partir daqui ainda não está
            # configurado de propósito (precisa de acesso SSH próprio ao
            # servidor do Hetzner, decisão à parte).
            set_env_var DIRECTADMIN_HOST "${{ secrets.DIRECTADMIN_HOST }}"
            set_env_var DIRECTADMIN_PORT "${{ secrets.DIRECTADMIN_PORT }}"
            set_env_var DIRECTADMIN_PROTOCOL "${{ secrets.DIRECTADMIN_PROTOCOL }}"
            set_env_var DIRECTADMIN_USER "${{ secrets.DIRECTADMIN_USER }}"
            set_env_var DIRECTADMIN_PASSWORD "${{ secrets.DIRECTADMIN_PASSWORD }}"
            set_env_var DIRECTADMIN_LOGIN_KEY "${{ secrets.DIRECTADMIN_LOGIN_KEY }}"
            set_env_var STRIPE_SECRET_KEY "${{ secrets.STRIPE_SECRET_KEY }}"
            set_env_var STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            set_env_var NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"
            set_env_var HESTIA_HOST "${{ secrets.HESTIA_HOST }}"
            set_env_var HESTIA_USER "${{ secrets.HESTIA_USER }}"
            set_env_var HESTIA_PASSWORD "${{ secrets.HESTIA_PASSWORD }}"
            # Único sítio onde isto fica activo: contas novas passam a ir para o
            # Hestia a partir daqui. O Hetzner (produção) nunca recebe esta
            # variável, por isso continua 100% DirectAdmin sem qualquer mudança.
            set_env_var DEFAULT_HOSTING_PROVIDER "hestia"
            # M-Pesa Sandbox — idem, só activo aqui. Em produção o método
            # "M-Pesa" continua manual (comprovativo + confirmação humana),
            # exactamente como está hoje.
            set_env_var MPESA_ENV "sandbox"
            set_env_var NEXT_PUBLIC_MPESA_ENV "sandbox"
            set_env_var MPESA_API_KEY "${{ secrets.MPESA_API_KEY }}"
            set_env_var MPESA_PUBLIC_KEY "${{ secrets.MPESA_PUBLIC_KEY }}"
            set_env_var MPESA_SERVICE_PROVIDER_CODE "${{ secrets.MPESA_SERVICE_PROVIDER_CODE }}"
            set_env_var MPESA_HOST "${{ secrets.MPESA_HOST }}"
            set_env_var MPESA_PORT "${{ secrets.MPESA_PORT }}"
            # SSH genérico (secção "Websites": listar/gerir WordPress via
            # wp-cli, ver src/lib/wp-cli-server.ts) — a app liga-se a si
            # própria por SSH para correr comandos no servidor onde já está,
            # tal como acontece no Hetzner. Reaproveita a mesma chave já usada
            # para o deploy, escrita agora num ficheiro estável no servidor.
            mkdir -p /root/.ssh
            echo "${{ secrets.CONTABO_SSH_KEY }}" > /root/.ssh/app_self_key
            chmod 600 /root/.ssh/app_self_key
            set_env_var SERVER_SSH_KEY_PATH "/root/.ssh/app_self_key"
            set_env_var SERVER_IP "${{ secrets.CONTABO_HOST }}"
            set_env_var SERVER_SSH_USER "root"
            set_env_var SERVER_SSH_PORT "22"
            NODE_VERSION="24.18.0"
            NODE_ROOT="/opt/node-v${NODE_VERSION}"
            NODE_ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
            if [ ! -x "${NODE_ROOT}/bin/node" ]; then
              NODE_CHECKSUM="$(curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" | awk -v file="${NODE_ARCHIVE}" '$2 == file { print $1 }')"
              if [ -z "$NODE_CHECKSUM" ]; then
                echo "Could not find the official Node.js checksum for ${NODE_ARCHIVE}"
                exit 1
              fi
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}" -o "/tmp/${NODE_ARCHIVE}"
              echo "${NODE_CHECKSUM}  /tmp/${NODE_ARCHIVE}" | sha256sum -c -
              mkdir -p "${NODE_ROOT}"
              tar -xJf "/tmp/${NODE_ARCHIVE}" --strip-components=1 -C "${NODE_ROOT}"
              rm "/tmp/${NODE_ARCHIVE}"
            fi
            export PATH="${NODE_ROOT}/bin:$PATH"
            node --version
            npm --version
            npm ci
            npm run build
            pm2 restart visualdesign-site-teste || pm2 start npm --name "visualdesign-site-teste" -- start -- -p 3002
            pm2 save
            bash scripts/install-site-watchdog.sh

            # Reflecte o estado real do Hestia (contas/domínios/suspensões) de volta
            # para o espelho Supabase — sem isto, mudanças feitas directamente no
            # painel Hestia nunca apareciam no painel VisualDesign. Script próprio
            # (scripts/install-hestia-cron.sh) em vez de shell inline aqui: a versão
            # inline anterior falhava silenciosamente dentro do ssh-action de forma
            # não reproduzível por SSH directo (ver histórico do ficheiro) — mesmo
            # depois de reescrita, voltou a falhar aqui dentro sem falhar à mão.
            bash scripts/install-hestia-cron.sh
