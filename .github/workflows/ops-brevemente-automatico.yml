name: "Ops - Contabo: Brevemente automática nos sites sem conteúdo"
# Autorizado pelo Silva a 15/10/2026 ("Avança"; "devia acontecer automaticamente"; excluir a Osher).
# Instala /usr/local/bin/vd-brevemente.sh e corre-o de 30 em 30 minutos. Primeiro mostra o que faria.
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-brevemente-automatico.yml']
jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar o script
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key servidor/vd-brevemente.sh "root@${{ secrets.CONTABO_HOST }}:/root/vd-brevemente.sh"
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set +e
            install -m 755 /root/vd-brevemente.sh /usr/local/bin/vd-brevemente.sh
            [ -f /etc/vd-brevemente-excluir ] || printf 'oshercollective\n' > /etc/vd-brevemente-excluir
            echo "== exclusões:"; cat /etc/vd-brevemente-excluir
            echo "== o que faria agora:"; /usr/local/bin/vd-brevemente.sh --ver; echo "(fim da lista)"
            echo '*/30 * * * * root /usr/local/bin/vd-brevemente.sh >/dev/null 2>&1' > /etc/cron.d/vd-brevemente
            chmod 644 /etc/cron.d/vd-brevemente
            echo "== automático:"; cat /etc/cron.d/vd-brevemente
