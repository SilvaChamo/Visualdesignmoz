name: "Ops - Leitura: mltmark (qual WordPress está no ar) e verificação dos sites (17/10/2026)"
# 2.ª corrida (SÓ LEITURA). A 1.ª aplicou os planos de e-mail (10/50/ilimitadas), Concordia e provisualcorporate no
# VD-Email-Basico (provisualcorporate sem www → www na Vercel), o pacote VD-Dominio, e parou no mltmark: há dois
# WordPress (public_html e public_html/app), cada um com a sua base de dados. Aqui só se lê:
#  - qual dos dois WordPress do mltmark é o que o público vê (endereços gravados em cada base e o pedido que chega);
#  - a verificação dos sites, mais certa: um pedido com uma marca única feito de fora e procurado no registo do nginx
#    deste servidor (vale para qualquer linguagem e também atrás da Cloudflare); a página de espera vê-se no que o site
#    serve de facto, com o plano da conta ao lado.
on:
  push:
    branches: [claude/tender-johnson-wzert9]
    paths: [.github/workflows/ops-planos-contas.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set +e
            H=/usr/local/hestia/bin
            pacote() { $H/v-list-user "$1" json | python3 -c 'import json,sys; print(list(json.load(sys.stdin).values())[0].get("PACKAGE"))'; }

            echo "=== mltmark: os dois WordPress ==="
            R=/home/mltmark/web/mltmark.com/public_html
            echo "--- .htaccess da raiz (regras de reescrita)"; grep -iE "rewrite|app/" $R/.htaccess 2>/dev/null | head -15
            echo "--- index.php da raiz"; head -20 $R/index.php 2>/dev/null | grep -v "^\s*\*\|^\s*/\*\|^\s*$"
            for c in $R/wp-config.php $R/app/wp-config.php; do
              DB=$(grep -E "define\(\s*['\"]DB_NAME" $c | sed -E "s/.*DB_NAME['\"]\s*,\s*['\"]([^'\"]+).*/\1/")
              PF=$(grep -E "^\s*\\\$table_prefix" $c | sed -E "s/.*=\s*['\"]([^'\"]+).*/\1/")
              echo "--- $c -> base $DB, prefixo $PF"
              echo "  endereços gravados: $(mysql -N -e "select option_name, option_value from ${DB}.${PF}options where option_name in ('siteurl','home')" 2>/dev/null | tr '\t\n' '= ')"
              echo "  último artigo/página: $(mysql -N -e "select max(post_modified) from ${DB}.${PF}posts where post_status='publish'" 2>/dev/null)"
              echo "  tamanho da base: $(mysql -N -e "select round(sum(data_length+index_length)/1024/1024,1) from information_schema.tables where table_schema='$DB'" 2>/dev/null) MB"
            done
            echo "--- pastas de wp-content: raiz $(du -sh $R/wp-content 2>/dev/null | cut -f1) | app $(du -sh $R/app/wp-content 2>/dev/null | cut -f1)"

            echo "=== verificação dos sites (marca única pedida de fora e procurada no registo deste servidor) ==="
            for u in $($H/v-list-users plain | cut -f1); do
              PK=$(pacote $u)
              for d in $($H/v-list-web-domains "$u" plain 2>/dev/null | cut -f1); do
                R=/home/$u/web/$d/public_html; CONF=/home/$u/conf/web/$d
                RED=$($H/v-list-web-domain $u $d json | python3 -c 'import json,sys; print(list(json.load(sys.stdin).values())[0].get("REDIRECT",""))' 2>/dev/null)
                if [ -n "$RED" ]; then L="redireccionamento para $RED"
                elif grep -qE "proxy_pass\s+https?://(127\.0\.0\.1|localhost):(3[0-9]{3}|4[0-9]{3}|5[0-9]{3})" $CONF/*nginx*.conf 2>/dev/null; then L=Node.js
                elif [ -f $R/wp-config.php ]; then L=WordPress
                elif [ -f $R/artisan ] || [ -f $R/../artisan ]; then L=Laravel
                elif [ -f $R/index.php ]; then L=PHP
                elif ls $R/*.py >/dev/null 2>&1; then L=Python
                elif [ -f $R/index.html ]; then L="HTML estático"
                else L="sem página"; fi
                M="vdverificar$(date +%s%N | tail -c 9)"
                CORPO=$(curl -s -m 20 "https://$d/?$M=1")
                sleep 1
                if grep -qs "$M" /var/log/nginx/domains/$d.log /var/log/nginx/domains/$d.ssl.log /var/log/apache2/domains/$d.log /var/log/apache2/domains/$d.ssl.log 2>/dev/null; then ONDE="no ar a partir daqui"
                elif [ -z "$(dig +short A $d @1.1.1.1)" ]; then ONDE="sem DNS"
                else ONDE="o público vê outro servidor"; fi
                T=$(echo "$CORPO" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
                ESPERA=""
                if echo "$T" | grep -qiE "brevemente|em constru|coming soon|under construction"; then
                  case "$PK" in VD-Email-*|VD-Dominio) ESPERA=" | página de espera: SEM SITE (plano de e-mail ou só domínio)";; *) ESPERA=" | página de espera: site em preparação";; esac
                fi
                echo "$u ($PK) | $d | $L | $ONDE | título: ${T:-—}$ESPERA"
              done
            done
            echo "=== fim ==="
      - name: O que o público vê (de fora do servidor)
        run: |
          for d in provisualcorporate.co.mz www.provisualcorporate.co.mz concordia.co.mz mltmark.com aamihe.com; do
            echo "--- $d"
            curl -s -m 20 -L -D /tmp/h -o /tmp/b "https://$d/" || echo "  erro do curl: $? ($(curl -sS -m 20 -o /dev/null https://$d/ 2>&1 | head -1))"
            echo "  respostas: $(grep -E '^HTTP' /tmp/h | tr -d '\r' | tr '\n' ' ')"
            echo "  servidor: $(grep -iE '^(server|x-vercel-id|location):' /tmp/h | tr -d '\r' | tr '\n' ' ')"
            echo "  título: $(grep -o '<title>[^<]*' /tmp/b | head -1)"
            rm -f /tmp/h /tmp/b
          done
