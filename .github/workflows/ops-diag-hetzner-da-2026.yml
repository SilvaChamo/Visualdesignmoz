name: "Ops - Diagnóstico do DirectAdmin do Hetzner em host.visualdesignmoz.com:2026 (só leitura)"

# ============================================================================
# SÓ LEITURA (Silva, 16/10/2026 — "voltar a entrar no DA do Hetzner"):
# https://host.visualdesignmoz.com:2026/evo/ deixou de abrir o DirectAdmin do
# Hetzner. Recolhe para onde o nome aponta (DNS/Cloudflare), o que responde na
# porta 2026 vista de fora, e o estado do proxy de cookies (2026) + DirectAdmin
# (2027) dentro do Hetzner. Nada é alterado/criado/apagado.
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-diag-hetzner-da-2026.yml'

jobs:
  de-fora:
    name: visto de fora (DNS + porta 2026)
    runs-on: ubuntu-latest
    steps:
      - name: DNS, Cloudflare e resposta da porta 2026
        env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          set +e
          H=host.visualdesignmoz.com
          echo "===== DNS de $H ====="
          echo "A (1.1.1.1): $(dig +short A $H @1.1.1.1 | tr '\n' ' ')"
          echo "A (8.8.8.8): $(dig +short A $H @8.8.8.8 | tr '\n' ' ')"
          echo "AAAA:        $(dig +short AAAA $H @1.1.1.1 | tr '\n' ' ')"
          echo "NS da zona:  $(dig +short NS visualdesignmoz.com @1.1.1.1 | tr '\n' ' ')"
          echo "IP do Hetzner (secret HETZNER_HOST) resolve para: $(getent hosts "$HETZNER_HOST" | awk '{print $1}' || echo "$HETZNER_HOST") (esperado 37.27.17.25)"
          echo
          echo "===== registo na Cloudflare (tipo / conteúdo / proxied) ====="
          if [ -n "$CF_EMAIL" ] && [ -n "$CF_KEY" ]; then
            ZONE=$(curl -s -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" \
              "https://api.cloudflare.com/client/v4/zones?name=visualdesignmoz.com" | jq -r '.result[0].id // empty')
            if [ -n "$ZONE" ]; then
              curl -s -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$H" \
                | jq -r '.result[] | "\(.type)\t\(.content)\tproxied=\(.proxied)\tmodificado=\(.modified_on)"'
            else
              echo "(visualdesignmoz.com não tem zona nesta conta Cloudflare)"
            fi
          else
            echo "(sem credenciais Cloudflare nos secrets)"
          fi
          echo
          for P in 2026 2222; do
            echo "===== https://$H:$P/evo/ (de fora) ====="
            curl -skS -o /tmp/body -D - --max-time 15 "https://$H:$P/evo/" 2>&1 | head -15
            echo "--- início do corpo ---"; head -c 400 /tmp/body 2>/dev/null; echo
            echo "--- certificado ---"
            echo | timeout 10 openssl s_client -connect "$H:$P" -servername "$H" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -enddate 2>&1
            echo
          done
          echo "===== directamente no IP 37.27.17.25:2026 ====="
          curl -skS -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 --resolve "$H:2026:37.27.17.25" "https://$H:2026/evo/" 2>&1

  portas:
    name: portas abertas no IP do registo e no Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Que portas respondem (nada é alterado)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          H=host.visualdesignmoz.com
          A=$(dig +short A $H @1.1.1.1 | tail -1)
          HZ=$(getent hosts "$HETZNER_HOST" | awk '{print $1}'); HZ=${HZ:-$HETZNER_HOST}
          CT=$(getent hosts "$CONTABO_HOST" | awk '{print $1}'); CT=${CT:-$CONTABO_HOST}
          # os IPs são secrets (aparecem como ***): mostra-se só a comparação e o IP com espaços
          echo "registo A de $H = $(echo "$A" | sed 's/\./ . /g')"
          [ "$A" = "$HZ" ] && echo "-> aponta para o HETZNER" || echo "-> NÃO aponta para o Hetzner"
          [ "$A" = "$CT" ] && echo "-> aponta para o CONTABO" || echo "-> NÃO aponta para o Contabo"
          echo "visualdesignmoz.com A = $(dig +short A visualdesignmoz.com @1.1.1.1 | tr '\n' ' ' | sed 's/\./ . /g')"
          echo
          scan() {
            local ip="$1" nome="$2"
            echo "===== $nome ====="
            for p in 22 "$HETZNER_PORT" 80 443 2026 2027 2222 25 587 993 3002 3003 8083; do
              timeout 6 bash -c "echo > /dev/tcp/$ip/$p" 2>/dev/null; rc=$?
              case $rc in 0) r=ABERTA;; 124) r="sem resposta (firewall a descartar)";; *) r="RECUSADA (nada a escutar)";; esac
              echo "porta $( [ "$p" = "$HETZNER_PORT" ] && echo "SSH-secret" || echo $p ): $r"
            done
            echo "--- banner SSH na porta 22 e na porta do secret ---"
            for p in 22 "$HETZNER_PORT"; do timeout 6 bash -c "exec 3<>/dev/tcp/$ip/$p; head -c 80 <&3" 2>&1 | tr -d '\r' | head -1; done
            echo "--- HTTPS do site principal neste IP ---"
            curl -skS -o /dev/null -w "visualdesignmoz.com via este IP: HTTP %{http_code}\n" --max-time 10 --resolve "visualdesignmoz.com:443:$ip" https://visualdesignmoz.com/ 2>&1
            echo
          }
          scan "$HZ" "Hetzner (secret HETZNER_HOST)"
          [ "$A" != "$HZ" ] && scan "$A" "IP do registo $H"
          curl -sS -o /dev/null -w "https://visualdesignmoz.com (DNS real): HTTP %{http_code}\n" --max-time 10 https://visualdesignmoz.com/

  hetzner:
    name: dentro do Hetzner (proxy 2026 + DirectAdmin)
    runs-on: ubuntu-latest
    steps:
      - name: Estado do proxy de cookies e do DirectAdmin (nada é alterado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== serviços ====="
            for s in directadmin da-cookie-proxy httpd nginx csf lfd; do echo "$s: $(systemctl is-active $s 2>&1) / enabled=$(systemctl is-enabled $s 2>&1)"; done
            echo
            echo "===== quem escuta 2026 / 2027 / 2222 ====="
            ss -tlnp | grep -E ':(2026|2027|2222)\b'
            echo
            echo "===== directadmin.conf (porta/ssl/servername) ====="
            grep -E '^(port|ssl|SSL|servername|carootcert|cacert|cakey|force_hostname|lan_ip|ethernet_dev)=' /usr/local/directadmin/conf/directadmin.conf
            /usr/local/directadmin/directadmin v 2>&1 | head -3
            echo
            echo "===== unit e ficheiros do proxy ====="
            systemctl cat da-cookie-proxy 2>&1 | grep -E 'Environment|ExecStart'
            ls -la /opt/da-cookie-proxy/ 2>&1
            ls -la /opt/da-cookie-proxy/node_modules/http-proxy 2>&1 | head -3
            echo "node: $(command -v node) $(/usr/bin/node -v 2>&1)"
            echo
            echo "===== logs do proxy (últimas 40 linhas) ====="
            journalctl -u da-cookie-proxy -n 40 --no-pager 2>&1
            echo
            echo "===== certificados ====="
            LE=/usr/local/directadmin/data/.lego/certificates/host.visualdesignmoz.com
            ls -la ${LE}.* 2>&1
            [ -f ${LE}.crt ] && openssl x509 -in ${LE}.crt -noout -subject -enddate
            [ -f /opt/da-cookie-proxy/fullchain.pem ] && openssl x509 -in /opt/da-cookie-proxy/fullchain.pem -noout -subject -enddate
            openssl x509 -in /usr/local/directadmin/conf/cacert.pem -noout -subject -enddate 2>&1
            echo
            echo "===== respostas locais ====="
            echo "2026 (proxy):      $(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:2026/evo/)"
            echo "2027 (DA interno): $(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:2027/evo/)"
            echo "2027 http:         $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:2027/evo/)"
            echo "2222:              $(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:2222/evo/)"
            echo
            echo "===== página de login /evo/ (index.html do skin, patch de login) ====="
            IDX=/usr/local/directadmin/data/skins/evolution/assets/index.html
            ls -la $IDX /usr/local/directadmin/data/skins/evolution/assets/da-login-normalize.js 2>&1
            grep -n 'script' $IDX 2>&1 | head -10
            echo
            echo "===== firewall (CSF) ====="
            grep -E '^(TCP_IN|TCP6_IN)' /etc/csf/csf.conf 2>&1
            iptables -S 2>/dev/null | grep -E '2026|2027|2222' | head -10
            echo "csf.deny: $(grep -cv '^#' /etc/csf/csf.deny 2>/dev/null) entradas; últimas:"
            grep -v '^#' /etc/csf/csf.deny 2>/dev/null | tail -10
            echo
            echo "===== DirectAdmin: bloqueios por força-bruta e logs ====="
            echo "ip_blacklist: $(wc -l < /usr/local/directadmin/data/admin/ip_blacklist 2>/dev/null) entradas"
            tail -10 /usr/local/directadmin/data/admin/ip_blacklist 2>/dev/null
            grep -E '^(brute_force|brutecount|ip_brutecount|unblock_brute|clear_blacklist)' /usr/local/directadmin/conf/directadmin.conf
            ls -t /var/log/directadmin/ 2>/dev/null | head -10
            for f in error.log security.log login.log; do
              [ -f /var/log/directadmin/$f ] && { echo "--- $f ---"; tail -15 /var/log/directadmin/$f; }
            done
            echo
            echo "===== estado geral ====="
            uptime; df -h / | tail -1; free -m | head -2
