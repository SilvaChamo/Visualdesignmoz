name: "Ops - Verificar endereços públicos (SÓ LEITURA)"

# SÓ LEITURA: abre os endereços como um visitante (a partir do GitHub, sem segredos nem acesso ao servidor) e mostra
# código, redireccionamento e título. Corre só quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-verificar-publico.yml']

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Endereços
        run: |
          for u in \
            https://visualdesignmoz.com/ \
            https://visualdesignmoz.com/login \
            https://visualdesignmoz.com/vhost \
            https://www.visualdesignmoz.com/ \
            https://teste.visualdesignmoz.com/ \
            https://teste.visualdesignmoz.com/vhost \
            https://host.visualdesignmoz.com/ \
            https://host.visualdesignmoz.com/vhost \
            https://host.visualdesignmoz.com:2026/ \
            https://host.visualdesignmoz.com:2026/evo/ \
            https://host.visualdesignmoz.com:2026/vhost ; do
            r=$(curl -s -o /tmp/p.html -w "%{http_code} %{redirect_url}" --max-time 30 "$u")
            t=$(grep -o '<title>[^<]*' /tmp/p.html | head -1 | sed 's/<title>//')
            printf "%-46s %s | %s\n" "$u" "$r" "$t"
          done
