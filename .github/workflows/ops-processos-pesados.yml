name: "Ops - Reduzir processos pesados e cortar a sincronização com o Hetzner (autorizado pelo Silva, 15/10/2026)"

# O que faz (tudo com cópia em /root/arquivo-reducao-2026-10-15 para se poder repor):
# 1) Hetzner: tira /etc/cron.d/visualdesign-hetzner-passwd e arquiva os scripts de sincronização.
# 2) aamihe.com: bloqueia no nginx os endereços procurados por robôs de ataque; WordPress sem wp-cron a cada visita
#    (DISABLE_WP_CRON) e cron do sistema de 15 em 15 min.
# 3) Antivírus: desliga o maldet-monitor (vigia em tempo real); fica a análise 3x por dia (/etc/cron.d/vd-antivirus).
# No fim mede de novo o CPU.
on:
  push:
    branches: [ops/processos-pesados]

jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 6m
          script: |
            set +e
            A=/root/arquivo-reducao-2026-10-15; mkdir -p $A
            echo "=== antes: CPU (vmstat 2 s x3) ==="; vmstat 2 4 | tail -3

            echo "######## 1) HETZNER ########"
            for f in /etc/cron.d/visualdesign-hetzner-passwd /usr/local/sbin/visualdesign-hetzner-passwd-sync /root/sync_all_emails.sh /root/sync_all_web.sh /root/verify_copies.sh; do
              [ -e "$f" ] && mv "$f" "$A/" && echo "arquivado: $f"
            done
            # (sem pkill: o texto deste script contém os nomes e o pkill apanhava-o; não havia nenhum destes a correr)
            echo "referências ao Hetzner que ainda ficam em cron/systemd:"; grep -rIl -E "37\.27\.17\.25|hetzner" /etc/cron* /var/spool/cron /etc/systemd/system 2>/dev/null || echo "nenhuma"

            echo "######## 2) AAMIHE ########"
            C=/home/aamihe/conf/web/aamihe.com
            BLOQ='location ~* (wp-conflg\.php|/manager\.php|autoload_classmap\.php|wp-includesfontsindex\.php|/wp-adminjs|/wp-admincss|/wp-adminnetwork|/wp-adminwp-) { return 444; }
            location = /admin.php { return 444; }
            location = /xmlrpc.php { return 444; }'
            for n in nginx.conf_bloqueio-robos nginx.ssl.conf_bloqueio-robos; do printf '%s\n' "$BLOQ" | sed 's/^ *//' > $C/$n; done
            ls -la $C | grep -E "conf_" 
            grep -c "nginx.conf_\*\|nginx.ssl.conf_\*" $C/nginx.conf $C/nginx.ssl.conf
            if nginx -t 2>&1 | tail -1 | grep -q successful; then systemctl reload nginx && echo "nginx recarregado"; else echo "nginx -t FALHOU — a retirar o bloqueio"; rm -f $C/nginx.conf_bloqueio-robos $C/nginx.ssl.conf_bloqueio-robos; nginx -t; fi
            WP=/home/aamihe/web/aamihe.com/public_html
            cp -a $WP/wp-config.php $A/aamihe-wp-config.php
            if ! grep -q "DISABLE_WP_CRON" $WP/wp-config.php; then
              sed -i "0,/^\/\* That's all, stop editing/s//define( 'DISABLE_WP_CRON', true ); \/\/ wp-cron corre pelo cron do sistema (15 min)\n&/" $WP/wp-config.php
              grep -q "DISABLE_WP_CRON" $WP/wp-config.php || sed -i "0,/require_once.*wp-settings.php/s//define( 'DISABLE_WP_CRON', true );\n&/" $WP/wp-config.php
            fi
            grep -n "DISABLE_WP_CRON" $WP/wp-config.php
            php -l $WP/wp-config.php
            PHPBIN=$(ls /usr/bin/php8.3 2>/dev/null || command -v php)
            /usr/local/hestia/bin/v-list-cron-jobs aamihe plain | grep -q "wp-cron.php" || /usr/local/hestia/bin/v-add-cron-job aamihe '*/15' '*' '*' '*' '*' "cd $WP && $PHPBIN wp-cron.php >/dev/null 2>&1"
            /usr/local/hestia/bin/v-list-cron-jobs aamihe plain
            echo "--- teste: o site responde? ---"; curl -s -o /dev/null -w "aamihe.com %{http_code}\n" --resolve aamihe.com:443:127.0.0.1 -k https://aamihe.com/
            curl -s -o /dev/null -w "robô (wp-conflg.php) %{http_code}\n" --resolve aamihe.com:443:127.0.0.1 -k https://aamihe.com/wp-adminwp-conflg.php

            echo "######## 3) ANTIVÍRUS ########"
            systemctl stop maldet-monitor; systemctl disable maldet-monitor 2>&1 | tail -1
            systemctl is-active maldet-monitor; systemctl is-enabled maldet-monitor
            echo "análise 3x por dia mantém-se:"; cat /etc/cron.d/vd-antivirus | grep -v "^#"

            echo "=== depois: CPU (vmstat 2 s x5) ==="; sleep 20; vmstat 2 6 | tail -5
            echo "--- processos que mais gastam agora ---"; top -bn2 -d2 -o %CPU | awk '/^top -/{n++} n==2' | sed -n 7,15p
