name: "Ops - Contabo: só visualdesignmoz.com (www. e teste. redireccionam; phpMyAdmin e webmail no domínio principal)"

# ============================================================================
# Pedido do Silva (13/10/2026): só dois endereços — o site https://visualdesignmoz.com/ e o painel
# https://visualdesignmoz.com/vhost/2026/.
#  - www.visualdesignmoz.com → https://visualdesignmoz.com (mesmo caminho, 301);
#  - teste.visualdesignmoz.com → https://visualdesignmoz.com (mesmo caminho, 307), menos o que ainda corre por
#    dentro com esse nome: /api/, /auth/, /phpmyadmin, /webmail, /roundcube, /_next/, /.well-known/;
#  - o domínio principal recebe as mesmas entradas de phpMyAdmin e webmail que o teste. já tinha (se lhe faltarem).
# Se o nginx -t falhar, apaga os ficheiros novos e não recarrega. Não mexe em dados, e-mail, DNS nem certificados.
# Corre só quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.
# ============================================================================

on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-contabo-so-dois-enderecos.yml']

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Só dois endereços
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 10m
          script: |
            set +e
            W=/home/vdadmin/conf/web
            APEX=$W/visualdesignmoz.com
            TESTE=$W/teste.visualdesignmoz.com
            NOVOS=""
            [ -d "$APEX" ] && [ -d "$TESTE" ] || { echo "ERRO: falta $APEX ou $TESTE — paro."; exit 1; }

            echo "===== 1. www. → domínio principal ====="
            for f in nginx.ssl.conf_so_principal nginx.conf_so_principal; do
            cat > "$APEX/$f" <<'NGINX'
            # VisualHost (13/10/2026): só https://visualdesignmoz.com — o www. vai para lá com o mesmo caminho.
            if ($host = "www.visualdesignmoz.com") { return 301 https://visualdesignmoz.com$request_uri; }
            NGINX
            NOVOS="$NOVOS $APEX/$f"; echo "  escrito $APEX/$f"
            done

            echo "===== 2. phpMyAdmin e webmail no domínio principal ====="
            for f in nginx.ssl.conf_phpmyadmin nginx.ssl.conf_webmail nginx.conf_webmail; do
              if [ -f "$APEX/$f" ]; then echo "  $f já existe no principal"
              elif [ -f "$TESTE/$f" ]; then cp "$TESTE/$f" "$APEX/$f" && NOVOS="$NOVOS $APEX/$f" && echo "  copiado $f do teste."
              else echo "  $f não existe no teste. — nada a copiar"; fi
            done

            echo "===== 3. teste. → domínio principal ====="
            for f in nginx.ssl.conf_so_principal nginx.conf_so_principal; do
            cat > "$TESTE/$f" <<'NGINX'
            # VisualHost (13/10/2026): o teste. deixou de ser mostrado — vai para https://visualdesignmoz.com com o mesmo
            # caminho, menos o que ainda corre por dentro com este nome (API, login, phpMyAdmin, webmail, ficheiros
            # da app e renovação do certificado).
            set $vh_principal 1;
            if ($request_uri ~ "^/(api|auth|phpmyadmin|webmail|roundcube|_next|\.well-known)(/|$)") { set $vh_principal 0; }
            if ($vh_principal = 1) { return 307 https://visualdesignmoz.com$request_uri; }
            NGINX
            NOVOS="$NOVOS $TESTE/$f"; echo "  escrito $TESTE/$f"
            done

            echo "===== 4. testar e recarregar ====="
            if nginx -t >/dev/null 2>&1; then
              nginx -t 2>&1 | tail -1
              systemctl reload nginx && echo "  nginx recarregado"
            else
              nginx -t 2>&1 | tail -5
              echo "ERRO: nginx -t falhou — apago os ficheiros novos:$NOVOS"
              rm -f $NOVOS
              nginx -t >/dev/null 2>&1 && systemctl reload nginx
              exit 1
            fi

            echo "===== 5. verificação ====="
            sleep 2
            for u in https://visualdesignmoz.com/ https://www.visualdesignmoz.com/precos https://teste.visualdesignmoz.com/ https://teste.visualdesignmoz.com/vhost/admin https://teste.visualdesignmoz.com/api/system-status https://visualdesignmoz.com/phpmyadmin/ https://visualdesignmoz.com/webmail/ https://host.visualdesignmoz.com:2026/evo/; do
              echo -n "  $u -> "; curl -s -o /tmp/r.html -w "%{http_code} %{redirect_url}" --max-time 20 "$u"; echo " | $(grep -o '<title>[^<]*' /tmp/r.html | head -1)"; rm -f /tmp/r.html
            done
