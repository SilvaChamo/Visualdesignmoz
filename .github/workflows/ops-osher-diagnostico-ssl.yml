name: "Ops - Osher: diagnóstico DNS + SSL dos subdomínios (SÓ LEITURA)"

# Só leitura: lista os registos da zona oshercollective.com na Cloudflare (GET) e,
# para cada nome, mostra para onde resolve, o certificado que apresenta e a
# primeira linha da resposta HTTPS. Não altera nada em lado nenhum.
on:
  push:
    branches: [ops/osher-diagnostico-ssl]

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Zona na Cloudflare + certificado de cada nome
        env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT }}
        run: |
          set +e
          D=oshercollective.com
          if [ -n "$CF_TOKEN" ]; then AUTH=(-H "Authorization: Bearer $CF_TOKEN"); else AUTH=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY"); fi
          ZID=$(curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones?name=$D" | jq -r '.result[0].id')
          if [ -z "$ZID" ] || [ "$ZID" = null ]; then AUTH=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY"); ZID=$(curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones?name=$D" | jq -r '.result[0].id'); fi
          echo "zona: $ZID"
          echo "===== nameservers públicos ====="; dig +short NS $D
          echo "===== registos da zona na Cloudflare (tipo nome valor proxied) ====="
          G=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY")
          curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=500" > r.json
          jq -e '.result' r.json >/dev/null || { jq -c '.errors' r.json; curl -s "${G[@]}" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=500" > r.json; }
          jq -e '.result' r.json >/dev/null || jq -c '.errors' r.json
          cat r.json | jq -r '.result[] | [.type, .name, (.content|tostring|.[0:90]), (if .proxied then "laranja" else "cinzenta" end)] | @tsv' | sort | tee recs.tsv
          echo "===== SSL da zona (modo) ====="
          curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/$ZID/settings/ssl" | jq -r '.result.value'
          echo
          echo "===== cada nome A/AAAA/CNAME: resolve para, certificado, HTTPS ====="
          EXTRA="community.$D comunidade.$D members.$D app.$D portal.$D forum.$D club.$D"
          for n in $( (awk -F'\t' '$1=="A"||$1=="AAAA"||$1=="CNAME"{print $2}' recs.tsv; echo $EXTRA | tr ' ' '\n') | sort -u); do
            echo "---------- $n ----------"
            echo -n "  resolve: "; dig +short $n | tr '\n' ' '; echo
            echo | timeout 10 openssl s_client -connect $n:443 -servername $n 2>/dev/null | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName 2>/dev/null | sed 's/^/  /' | tr '\n' ' '; echo
            echo -n "  https: "; curl -sSI --max-time 10 https://$n/ 2>&1 | head -1
          done

  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo - onde está community.oshercollective.com (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 3m
          script: |
            set +e
            H=/usr/local/hestia/data/users
            echo "=== 'communit' nos ficheiros de configuração do Hestia (web/dns/mail, todas as contas) ==="
            grep -il "communit" $H/*/web.conf $H/*/dns.conf $H/*/mail.conf 2>/dev/null
            grep -ih "communit" $H/*/web.conf $H/*/dns.conf $H/*/mail.conf 2>/dev/null | grep -oE "(DOMAIN|ALIAS)='[^']*'" | head
            echo "=== domínios web da conta oshercollective (nome, aliases, ssl) ==="
            /usr/local/hestia/bin/v-list-web-domains oshercollective json | grep -E '^\s*"[a-z0-9.-]+": \{|"ALIAS"|"SSL"|"DOCUMENT_ROOT"'
            echo "=== pastas com 'communit' em /home (até 6 níveis) ==="
            find /home -maxdepth 6 -type d -iname '*communit*' 2>/dev/null | head -20
            C=community.oshercollective.com
            echo "=== $C no Hestia (SSL, LETSENCRYPT, SUSPENDED) ==="
            /usr/local/hestia/bin/v-list-web-domain oshercollective $C json | grep -E '"(SSL|LETSENCRYPT|SUSPENDED|DOCUMENT_ROOT|PROXY|TPL)"'
            echo "=== certificado em /home/oshercollective/conf/web/$C/ ==="
            ls -la /home/oshercollective/conf/web/$C/ 2>&1
            openssl x509 -noout -subject -enddate -in /home/oshercollective/conf/web/$C/ssl/$C.crt 2>&1
            echo "=== conteúdo da pasta do site ==="
            ls -la /home/oshercollective/web/$C/public_html/ 2>&1 | head -20
            echo "=== nginx -t ==="; nginx -t 2>&1 | tail -3
            echo "=== pedido local por https (resolve para 127.0.0.1) ==="
            curl -skI --max-time 10 --resolve $C:443:127.0.0.1 https://$C/ 2>&1 | head -5
            echo | openssl s_client -connect 127.0.0.1:443 -servername $C 2>/dev/null | openssl x509 -noout -subject -enddate
            echo "=== últimas linhas do log do Let's Encrypt ==="
            tail -25 /var/log/hestia/LE-oshercollective-$C.log 2>/dev/null || ls -t /var/log/hestia/ | head
            echo "=== erros nginx deste site ==="
            tail -5 /var/log/nginx/domains/$C.error.log 2>/dev/null
            echo "=== nginx: ligações em conf.d/domains, se a config carregada tem community, hora do arranque do nginx ==="
            ls -la /etc/nginx/conf.d/domains/ 2>/dev/null | grep -i -E "communit|oshercollective.com"
            nginx -T 2>/dev/null | grep -n "server_name.*community" | head
            nginx -T 2>/dev/null | grep -B2 -A3 "server_name community" | grep -E "listen|server_name" | head
            nginx -T 2>/dev/null | grep -B2 -A3 "server_name oshercollective.com" | grep -E "listen|server_name" | head
            ps -o pid,lstart,cmd -C nginx | head -3
            echo "=== IP do domínio community vs oshercollective.com no web.conf ==="
            grep -E "DOMAIN='(community\.)?oshercollective.com'" /usr/local/hestia/data/users/oshercollective/web.conf | grep -oE "(DOMAIN|IP)='[^']*'"
            echo "=== teste local ao IP público ==="
            IP=$(hostname -I | awk '{print $1}'); echo "ip: $IP"
            echo | openssl s_client -connect $IP:443 -servername community.oshercollective.com 2>/dev/null | openssl x509 -noout -subject
            echo "=== nginx a falar de community ==="
            grep -rl "community.oshercollective" /etc/nginx /home/*/conf 2>/dev/null | head
