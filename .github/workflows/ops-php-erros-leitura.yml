name: Ops - Onde o PHP grava os erros de um site (só leitura)

# Pedido do Silva a 28/10/2026: ao abrir o Elementor e falhar, o sistema devia ter gravado o erro num ficheiro na pasta do site (visível no gestor de
# ficheiros) para se consultar o problema real. Antes de mudar o que quer que seja, esta leitura mostra onde os erros vão parar hoje: o pool PHP-FPM
# do domínio, os ficheiros de registo que existem (PHP, nginx, PHP-FPM da conta), o que têm de recente e se já há um `error_log` na pasta do site.
# Só lê; não altera nada.
# 31/10/2026 (site lento e 504 depois de passar da conta vdadmin para a conta própria): acrescentadas as leituras 7 a 11 — caminhos da conta antiga ainda
# guardados no site (ficheiros e base de dados), ficheiros que a conta nova não consegue escrever, onde o `slow_log` mostra os pedidos parados, limites
# das duas contas e quantos timeouts houve por dia antes e depois da mudança.

on:
  workflow_dispatch:
    inputs:
      dominio:
        description: 'Domínio do site (ex.: entrecamposblog.com)'
        required: true
        default: 'entrecamposblog.com'
      antiga:
        description: 'Conta antiga do site (para procurar caminhos que ficaram para trás)'
        required: false
        default: 'vdadmin'

concurrency:
  group: ops-php-erros
  cancel-in-progress: false

jobs:
  leitura:
    runs-on: ubuntu-latest
    steps:
      - name: Registos de erros do site (servidor)
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOMINIO: ${{ inputs.dominio || 'entrecamposblog.com' }}
          ANTIGA: ${{ inputs.antiga || 'vdadmin' }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          envs: DOMINIO,ANTIGA
          script: |
            set -u
            echo "$DOMINIO" | grep -qE '^[a-z0-9.-]+$' || { echo "Domínio inválido"; exit 1; }
            titulo() { echo; echo "=================== $1"; }
            CONTA=""
            for d in /home/*/web/"$DOMINIO"; do [ -d "$d" ] && CONTA=$(echo "$d" | cut -d/ -f3) && break; done
            [ -z "$CONTA" ] && { echo "O domínio $DOMINIO não está em nenhuma conta do servidor."; exit 0; }
            RAIZ=/home/$CONTA/web/$DOMINIO
            titulo "$DOMINIO (conta $CONTA) · $(date '+%d/%m/%Y %H:%M:%S')"
            titulo "1. Pool PHP-FPM do domínio (só linhas de registo e limites)"
            for f in /etc/php/*/fpm-contas/"$CONTA"/pool.d/"$DOMINIO".conf /etc/php/*/fpm/pool.d/"$DOMINIO".conf; do
              [ -f "$f" ] && { echo "--- $f"; grep -E 'error_log|log_errors|display_errors|slowlog|catch_workers_output|decorate_workers_output|request_terminate_timeout|user *=' "$f" | cut -c1-200; }
            done
            titulo "2. Modelo de pool que o Hestia usa para este domínio"
            grep -E "^(BACKEND|PROXY|WEB_TPL)|BACKEND=|TPL=" /usr/local/hestia/data/users/"$CONTA"/web.conf 2>/dev/null | grep -F "$DOMINIO" | head -2 | tr ' ' '\n' | grep -E "^'?(BACKEND|PROXY|TPL)" | head -5
            for t in /usr/local/hestia/data/templates/web/php-fpm/default.tpl; do [ -f "$t" ] && { echo "--- $t"; grep -E 'error_log|slowlog|catch_workers' "$t" | cut -c1-200; }; done
            titulo "3. Ficheiros de registo que existem para este site"
            ls -la "$RAIZ"/logs/ 2>/dev/null | head -10
            ls -la /var/log/nginx/domains/"$DOMINIO"*.log /var/log/apache2/domains/"$DOMINIO"*.log 2>/dev/null
            ls -la /var/log/php*-fpm-"$CONTA".log /var/log/php*-fpm.log 2>/dev/null
            echo "--- na pasta do site (public_html) há:"
            ls -la "$RAIZ"/public_html/error_log "$RAIZ"/public_html/*.log "$RAIZ"/public_html/wp-content/debug.log 2>/dev/null || echo "(nenhum error_log, .log nem debug.log)"
            titulo "4. Últimas linhas do registo de erros do nginx deste site (erros de PHP/timeouts)"
            for L in /var/log/nginx/domains/"$DOMINIO".error.log /var/log/apache2/domains/"$DOMINIO".error.log; do
              [ -f "$L" ] || continue
              echo "--- $L ($(wc -l < "$L") linhas) · tipos de erro mais frequentes:"
              sed -E 's/^\[[^]]*\] //; s/\[client [^]]*\] //; s/\[pid [0-9:a-z ]*\] //; s/[0-9]{3,}/N/g' "$L" | cut -c1-110 | sort | uniq -c | sort -rn | head -n 12
              echo "--- últimas 15 linhas:"; tail -n 15 "$L" | cut -c1-300
            done
            titulo "5. Últimas linhas do registo do PHP-FPM da conta (timeouts, processos mortos)"
            for f in /var/log/php*-fpm-"$CONTA".log; do [ -f "$f" ] && { echo "--- $f"; tail -n 25 "$f" | cut -c1-260; }; done
            titulo "6. WP_DEBUG e registo do WordPress"
            grep -E "WP_DEBUG|WP_DEBUG_LOG|WP_DEBUG_DISPLAY" "$RAIZ"/public_html/wp-config.php 2>/dev/null | cut -c1-120
            echo "--- php.ini do pool: log_errors / error_log"
            for f in /etc/php/*/fpm/php.ini; do echo "$f: $(grep -E '^(log_errors|error_log|display_errors) *=' "$f" | tr '\n' ' ')"; done
            titulo "7. Caminhos da conta antiga ($ANTIGA) ainda guardados no site"
            echo "$ANTIGA" | grep -qE '^[a-z0-9_-]+$' || { echo "Conta antiga inválida"; exit 1; }
            PUB=$RAIZ/public_html
            echo "--- ficheiros de configuração do WordPress e do WP-Optimize com /home/$ANTIGA (linhas · ficheiro):"
            for f in "$PUB"/wp-config.php "$PUB"/.htaccess "$PUB"/wp-content/*.php "$PUB"/wp-content/uploads/.htaccess "$PUB"/wp-content/mu-plugins/*.php "$PUB"/wp-content/wp-optimize-config/* "$PUB"/wp-content/cache/wpo-cache/*.php; do
              [ -f "$f" ] && c=$(grep -c "/home/$ANTIGA" "$f" 2>/dev/null) && echo "$c · ${f#$PUB/}"
            done
            [ -f "$PUB"/wp-content/advanced-cache.php ] && { echo "--- advanced-cache.php (linhas com o caminho):"; grep -n "/home/" "$PUB"/wp-content/advanced-cache.php | cut -c1-200 | head -n 6; }
            DBN=$(grep -E "DB_NAME" "$PUB"/wp-config.php 2>/dev/null | head -1 | sed -E "s/.*DB_NAME['\"] *, *['\"]([^'\"]+).*/\1/")
            PFX=$(grep -E '^\$table_prefix' "$PUB"/wp-config.php 2>/dev/null | head -1 | sed -E "s/.*= *['\"]([^'\"]+).*/\1/")
            if echo "$DBN$PFX" | grep -qE '^[A-Za-z0-9_]+$'; then
              echo "--- base de dados $DBN (prefixo $PFX): opções com /home/$ANTIGA (nome · pedaço à volta do caminho):"
              mysql -N -e "SELECT option_name, SUBSTRING(option_value, GREATEST(LOCATE('/home/$ANTIGA', option_value)-30, 1), 150) FROM ${PFX}options WHERE option_value LIKE '%/home/$ANTIGA%' LIMIT 25" "$DBN" 2>&1 | cut -c1-240
              echo "--- upload_path, upload_url_path, siteurl e home:"
              mysql -N -e "SELECT option_name, option_value FROM ${PFX}options WHERE option_name IN ('upload_path','upload_url_path','siteurl','home')" "$DBN" 2>&1 | cut -c1-160
            else
              echo "(não consegui ler o nome da base de dados nem o prefixo do wp-config.php)"
            fi
            titulo "8. Ficheiros do site que a conta $CONTA não é dona (podem não deixar escrever cache e CSS)"
            echo "fora da conta: $(nice -n 10 ionice -c3 find "$PUB" -xdev ! -user "$CONTA" 2>/dev/null | wc -l) de $(nice -n 10 ionice -c3 find "$PUB" -xdev 2>/dev/null | wc -l) ficheiros e pastas"
            nice -n 10 ionice -c3 find "$PUB" -xdev ! -user "$CONTA" -printf '%u:%g %m %p\n' 2>/dev/null | head -n 15 | cut -c1-200
            echo "--- pastas onde o WordPress escreve (dono · permissões · pasta):"
            for d in wp-content wp-content/uploads wp-content/cache wp-content/uploads/elementor wp-content/uploads/elementor/css wp-content/wp-optimize-cache wp-content/plugins/wp-optimize; do [ -e "$PUB/$d" ] && stat -c '%U:%G %a  %n' "$PUB/$d" | sed "s#$PUB/##"; done
            titulo "9. slow_log: onde ficam parados os pedidos com mais de 15 s"
            SL=$PUB/slow_log
            if [ -f "$SL" ]; then
              echo "tamanho: $(stat -c %s "$SL") bytes · primeira e última data:"; grep -aoE '^\[[0-9]{2}-[A-Za-z]{3}-[0-9]{4} [0-9:]+\]' "$SL" | sed -n '1p;$p'
              echo "--- pedidos lentos por script e primeira linha do rasto (quantos · script :: onde está parado):"
              awk '/^script_filename/{s=$3; sub(".*public_html/","",s); if ((getline l) > 0) { sub(/^\[0x[0-9a-f]+\] /,"",l); gsub(/\/home\/[a-z0-9_]+\/web\/[a-z0-9.-]+\/public_html\//,"",l); print s " :: " substr(l,1,130) } }' "$SL" | sort | uniq -c | sort -rn | head -n 15
              echo "--- último rasto completo:"; awk -v RS= 'END{print}' "$SL" | cut -c1-210 | head -n 30
            else
              echo "(não há slow_log nesta pasta)"
            fi
            titulo "10. Limites e pool: $CONTA contra $ANTIGA"
            for c in "$CONTA" "$ANTIGA"; do
              echo "--- conta $c"
              grep -E "^(PACKAGE|CPU_QUOTA|CPU_QUOTA_PERIOD|MEMORY_LIMIT|SWAP_LIMIT)=" /usr/local/hestia/data/users/"$c"/user.conf 2>/dev/null
              U2=$(systemctl list-units --all --no-legend 'vd-php-fpm-*' 2>/dev/null | awk '{print $1}' | grep -- "-$c\.service" | head -1)
              echo "unidade: ${U2:-nenhuma (usa o PHP-FPM partilhado)}"
              [ -n "$U2" ] && systemctl show "$U2" -p CPUQuotaPerSecUSec -p MemoryHigh -p MemoryMax -p MemoryCurrent -p MemoryPeak
              for d in /etc/php/*/fpm-contas/"$c"; do
                [ -d "$d" ] && { echo "$d: módulos opcache: $(ls "$d"/conf.d 2>/dev/null | grep -ci opcache) · $(grep -E '^opcache\.(enable|memory_consumption|max_accelerated_files|validate_timestamps|revalidate_freq)' "$d"/php.ini 2>/dev/null | tr '\n' ' ')"; grep -hE '^(pm|pm\.[a-z_]+) *=' "$d"/pool.d/*.conf 2>/dev/null | sort | uniq -c | head -n 8; }
              done
            done
            titulo "11. Por dia: pedidos, 504 e timeouts do PHP (a conta mudou a 30/10 às 16:02)"
            echo "--- registo de acessos (dia · pedidos · com 504):"
            for f in /var/log/apache2/domains/"$DOMINIO".log*; do zcat -f "$f" 2>/dev/null; done | awk '{d=substr($4,2,11); t[d]++; if ($9==504) e[d]++} END{for (d in t) printf "%s · %d pedidos · %d com 504\n", d, t[d], e[d]}' | sort -t/ -k2,2M -k1,1n
            echo "--- registo de erros (dia · timeouts ou ligação cortada com o PHP):"
            for f in /var/log/apache2/domains/"$DOMINIO".error.log*; do zcat -f "$f" 2>/dev/null; done | grep -aE 'proxy_fcgi:error' | grep -aE 'timeout specified|FastCGI header|Connection reset' | awk '{print $2, $3}' | sort -k1,1M -k2,2n | uniq -c
            titulo "12. O servidor está à espera do disco? (pressão de disco, CPU e memória; processos presos no disco; trabalhos pesados)"
            for r in io cpu memory; do echo "--- /proc/pressure/$r"; cat /proc/pressure/$r 2>/dev/null; done
            echo "--- vmstat (5 s; coluna wa = espera de disco, r = a correr, b = presos):"; vmstat 1 5 2>/dev/null | tail -n 6
            echo "--- processos em espera de disco (estado D):"; ps -eo stat,pid,user:12,etime,args 2>/dev/null | awk '$1 ~ /^D/' | head -n 12 | cut -c1-170
            echo "--- trabalhos pesados em curso (antivírus, cópias, envio, compressão):"; ps -eo pid,user:10,etime,nice,args 2>/dev/null | grep -E 'maldet|clamscan|clamdscan|clamonacc|v-backup|rclone|rsync|tar |gzip|zstd|mysqldump|find /home' | grep -v grep | head -n 12 | cut -c1-170
            echo "--- disco: espaço e atraso por leitura/escrita (iostat, 3 s):"; df -h /home 2>/dev/null | cut -c1-90; command -v iostat >/dev/null && iostat -x 1 3 2>/dev/null | awk '/^Device/{f=1} f' | tail -n 6 | cut -c1-160
            echo "--- ficheiros em wp-content/cache: $(nice -n 10 ionice -c3 find "$PUB"/wp-content/cache -xdev -type f 2>/dev/null | wc -l)"
            titulo "13. Quem gasta o CPU agora (por serviço e por processo, 2 amostras de 3 s) e a que horas correm os trabalhos agendados"
            echo "--- por serviço (systemd-cgtop; a 2.ª amostra é a que conta):"
            command -v systemd-cgtop >/dev/null && systemd-cgtop -b -n 2 -d 3 -c --depth=3 2>/dev/null | awk '/^Control Group/{n++} n==2' | head -n 16 | cut -c1-120
            echo "--- por processo (top, 2.ª amostra):"
            top -b -n 2 -d 3 -w 160 -o %CPU 2>/dev/null | awk '/^top - /{n++} n==2' | sed -n '1,4p;7,20p' | cut -c1-160
            echo "--- trabalhos agendados do sistema (hora · utilizador · programa):"
            for f in /etc/cron.d/vd-*; do [ -f "$f" ] && awk -v f="${f##*/}" '!/^#/ && NF>6 && $1 !~ /=/ {print f ": " $1" "$2" "$3" "$4" "$5" "$6" "$7}' "$f" | cut -c1-150; done
            titulo "14. Porque o servidor deixa um domínio suspenso depois de o passar de conta (só leitura)"
            H=/usr/local/hestia/bin
            for c in "$CONTA" "$ANTIGA"; do echo "--- conta $c: SUSPENDED=$(grep -m1 '^SUSPENDED=' /usr/local/hestia/data/users/$c/user.conf 2>/dev/null)"; done
            echo "--- domínio $DOMINIO em web.conf (conta $CONTA): $(grep "DOMAIN='$DOMINIO'" /usr/local/hestia/data/users/"$CONTA"/web.conf 2>/dev/null | grep -oE "(SUSPENDED|SSL)='[a-z]*'" | tr '\n' ' ')"
            for f in v-change-domain-owner v-change-web-domain-owner; do
              [ -f "$H/$f" ] && { echo "--- $f: linhas com suspend / SSL / rebuild:"; grep -nEi "suspend|SSL|rebuild|v-add-web|v-delete-web" "$H/$f" | cut -c1-170 | head -n 24; }
            done
            echo "--- v-change-domain-owner, passo do site (linhas 45 a 145):"; sed -n 45,145p "$H/v-change-domain-owner" 2>/dev/null | cut -c1-170
            titulo "16. O Cache Enabler está a guardar páginas? (só leitura)"
            PUB=$RAIZ/public_html
            echo "--- advanced-cache.php:"; head -c 700 "$PUB"/wp-content/advanced-cache.php 2>/dev/null | cut -c1-160
            echo "--- definições em ficheiro (wp-content/settings):"; find "$PUB"/wp-content/settings -type f -printf '%u %m %s %p\n' 2>/dev/null | sed "s#$PUB/##" | head -n 5
            echo "--- pasta da cache: $(ls -ld "$PUB"/wp-content/cache/cache-enabler 2>/dev/null | awk '{print $1" "$3}') · ficheiros: $(find "$PUB"/wp-content/cache/cache-enabler -type f 2>/dev/null | wc -l)"
            echo "--- opção cache_enabler:"; sudo -u "$CONTA" nice -n 10 /usr/local/bin/wp --path="$PUB" option get cache_enabler --format=json 2>&1 | cut -c1-600
            IPSITE=$(/usr/local/hestia/bin/v-list-web-domain "$CONTA" "$DOMINIO" json 2>/dev/null | grep -oE '"IP": *"[0-9.]+"' | head -1 | grep -oE '[0-9.]+' | head -1); IPSITE=${IPSITE:-127.0.0.1}
            curl -sk -m 40 --resolve "$DOMINIO:443:$IPSITE" -D /tmp/vd-c.$$ -o /tmp/vd-b.$$ "https://$DOMINIO/"
            echo "--- cabeçalhos: $(tr -d '\r' < /tmp/vd-c.$$ | grep -iE '^(HTTP|cache-control|x-cache|set-cookie|content-type|vary)' | cut -c1-90 | tr '\n' '|')"
            echo "--- marca do Cache Enabler no fim do HTML: $(tail -c 400 /tmp/vd-b.$$ | grep -aoiE 'Cache Enabler[^>]{0,80}' | head -1)"
            echo "--- tamanho do HTML: $(wc -c < /tmp/vd-b.$$) · ficheiros da cache agora: $(find "$PUB"/wp-content/cache/cache-enabler -type f 2>/dev/null | wc -l)"
            rm -f /tmp/vd-c.$$ /tmp/vd-b.$$
            echo "--- error_log (cache):"; grep -aiE "cache.enabler|advanced-cache|cache_enabler" "$PUB"/error_log 2>/dev/null | tail -n 6 | cut -c1-230
            titulo "17. Ficheiros da cache do Cache Enabler e regras no .htaccess (só leitura)"
            PUB=$RAIZ/public_html
            find "$PUB"/wp-content/cache/cache-enabler -printf '%y %m %u %s %p\n' 2>/dev/null | sed "s#$PUB/##" | head -n 20
            echo "--- .htaccess: bloco do Cache Enabler e primeiras regras:"; grep -n "VD-Cache-Enabler" "$PUB"/.htaccess; sed -n '/BEGIN VD-Cache-Enabler/,/END VD-Cache-Enabler/p' "$PUB"/.htaccess | head -n 30
            echo "--- Apache: módulos rewrite e headers: $(apache2ctl -M 2>/dev/null | grep -E 'rewrite|headers' | tr -s ' ' | tr '\n' ' ')"
            echo "--- DocumentRoot do site no Apache: $(grep -h DocumentRoot /home/$CONTA/conf/web/$DOMINIO/apache2.conf 2>/dev/null | head -1)"
            echo "--- AllowOverride: $(grep -h AllowOverride /home/$CONTA/conf/web/$DOMINIO/apache2.conf 2>/dev/null | head -2 | tr -s ' ' | tr '\n' ' ')"
            titulo "fim da leitura"
