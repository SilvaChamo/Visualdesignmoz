name: Provision email auth for a domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domínio a aplicar/actualizar autenticação de email (ex.: entrecamposblog.com)'
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de autenticação de email
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -f -G "https://teste.visualdesignmoz.com/api/cron/provision-email-auth" \
            --data-urlencode "domain=$DOMAIN" \
            -H "Authorization: Bearer $CRON_SECRET"
