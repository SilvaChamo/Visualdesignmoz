name: "Ops - Contabo: alargar a partição do sistema para os 200 GB do disco"

# O disco (sda) passou a ter 200 GB, mas a partição do sistema (sda1, ext4, última do disco) ficou com 99 GB.
# Alarga sda1 até ao fim do disco e o sistema de ficheiros com ela — com o servidor ligado, sem reiniciar.
# Só avança se o disco estiver exactamente como no diagnóstico (17/10/2026); senão pára sem mexer em nada.
on:
  push:
    branches: [claude/laughing-cray-kr2z4n]

jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Alargar sda1 no Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e
            echo "=== antes ==="; df -hT /; lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT /dev/sda
            [ "$(findmnt -no SOURCE /)" = "/dev/sda1" ] || { echo "PÁRA: / não está em /dev/sda1"; exit 1; }
            [ "$(findmnt -no FSTYPE /)" = "ext4" ] || { echo "PÁRA: / não é ext4"; exit 1; }
            [ "$(lsblk -dno TYPE /dev/sda)" = "disk" ] || { echo "PÁRA: /dev/sda não é um disco"; exit 1; }
            echo "=== cópia da tabela de partições ==="
            B=/root/sda-particoes-antes-de-alargar-$(date +%Y%m%d-%H%M%S).txt
            sfdisk -d /dev/sda > "$B"; echo "guardada em $B"; cat "$B"
            echo "=== ensaio (não muda nada) ==="; growpart --dry-run /dev/sda 1
            echo "=== alargar a partição ==="; growpart /dev/sda 1
            echo "=== alargar o sistema de ficheiros ==="; resize2fs /dev/sda1
            echo "=== depois ==="; df -hT /; lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT /dev/sda; sfdisk -l /dev/sda 2>&1 | tail -8
