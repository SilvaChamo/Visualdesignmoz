name: "Ops - Contabo: porque o login falha em visualdesignmoz.com (CORS do Supabase) (SÓ LEITURA)"

# SÓ LEITURA (13/10/2026): o login em https://visualdesignmoz.com/login dá "Failed to fetch". Ver se o Supabase do
# Contabo aceita pedidos vindos de https://visualdesignmoz.com (CORS) como aceita de teste. Nada é alterado e não se
# imprimem segredos (só o endereço público do Supabase, que já está no site). Corre só quando este ficheiro muda no
# ramo claude/kind-einstein-r6lyf6.
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-contabo-cors.yml']

jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set +e
            SB=$(grep '^NEXT_PUBLIC_SUPABASE_URL=' /opt/visualdesign-site-teste/.env.local | cut -d= -f2- | tr -d '"')
            echo "Supabase usado pelo site: $SB"
            H=$(echo "$SB" | sed -E 's#^https?://##; s#/.*##')
            echo
            echo "===== pré-voo CORS para /auth/v1/token ====="
            for o in https://visualdesignmoz.com https://teste.visualdesignmoz.com; do
              echo "-- Origin: $o"
              curl -s -o /dev/null -D - -X OPTIONS --max-time 15 "$SB/auth/v1/token?grant_type=password" \
                -H "Origin: $o" -H "Access-Control-Request-Method: POST" \
                -H "Access-Control-Request-Headers: apikey,authorization,content-type,x-client-info" \
                | grep -iE "^HTTP|^access-control" | sed 's/^/   /'
            done
            echo
            echo "===== nginx: CORS e server do Supabase ====="
            grep -rnE "Access-Control-Allow-Origin|add_header .*Origin|\\\$http_origin" /etc/nginx/ /home/*/conf/web/ 2>/dev/null | head -20
            echo "  ficheiros do domínio $H:"
            ls /home/*/conf/web/$H/ 2>/dev/null | sed 's/^/    /'
            grep -rln "server_name[^;]*$H" /etc/nginx/ /home/*/conf/web/ 2>/dev/null | head
            echo
            echo "===== Supabase (.env): endereços (sem segredos) ====="
            grep -E "^(SITE_URL|API_EXTERNAL_URL|SUPABASE_PUBLIC_URL|ADDITIONAL_REDIRECT_URLS)=" /opt/supabase-contabo/docker/.env 2>/dev/null
            echo
            echo "===== Kong: cors ====="
            grep -nE "cors|origins" /opt/supabase-contabo/docker/volumes/api/kong.yml 2>/dev/null | head -20
