name: "Ops - Contabo: ler a página antiga da concordia (só leitura)"
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-ler-concordia.yml']
jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            P=/home/concordia/web/concordia.co.mz/public_html
            ls -la $P
            md5sum $P/index.html.com; wc -c $P/index.html.com
            grep -o -i '<title>[^<]*' $P/index.html.com | head -2
            sed 's/<[^>]*>/ /g' $P/index.html.com | tr -s ' \n' ' ' | cut -c1-600
            echo; echo "== servido agora:"; curl -sk --max-time 10 --resolve concordia.co.mz:443:127.0.0.1 -o /dev/null -w '%{http_code}\n' https://concordia.co.mz/
            echo "== outros sites com páginas parecidas (DirectAdmin):"; grep -l -i "directadmin" /home/*/web/*/public_html/index.html 2>/dev/null | head
