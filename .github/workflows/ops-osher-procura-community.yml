name: "Ops - Osher: procurar a comunidade no Hetzner e no Contabo (SÓ LEITURA)"

# Só leitura: procura pastas, configurações e páginas WordPress com "community"/"comunidade"
# da conta oshercollective nos dois servidores. Não altera nada.
on:
  push:
    branches: [ops/osher-procura-community]

jobs:
  hetzner:
    runs-on: ubuntu-latest
    steps:
      - name: Hetzner (DirectAdmin)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            S=$( [ "$(id -u)" = 0 ] && echo "" || echo "sudo" )
            echo "=== subdomínios DirectAdmin da osher ==="
            $S cat /usr/local/directadmin/data/users/oshercollective/domains/*.subdomains 2>/dev/null
            echo "=== pastas communit*/comunidad* em /home/oshercollective (até 7 níveis) ==="
            $S find /home/oshercollective -maxdepth 7 -type d \( -iname '*communit*' -o -iname '*comunidad*' \) 2>/dev/null | grep -v '/imap/' | head -30
            echo "=== configs do servidor web a falar de community ==="
            $S grep -rl -i "community.oshercollective" /etc/httpd /etc/nginx /usr/local/directadmin/data/users/oshercollective 2>/dev/null | head
            echo "=== pastas de topo de oshercollective.com/public_html ==="
            $S ls -la /home/oshercollective/domains/oshercollective.com/public_html/ 2>/dev/null | head -50
            echo "=== WordPress da osher: páginas e plugins de comunidade ==="
            WP=/home/oshercollective/domains/oshercollective.com/public_html
            $S ls $WP/wp-content/plugins 2>/dev/null | grep -iE "buddy|bbpress|communit|peepso|youzify|forum|member|ultimate|circle|discord"
            DB=$(grep -oP "DB_NAME',\s*'\K[^']+" $WP/wp-config.php 2>/dev/null); PFX=$(grep -oP "table_prefix\s*=\s*'\K[^']+" $WP/wp-config.php 2>/dev/null)
            echo "bd: $DB prefixo: $PFX"

            Q() { $S mysql -N -e "$1" 2>&1 | grep -v Deprecated | head -${2:-15}; }
            echo "--- qualquer tipo de conteúdo com community/comunidade no nome ou título (tipo, estado, slug, título) ---"
            Q "SELECT post_type,post_status,post_name,LEFT(post_title,60) FROM \`$DB\`.${PFX}posts WHERE post_type NOT IN ('revision','attachment') AND (post_name REGEXP 'communit|comunidad' OR post_title REGEXP 'ommunit|omunidad');"
            echo "--- itens de menu / conteúdos que ligam para community.oshercollective.com ou /community ---"
            Q "SELECT p.post_type,p.post_status,p.post_name,LEFT(p.post_title,50) FROM \`$DB\`.${PFX}posts p WHERE p.post_type NOT IN ('revision') AND p.post_content REGEXP 'community\\\\.oshercollective|oshercollective\\\\.com/communit';"
            Q "SELECT m.post_id,m.meta_key,LEFT(m.meta_value,120) FROM \`$DB\`.${PFX}postmeta m WHERE m.meta_value REGEXP 'community\\\\.oshercollective|/communit|/comunidad';"
            echo "--- nº de conteúdos que mencionam community/comunidade no texto, por tipo ---"
            Q "SELECT post_type,post_status,COUNT(*) FROM \`$DB\`.${PFX}posts WHERE post_type NOT IN ('revision') AND post_content REGEXP 'ommunity|omunidade' GROUP BY 1,2;"
            echo "--- títulos desses conteúdos ---"
            Q "SELECT post_type,post_status,post_name,LEFT(post_title,60) FROM \`$DB\`.${PFX}posts WHERE post_type IN ('page','post','elementor_library','wp_template','wp_block','wp_navigation') AND post_content REGEXP 'ommunity|omunidade';" 25
            echo "--- opções (wp_options) ---"
            Q "SELECT option_name,LEFT(option_value,100) FROM \`$DB\`.${PFX}options WHERE option_name REGEXP 'communit|comunidad|buddy|bbp|peepso' OR option_value REGEXP 'community\\\\.oshercollective';"
            echo "--- tipos de conteúdo existentes ---"
            Q "SELECT post_type,COUNT(*) FROM \`$DB\`.${PFX}posts GROUP BY 1 ORDER BY 2 DESC;" 30
            echo "--- plugins activos ---"
            Q "SELECT option_value FROM \`$DB\`.${PFX}options WHERE option_name='active_plugins';" 3
  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo (Hestia)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== pastas communit*/comunidad* em /home/oshercollective (até 7 níveis) ==="
            find /home/oshercollective -maxdepth 7 -type d \( -iname '*communit*' -o -iname '*comunidad*' \) 2>/dev/null | grep -v '/mail/' | head -30
            WP=/home/oshercollective/web/oshercollective.com/public_html
            echo "=== plugins de comunidade no WordPress da osher ==="
            ls $WP/wp-content/plugins 2>/dev/null | grep -iE "buddy|bbpress|communit|peepso|youzify|forum|member|ultimate|circle|discord"
            DB=$(grep -oP "DB_NAME',\s*'\K[^']+" $WP/wp-config.php 2>/dev/null); PFX=$(grep -oP "table_prefix\s*=\s*'\K[^']+" $WP/wp-config.php 2>/dev/null)
            echo "bd: $DB prefixo: $PFX"
            S=""
            Q() { $S mysql -N -e "$1" 2>&1 | grep -v Deprecated | head -${2:-15}; }
            echo "--- qualquer tipo de conteúdo com community/comunidade no nome ou título (tipo, estado, slug, título) ---"
            Q "SELECT post_type,post_status,post_name,LEFT(post_title,60) FROM \`$DB\`.${PFX}posts WHERE post_type NOT IN ('revision','attachment') AND (post_name REGEXP 'communit|comunidad' OR post_title REGEXP 'ommunit|omunidad');"
            echo "--- itens de menu / conteúdos que ligam para community.oshercollective.com ou /community ---"
            Q "SELECT p.post_type,p.post_status,p.post_name,LEFT(p.post_title,50) FROM \`$DB\`.${PFX}posts p WHERE p.post_type NOT IN ('revision') AND p.post_content REGEXP 'community\\\\.oshercollective|oshercollective\\\\.com/communit';"
            Q "SELECT m.post_id,m.meta_key,LEFT(m.meta_value,120) FROM \`$DB\`.${PFX}postmeta m WHERE m.meta_value REGEXP 'community\\\\.oshercollective|/communit|/comunidad';"
            echo "--- nº de conteúdos que mencionam community/comunidade no texto, por tipo ---"
            Q "SELECT post_type,post_status,COUNT(*) FROM \`$DB\`.${PFX}posts WHERE post_type NOT IN ('revision') AND post_content REGEXP 'ommunity|omunidade' GROUP BY 1,2;"
            echo "--- títulos desses conteúdos ---"
            Q "SELECT post_type,post_status,post_name,LEFT(post_title,60) FROM \`$DB\`.${PFX}posts WHERE post_type IN ('page','post','elementor_library','wp_template','wp_block','wp_navigation') AND post_content REGEXP 'ommunity|omunidade';" 25
            echo "--- opções (wp_options) ---"
            Q "SELECT option_name,LEFT(option_value,100) FROM \`$DB\`.${PFX}options WHERE option_name REGEXP 'communit|comunidad|buddy|bbp|peepso' OR option_value REGEXP 'community\\\\.oshercollective';"
            echo "--- tipos de conteúdo existentes ---"
            Q "SELECT post_type,COUNT(*) FROM \`$DB\`.${PFX}posts GROUP BY 1 ORDER BY 2 DESC;" 30
            echo "--- plugins activos ---"
            Q "SELECT option_value FROM \`$DB\`.${PFX}options WHERE option_name='active_plugins';" 3
            echo "=== https://oshercollective.com/community (de dentro) ==="
            curl -skI --max-time 10 https://oshercollective.com/community/ 2>&1 | head -3
