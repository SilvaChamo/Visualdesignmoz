name: Deploy Visualdesign

# ============================================================================
# Este é o ÚNICO deploy do projecto: o site em produção é o do servidor actual e é
# publicado a cada push em `main` (o Hetzner foi desligado a 19/10/2026 e os
# seus workflows apagados; o `main` antigo, do Hetzner, está guardado em
# `arquivo/main-hetzner` — não usar).
#
# AVISO PARA QUALQUER AGENTE/PESSOA A MEXER AQUI: partes do site ainda estão em
# modo "sandbox" (MPESA_ENV abaixo) e por isso não funcionam como no mundo real.
# Antes de mudar isso para produção a sério, confirma sempre com o utilizador —
# envolve dinheiro real (cobranças M-Pesa reais a clientes).
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'Só ensaiar: constrói, envia e arranca a versão nova noutra porta para ver se responde, sem a pôr no ar'
        type: boolean
        default: false
  push:
    branches:
      - main

# uma publicação de cada vez: um push novo espera que a anterior acabe (duas
# publicações sobrepostas já estragaram o node_modules)
concurrency:
  group: deploy-visualdesign
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Visualdesign
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Deploy em ~5 minutos (Silva, 24/10/2026): o site constrói-se UMA vez, aqui no GitHub (2 a 3 minutos), e o .next vai para o
      # servidor, que já não o reconstrói (a prioridade mínima do servidor fazia o mesmo build demorar 8 a 9 minutos).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2234 "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Passo 1 do servidor: só escreve o ambiente (.env.local da versão em uso). O GitHub lê-o a seguir, para construir o site
      # com as mesmas variáveis (NEXT_PUBLIC_*) que o servidor sempre usou.
      - name: Prepare server environment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            # O site deixou de se chamar "teste" (Silva, 23/10/2026): a pasta em uso é /opt/visualdesignmoz (atalho para a versão em uso, em
            # /opt/visualdesign-releases) e a app do pm2 chama-se visualdesignmoz. Na primeira vez a pasta antiga passa a ser a primeira versão.
            mkdir -p /opt/visualdesign-releases
            if [ ! -e /opt/visualdesignmoz ] && [ -d /opt/visualdesign-site-teste ] && [ ! -L /opt/visualdesign-site-teste ]; then
              mv /opt/visualdesign-site-teste /opt/visualdesign-releases/inicial
              ln -s /opt/visualdesign-releases/inicial /opt/visualdesignmoz
            fi
            rm -rf /opt/visualdesign-site-teste-build
            cd /opt/visualdesignmoz
            touch .env.local
            set_env_var() {
              # grep -v + reescrever em vez de "sed -i s|...|...|" — um valor
              # secreto que contenha "|" (ex.: aconteceu com BREVO_API_KEY)
              # quebrava o delimitador do sed e fazia o deploy inteiro falhar.
              local key="$1" value="$2"
              grep -v "^${key}=" .env.local > .env.local.tmp || true
              mv .env.local.tmp .env.local
              echo "${key}=${value}" >> .env.local
            }
            # Activado a pedido do utilizador (2026-08-11) para ele próprio testar
            # uma compra/transferência de domínio a sério a partir deste site de
            # teste. Chaves de produção — partilha a mesma conta Dynadot da
            # instância de produção (Hetzner), por isso um domínio comprado aqui
            # é um domínio real, a sério, com custo real.
            #
            # REGRA DE SEGURANÇA: só o utilizador humano pode concluir uma compra
            # real a partir daqui (clicar "comprar" no site). Nenhum agente/sessão
            # Claude deve alguma vez chamar a API de registo de domínios
            # directamente (script, curl, teste automatizado) enquanto este
            # ambiente estiver em "production" — só leitura/consulta é permitida.
            set_env_var DYNADOT_ENV "production"
            set_env_var DYNADOT_API_KEY "${{ secrets.DYNADOT_API_KEY }}"
            set_env_var DYNADOT_SECRET_KEY "${{ secrets.DYNADOT_SECRET_KEY }}"
            set_env_var DYNADOT_SANDBOX_API_KEY "${{ secrets.DYNADOT_SANDBOX_API_KEY }}"
            set_env_var DYNADOT_SANDBOX_SECRET_KEY "${{ secrets.DYNADOT_SANDBOX_SECRET_KEY }}"
            set_env_var CRON_SECRET "${{ secrets.CRON_SECRET }}"
            set_env_var CLOUDFLARE_API_TOKEN_ACCOUNT "${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT }}"
            set_env_var CLOUDFLARE_ACCOUNT_ID "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            # Global API Key (14 ago 2026) — o token acima não conseguia criar
            # zonas novas na Cloudflare (permissão não encontrada na interface).
            # Usada em alternativa, confirmada ao vivo a funcionar; ver
            # src/lib/cloudflare-dns.ts.
            set_env_var CLOUDFLARE_EMAIL "${{ secrets.CLOUDFLARE_EMAIL }}"
            set_env_var CLOUDFLARE_GLOBAL_API_KEY "${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}"
            # Sem isto, o passo de DNS de e-mail e o remetente Brevo de
            # autoProvisionPurchasedDomain falham sempre em silêncio depois de
            # uma compra/transferência de domínio (nunca tinha sido ligado ao
            # deploy, só existia no .env.local local) — descoberto 19 ago via
            # o caso real do aamihe.com.
            set_env_var BREVO_API_KEY "${{ secrets.BREVO_API_KEY }}"
            # "Não sou um robô" do registo (Turnstile da Cloudflare, 14/10/2026): a chave secreta vem do segredo do GitHub
            # TURNSTILE_SECRET_KEY; vazia, o registo funciona sem verificar (src/lib/turnstile.ts)
            set_env_var TURNSTILE_SECRET_KEY "${{ secrets.TURNSTILE_SECRET_KEY }}"
            # Idem ao passo de build acima: secrets próprios do Contabo, nunca
            # os partilhados com o Hetzner.
            # Endereço do Supabase sem «contabo» (Silva, 28/10/2026); o nome antigo continua a responder no nginx.
            set_env_var NEXT_PUBLIC_SUPABASE_URL "https://supabase.visualdesignmoz.com"
            set_env_var NEXT_PUBLIC_SUPABASE_ANON_KEY "${{ secrets.SUPABASE_CONTABO_ANON_KEY }}"
            set_env_var SUPABASE_SERVICE_ROLE_KEY "${{ secrets.SUPABASE_CONTABO_SERVICE_ROLE_KEY }}"
            # Segredos antigos com que ainda há passwords cifradas (LEGACY_ENCRYPTION_SECRETS em da-credential-store.ts e
            # panel-access-credentials.ts), separados por vírgulas. Sem o secret fica vazio: essas passwords guardadas
            # deixam de se decifrar, mas o login continua a confirmar a password no próprio Hestia.
            set_env_var LEGACY_ENCRYPTION_SECRETS "${{ secrets.CONTABO_LEGACY_ENCRYPTION_SECRETS }}"
            # Endereço público do site: desde 13/10/2026 o Contabo é o site principal (pedido do Silva — o teste.
            # deixou de ser mostrado; os links de e-mails, recuperação de password e "aceder ao painel" usam este).
            set_env_var NEXT_PUBLIC_SITE_URL "https://visualdesignmoz.com"
            # Só para LEITURA (listar contas antigas do DirectAdmin no painel
            # admin) — sem isto a página "Contas" falhava sempre a mostrar as
            # contas antigas e ficava lenta/com erro. Suspender/apagar/mudar
            # password numa conta DirectAdmin a partir daqui ainda não está
            # configurado de propósito (precisa de acesso SSH próprio ao
            # servidor do Hetzner, decisão à parte).
            set_env_var DIRECTADMIN_HOST "${{ secrets.DIRECTADMIN_HOST }}"
            set_env_var DIRECTADMIN_PORT "${{ secrets.DIRECTADMIN_PORT }}"
            set_env_var DIRECTADMIN_PROTOCOL "${{ secrets.DIRECTADMIN_PROTOCOL }}"
            set_env_var DIRECTADMIN_USER "${{ secrets.DIRECTADMIN_USER }}"
            set_env_var DIRECTADMIN_PASSWORD "${{ secrets.DIRECTADMIN_PASSWORD }}"
            set_env_var DIRECTADMIN_LOGIN_KEY "${{ secrets.DIRECTADMIN_LOGIN_KEY }}"
            set_env_var STRIPE_SECRET_KEY "${{ secrets.STRIPE_SECRET_KEY }}"
            set_env_var STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            set_env_var NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"
            set_env_var HESTIA_HOST "${{ secrets.HESTIA_HOST }}"
            set_env_var HESTIA_USER "${{ secrets.HESTIA_USER }}"
            set_env_var HESTIA_PASSWORD "${{ secrets.HESTIA_PASSWORD }}"
            # Único sítio onde isto fica activo: contas novas passam a ir para o
            # Hestia a partir daqui. O Hetzner (produção) nunca recebe esta
            # variável, por isso continua 100% DirectAdmin sem qualquer mudança.
            set_env_var DEFAULT_HOSTING_PROVIDER "hestia"
            # Cópia NEXT_PUBLIC_ da variável acima — o valor server-only não
            # chega a componentes 'use client' (ex.: esconder botões que só
            # fazem sentido com DirectAdmin, como "Abrir no DirectAdmin").
            set_env_var NEXT_PUBLIC_DEFAULT_HOSTING_PROVIDER "hestia"
            # M-Pesa Sandbox — idem, só activo aqui. Em produção o método
            # "M-Pesa" continua manual (comprovativo + confirmação humana),
            # exactamente como está hoje.
            set_env_var MPESA_ENV "sandbox"
            set_env_var NEXT_PUBLIC_MPESA_ENV "sandbox"
            set_env_var MPESA_API_KEY "${{ secrets.MPESA_API_KEY }}"
            set_env_var MPESA_PUBLIC_KEY "${{ secrets.MPESA_PUBLIC_KEY }}"
            set_env_var MPESA_SERVICE_PROVIDER_CODE "${{ secrets.MPESA_SERVICE_PROVIDER_CODE }}"
            set_env_var MPESA_HOST "${{ secrets.MPESA_HOST }}"
            set_env_var MPESA_PORT "${{ secrets.MPESA_PORT }}"
            # SSH genérico (secção "Websites": listar/gerir WordPress via
            # wp-cli, ver src/lib/wp-cli-server.ts) — a app liga-se a si
            # própria por SSH para correr comandos no servidor onde já está,
            # tal como acontece no Hetzner. Reaproveita a mesma chave já usada
            # para o deploy, escrita agora num ficheiro estável no servidor.
            mkdir -p /root/.ssh
            if [ -f /root/.ssh/vd_app_key ]; then
              # Chave PRÓPRIA da aplicação (Silva, 28/10/2026): distinta da chave do deploy e só aceite a partir deste servidor
              # (workflow «Ops - Fecho do servidor», fase chave-app). A chave do deploy deixa de ser gravada no disco.
              set_env_var SERVER_SSH_KEY_PATH "/root/.ssh/vd_app_key"
            else
              echo "${{ secrets.CONTABO_SSH_KEY }}" > /root/.ssh/app_self_key
              chmod 600 /root/.ssh/app_self_key
              set_env_var SERVER_SSH_KEY_PATH "/root/.ssh/app_self_key"
            fi
            set_env_var SERVER_IP "${{ secrets.CONTABO_HOST }}"
            set_env_var SERVER_SSH_USER "root"
            set_env_var SERVER_SSH_PORT "2234"
            # SERVER_IP (acima) é só para SSH interno (imap-host.ts,
            # ssh-connect-options.ts). getServerHost() (usado para apontar DNS
            # de sites novos e URLs de webmail) lê NEXT_PUBLIC_SERVER_IP, que
            # nunca tinha sido definido aqui — caía sempre no valor por
            # omissão (IP antigo do Hetzner). Confirmado ao vivo 1 set: o
            # site novo entrecamposblog.com ficou sem DNS por causa disto.
            set_env_var NEXT_PUBLIC_SERVER_IP "${{ secrets.CONTABO_HOST }}"
            # Par de nameservers que se dá aos clientes (Hestia do Contabo). ns1 a ns4 são todos deste servidor
            # (ver visualdesign-dns.ts); um domínio deve usar sempre o mesmo par.
            set_env_var NEXT_PUBLIC_VD_NAMESERVERS "ns3.visualdesignmoz.com,ns4.visualdesignmoz.com"
            # Painel VisualHost (/vhost): alterações às contas do servidor ligadas para todas as contas (aprovado pelo Silva, 10/10/2026)
            set_env_var VHOST_ACOES_TODAS "1"
            # Renovações (Silva, 24/10/2026): avisos desde os 3 meses e, passado o último dia, suspensão do serviço (reversível: o pagamento da
            # renovação reactiva). Com travões: só o que expirou há 30 dias ou menos, no máximo 5 por dia, nunca o basededadosagro.com nem o
            # visualdesignmoz.com (RENOVACOES_NUNCA_SUSPENDER) e o admin é avisado. Ver src/lib/overdue-hosting-suspend.ts.
            set_env_var RENOVACOES_SUSPENDER_ATRASADOS "1"

      - name: Read server environment
        run: |
          # as mesmas variáveis com que o servidor sempre construiu (NEXT_PUBLIC_* ficam dentro do código do site)
          scp -P 2234 -i ~/.ssh/deploy_key "root@${{ secrets.CONTABO_HOST }}:/opt/visualdesignmoz/.env.local" .env.production.local
          test -s .env.production.local
          # nada do que vem do servidor aparece nos registos (só valores longos e não públicos: máscaras curtas estragavam o texto)
          while IFS= read -r linha; do
            chave="${linha%%=*}"; valor="${linha#*=}"
            case "$chave" in NEXT_PUBLIC_*|'') continue ;; esac
            if [ ${#valor} -ge 12 ]; then echo "::add-mask::${valor}"; fi
          done < .env.production.local

      - name: Build project
        env:
          # 4 GB para o build (com o limite por defeito do Node o build já esgotou a memória, a 16/10/2026)
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.visualdesignmoz.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_CONTABO_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_CONTABO_SERVICE_ROLE_KEY }}
        run: npm run build

      # O código novo vai para uma pasta à parte (…-build), não para a do site em funcionamento: o site continua a
      # servir a versão anterior enquanto a nova é instalada (ver "Publicar sem ecrã branco" mais abaixo).
      - name: Enviar os ficheiros para o servidor
        run: |
          rsync -avz --delete \
            -e "ssh -p 2234 -i ~/.ssh/deploy_key" \
            --exclude 'node_modules' --exclude '.next/cache' --exclude '.git' --exclude '*.env*' --exclude '.DS_Store' \
            ./ "root@${{ secrets.CONTABO_HOST }}:/opt/visualdesignmoz-build/"

      # Passo 2 do servidor: já não constrói nada (o .next vem do GitHub); instala as dependências se for preciso e troca de versão
      - name: Instalar e pôr no ar no servidor
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          # Desde 30 ago este site tem base de dados própria (Supabase no
          # Contabo, separada do Hetzner) — deixou de fazer sentido a regra
          # antiga de "zero crons para não duplicar efeitos reais na BD
          # partilhada". Tem os seus próprios crons de domínio (dns-retry,
          # brevo-retry, mais abaixo), o sync do Hestia e a fila de
          # mailmarketing e o aviso das renovações (renewal-check). O da-sync ficou no Hetzner.
          command_timeout: 30m
          script: |
            set -e
            ENSAIO="${{ inputs.ensaio && '1' || '0' }}"
            # O projecto pede Node 24 (package.json "engines"); com o Node do
            # sistema o build falhava. Instala o Node oficial (com verificação
            # do checksum) só se ainda não existir. Vem do commit 8dc91244.
            NODE_VERSION="24.18.0"
            NODE_ROOT="/opt/node-v${NODE_VERSION}"
            NODE_ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
            if [ ! -x "${NODE_ROOT}/bin/node" ]; then
              NODE_CHECKSUM="$(curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" | awk -v file="${NODE_ARCHIVE}" '$2 == file { print $1 }')"
              if [ -z "$NODE_CHECKSUM" ]; then
                echo "Could not find the official Node.js checksum for ${NODE_ARCHIVE}"
                exit 1
              fi
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}" -o "/tmp/${NODE_ARCHIVE}"
              echo "${NODE_CHECKSUM}  /tmp/${NODE_ARCHIVE}" | sha256sum -c -
              mkdir -p "${NODE_ROOT}"
              tar -xJf "/tmp/${NODE_ARCHIVE}" --strip-components=1 -C "${NODE_ROOT}"
              rm "/tmp/${NODE_ARCHIVE}"
            fi
            export PATH="${NODE_ROOT}/bin:$PATH"
            node --version
            npm --version
            # Publicar sem ecrã branco (pedido do Silva, 13/10/2026): antes, o "npm ci" e o "rm -rf .next" + build corriam
            # na pasta do site em funcionamento, e durante os ~10 min do build o site ficava sem ficheiros (ecrã
            # branco). Agora instala-se na pasta à parte (STAGE, onde o rsync acima pôs o código novo, já construído no GitHub)
            # com o site a servir a versão anterior; no fim troca-se em segundos. Se o build falhar (set -e), o site
            # fica como estava.
            LIVE=/opt/visualdesignmoz
            STAGE=/opt/visualdesignmoz-build
            # as variáveis (.env.local, escrito acima na pasta do site) entram no build (NEXT_PUBLIC_*)
            for f in "$LIVE"/.env*; do if [ -f "$f" ]; then cp -a "$f" "$STAGE"/; fi; done
            cd "$STAGE"
            # Prioridade mínima de CPU e de disco para a instalação e o build: o site em funcionamento (e o resto do
            # servidor) passa sempre à frente. Antes o build levava os 6 núcleos e o site ficava parado/bloqueado
            # durante cada publicação, e o watchdog (curl de 20 s) chegava a reiniciá-lo a meio (Silva, 15/10/2026).
            BAIXA="nice -n 19 ionice -c3"
            # node_modules: se o package-lock.json e o Node são os mesmos da versão em uso, reaproveita-se o dela (cópia por
            # ligações duras, segundos) em vez de reinstalar tudo (~3 min). A assinatura fica dentro do node_modules; sem ela
            # (primeira publicação depois desta alteração), ou se a cópia falhar, instala-se como sempre.
            ASSINATURA="$(sha256sum package-lock.json | cut -d' ' -f1)-$(node --version)"
            REAPROVEITADO=0
            if [ -f "$LIVE/node_modules/.vd-assinatura" ] && [ "$(cat "$LIVE/node_modules/.vd-assinatura")" = "$ASSINATURA" ]; then
              rm -rf node_modules
              if cp -al "$LIVE/node_modules" node_modules; then
                REAPROVEITADO=1
                echo "package-lock.json e Node iguais aos da versão em uso: node_modules reaproveitado."
              else
                rm -rf node_modules
              fi
            fi
            if [ "$REAPROVEITADO" = 0 ]; then
              $BAIXA npm ci --no-audit --no-fund
              echo "$ASSINATURA" > node_modules/.vd-assinatura
            fi
            # O .next já vem construído do GitHub (passo "Build project"; o rsync não leva a cache): aqui não se constrói nada.
            # Sem ele, a publicação falha antes de mexer no site.
            test -f "$STAGE/.next/BUILD_ID" || { echo "O .next não chegou ao servidor." >&2; exit 1; }
            # Os deploys não limpam nada (Silva, 31/10/2026: «os deploys não limpem a cache e quem está dentro não pode notar nem a página parar de
            # funcionar»). O que a versão em uso já tem passa para a nova, sem apagar nem substituir nada do que a nova trouxe:
            #  - `.next/static`: um separador aberto na versão anterior continua a achar os pedaços de código que ainda não tinha carregado, e o HTML que a
            #    CDN ou o navegador guardaram continua a apontar para ficheiros que existem (os pedaços novos têm nomes novos). Saem os de há mais de 30 dias;
            #  - `.next/cache`: imagens optimizadas e pedidos guardados do Next (o rsync não os leva e cada publicação começava com tudo vazio).
            # Corre antes do ensaio, para o ensaio o exercitar de verdade. Se falhar só avisa: nunca impede a publicação.
            ATUAL="$(readlink -f "$LIVE" 2>/dev/null || echo "$LIVE")"
            if [ -d "$ATUAL/.next/static" ] && [ -d "$STAGE/.next/static" ]; then
              $BAIXA rsync -a --ignore-existing "$ATUAL/.next/static/" "$STAGE/.next/static/" || echo "AVISO: não consegui juntar os ficheiros estáticos da versão em uso."
              find "$STAGE/.next/static" -type f -mtime +30 -delete 2>/dev/null || true
              echo "Ficheiros estáticos: $(find "$STAGE/.next/static" -type f | wc -l) (a versão em uso tinha $(find "$ATUAL/.next/static" -type f | wc -l))."
            fi
            if [ -d "$ATUAL/.next/cache" ]; then
              mkdir -p "$STAGE/.next/cache"
              $BAIXA rsync -a --ignore-existing "$ATUAL/.next/cache/" "$STAGE/.next/cache/" || echo "AVISO: não consegui levar a cache do Next da versão em uso."
              echo "Cache do Next levada: $(du -sh "$STAGE/.next/cache" 2>/dev/null | cut -f1)."
            fi
            # Ensaio (execução manual com ensaio=true): arranca a versão nova noutra porta (3099), confirma que responde e
            # termina — sem migrações, sem mexer no pm2 nem no atalho: o site em funcionamento não é tocado.
            if [ "$ENSAIO" = "1" ]; then
              echo "ENSAIO: a arrancar a versão nova na porta 3099 (o site em funcionamento não é tocado)."
              ( cd "$STAGE" && exec nice -n 10 "${NODE_ROOT}/bin/node" node_modules/next/dist/bin/next start -p 3099 > /tmp/vd-ensaio.log 2>&1 ) &
              ENSAIO_PID=$!
              ENSAIO_OK=1
              for i in $(seq 1 45); do
                c=$(curl -s -o /dev/null -w '%{http_code}' -m 10 -H "Host: teste.visualdesignmoz.com" http://127.0.0.1:3099/ || true)
                case "$c" in 2*|3*) ENSAIO_OK=0; break ;; esac
                sleep 2
              done
              # a validade que a versão nova dá às páginas públicas (só mostra; 5 minutos = «s-maxage=300»)
              for pg in / /precos /sobre-nos; do
                echo "ensaio ${pg}: $(curl -s -D - -o /dev/null -m 20 -H "Host: teste.visualdesignmoz.com" "http://127.0.0.1:3099${pg}" | tr -d '\r' | grep -iE '^(HTTP|cache-control)' | paste -sd' ' || true)"
              done
              kill "$ENSAIO_PID" 2>/dev/null || true
              sleep 2
              kill -9 "$ENSAIO_PID" 2>/dev/null || true
              if [ "$ENSAIO_OK" != 0 ]; then echo "ENSAIO FALHOU: a versão nova não respondeu na porta 3099." >&2; tail -n 40 /tmp/vd-ensaio.log >&2 || true; exit 1; fi
              echo "ENSAIO OK: a versão nova respondeu (código ${c}). Nada foi publicado."
              rm -rf "$STAGE"; mkdir -p "$STAGE"
              exit 0
            fi
            # Garante que o histórico de actividade existe antes de activar o código que o grava.
            DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$DB_CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            DB_USER=$(docker exec "$DB_CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$DB_CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)
            docker exec -i "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 < "$STAGE/supabase-vhost-activity-history.sql"
            # Pedidos de compra de quem ainda não tem conta (o login só nasce quando a equipa aprova o comprovativo).
            docker exec -i "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 < "$STAGE/supabase-checkout-sessions-sem-conta.sql"
            docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
            HISTORY_TABLE=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -t -c "SELECT to_regclass('public.vhost_activity_history');" | tr -d '[:space:]')
            if [ "$HISTORY_TABLE" != "vhost_activity_history" ]; then
              echo "A tabela public.vhost_activity_history não ficou disponível após a migração." >&2
              exit 1
            fi
            # Um processo antigo (visualdesign-panel em /opt/visualdesign-panel)
            # ficava a escutar a 3002. O restart desta app falhava com
            # EADDRINUSE, o GitHub Actions marcava sucesso, e o site público
            # continuava a servir o código velho — abas de domínios vazias.
            pm2 delete visualdesign-panel || true
            # Publicar SEM corte (Silva, 23/10/2026): cada publicação é uma pasta própria em /opt/visualdesign-releases/<data> e
            # /opt/visualdesignmoz passa a ser um atalho (symlink) para a versão em uso. O site corre em pm2 "cluster"
            # com 1 processo: o `pm2 reload` põe a versão nova a escutar na porta 3002 ANTES de a antiga sair, por isso não há um
            # único pedido falhado (testado com 600 pedidos seguidos durante a troca). A versão anterior fica na pasta dela para
            # a reversão automática se a nova não responder.
            NAME=visualdesignmoz
            RELEASES=/opt/visualdesign-releases
            mkdir -p "$RELEASES"
            NOVA="$RELEASES/$(date +%Y%m%d-%H%M%S)"
            # a pasta construída passa a ser a versão nova (mv no mesmo disco: instantâneo); a do build fica vazia para a próxima publicação
            mv "$STAGE" "$NOVA"
            mkdir -p "$STAGE"
            # só na primeira vez: a pasta antiga do site passa a ser a primeira versão guardada e o seu caminho passa a ser o atalho
            if [ ! -L "$LIVE" ]; then
              mv "$LIVE" "$RELEASES/inicial"
              ln -s "$RELEASES/inicial" "$LIVE"
            fi
            ANTERIOR="$(readlink "$LIVE")"
            troca_atalho() { ln -sfn "$1" "$LIVE.novo" && mv -T "$LIVE.novo" "$LIVE"; }
            troca_atalho "$NOVA"
            # Um processo antigo (visualdesign-panel em /opt/visualdesign-panel) ficava a escutar a 3002 e o restart desta app
            # falhava com EADDRINUSE (o GitHub Actions marcava sucesso e o site continuava com o código velho).
            pm2 delete visualdesign-panel || true
            if pm2 describe "$NAME" 2>/dev/null | grep -q cluster_mode; then
              # o caso normal: troca sem corte
              pm2 reload "$NAME" --update-env
            else
              # só na primeira vez (o site estava em modo "fork"): passa a cluster. No modo cluster o pm2 usa o Node com que o seu
              # daemon arrancou; garante que é o Node 24 deste servidor (senão reinicia o daemon, que volta a pôr as apps no ar)
              pm2 delete "$NAME" || true
              pm2 delete visualdesign-site-teste || true
              pm2 save --force
              DAEMON_NODE="$(readlink "/proc/$(cat /root/.pm2/pm2.pid 2>/dev/null || echo 0)/exe" 2>/dev/null || true)"
              if [ "$DAEMON_NODE" != "${NODE_ROOT}/bin/node" ]; then pm2 update || true; fi
              sleep 1
              fuser -k 3002/tcp || true
              pm2 start "$LIVE/node_modules/next/dist/bin/next" --name "$NAME" -i 1 --cwd "$LIVE" --listen-timeout 30000 -- start -p 3002
            fi
            pm2 save
            # a versão nova tem de responder; se não, volta-se à anterior e a publicação falha (o site fica como estava)
            saude() {
              local c i
              for i in $(seq 1 30); do
                c=$(curl -s -o /dev/null -w '%{http_code}' -m 10 -H "Host: teste.visualdesignmoz.com" http://127.0.0.1:3002/ || true)
                case "$c" in 2*|3*) return 0 ;; esac
                sleep 2
              done
              return 1
            }
            if ! saude; then
              echo "A versão nova não respondeu: a voltar à anterior (${ANTERIOR})." >&2
              troca_atalho "$ANTERIOR"
              pm2 reload "$NAME" --update-env || true
              exit 1
            fi
            # guarda as 3 versões mais recentes (a nova, a anterior e mais uma); as outras apagam-se
            ls -1dt "$RELEASES"/*/ | tail -n +4 | while read -r antiga; do
              antiga="${antiga%/}"
              if [ "$antiga" != "$NOVA" ] && [ "$antiga" != "$ANTERIOR" ]; then rm -rf "$antiga"; fi
            done
            cd "$LIVE"
            # PHP por conta (Silva, 23/10/2026): o script que dá a cada conta o seu PHP-FPM com as suas extensões, e o cron que o mantém em ordem
            # (só age em contas que já escolheram extensões; sem nenhuma, não faz nada)
            install -m 0755 "$LIVE/deploy/php-conta/vd-php-conta" /usr/local/sbin/vd-php-conta || echo "AVISO: vd-php-conta não instalado"
            printf '*/5 * * * * root /usr/local/sbin/vd-php-conta sincronizar >/dev/null 2>&1\n' > /etc/cron.d/vd-php-conta
            chmod 644 /etc/cron.d/vd-php-conta
            # Reinicia o site sozinho se deixar de responder (commit 373a3863).
            bash scripts/install-site-watchdog.sh

            # Desde que este site passou a ter base de dados própria (separada do
            # Hetzner, 30 ago), as compras de domínio feitas aqui deixaram de ser
            # reprocessadas por engano nenhuma — o cron do Hetzner só vê a base de
            # dados dele. Sem estes dois, um domínio comprado aqui cujo DNS/Cloudflare
            # tenha falhado a meio, ou cuja autenticação na Brevo ainda não tenha sido
            # confirmada, ficava para sempre à espera de alguém reparar manualmente.
            # NOTA: 'src/proxy.ts' redirecciona (308) qualquer pedido feito a
            # 127.0.0.1 para 'localhost' (para cookies/PKCE ficarem consistentes
            # no browser) — sem o cabeçalho Host correcto abaixo, estes curls
            # nunca chegam a executar a lógica, só recebem o redirect e o cron
            # parece "correr" mas não faz nada. Confirmado ao vivo em 1 set.
            CRON_SECRET_VALUE=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2-)
            (crontab -l 2>/dev/null | grep -v '# visualdesign-dns-retry'; \
              echo "*/30 * * * * curl -fsS -H \"Host: teste.visualdesignmoz.com\" -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3002/api/cron/dns-retry >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-dns-retry") | crontab -
            (crontab -l 2>/dev/null | grep -v '# visualdesign-brevo-retry'; \
              echo "*/30 * * * * curl -fsS -H \"Host: teste.visualdesignmoz.com\" -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3002/api/cron/brevo-retry >> /var/log/visualdesign-cron.log 2>&1 # visualdesign-brevo-retry") | crontab -
            # Renovações (Silva, 24/10/2026): avisos aos clientes antes de expirarem os domínios e a hospedagem, todos os dias às 08:00 (hora do
            # servidor, Moçambique). Estava só no Hetzner e deixou de correr quando ele fechou. Só avisa: suspender contas em atraso fica
            # desligado até o Silva ligar RENOVACOES_SUSPENDER_ATRASADOS=1 (ver src/app/api/cron/renewal-check/route.ts).
            (crontab -l 2>/dev/null | grep -v '# visualdesign-renewal-check'; \
              echo "0 8 * * * curl -fsS -H \"Host: teste.visualdesignmoz.com\" -H \"Authorization: Bearer ${CRON_SECRET_VALUE}\" http://127.0.0.1:3002/api/cron/renewal-check >> /var/log/visualdesign-renewal-check.log 2>&1 # visualdesign-renewal-check") | crontab -

            # Reflecte o estado real do Hestia (contas/domínios/suspensões) de volta
            # para o espelho Supabase — sem isto, mudanças feitas directamente no
            # painel Hestia nunca apareciam no painel VisualDesign. Script próprio
            # (scripts/instalar-cron-servidor.sh) em vez de shell inline aqui: a versão
            # inline anterior falhava silenciosamente dentro do ssh-action de forma
            # não reproduzível por SSH directo (ver histórico do ficheiro) — mesmo
            # depois de reescrita, voltou a falhar aqui dentro sem falhar à mão.
            bash scripts/instalar-cron-servidor.sh
            bash scripts/install-mailmarketing-cron.sh
            bash scripts/install-backup-schedule-cron.sh
            # avisos de força bruta nas Mensagens dos administradores (como o DirectAdmin fazia no Hetzner)
            bash scripts/install-forca-bruta-cron.sh

      # Os outros sites do servidor (Silva, 24/10/2026): o deploy só mexe no visualdesignmoz, mas em 23/10 um `pm2 update` deixou o
      # basededadosagro.com (projecto de defesa do Silva) em 502 durante 33 horas sem ninguém reparar. Se um destes sites não
      # responder, a publicação falha (e o GitHub avisa), em vez de ninguém dar por isso.
      - name: Verificar os outros sites do servidor
        run: |
          falhou=0
          for u in https://basededadosagro.com https://visualdesignmoz.com; do
            ok=0
            for i in 1 2 3 4 5 6; do
              c=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$u" || true)
              case "$c" in 2*|3*) ok=1; break ;; esac
              sleep 5
            done
            if [ "$ok" = 1 ]; then echo "$u -> $c"; else echo "ATENÇÃO: $u não responde (código $c)"; falhou=1; fi
          done
          [ "$falhou" = 0 ]

      # Cloudflare (Silva, 31/10/2026: «os deploys não limpem a cache»): as páginas públicas do Next.js agora têm validade de 5 minutos
      # (`revalidate` em src/app/layout.tsx) e as versões anteriores mantêm os seus ficheiros em `_next/static`, por isso nada precisa de ser limpo
      # em cada publicação. Só falta uma limpeza ÚNICA, na primeira publicação depois desta mudança: as páginas que a CDN já tinha guardadas
      # trazem a validade antiga (1 ano). O ficheiro-marca impede que volte a limpar nas seguintes. Corre por último: se falhar a publicação fica a
      # vermelho e avisa, mas o site já está no ar (e a limpeza repete-se na publicação seguinte, por não haver marca).
      - name: Limpar a cache da CDN uma única vez (passagem para páginas de validade curta)
        if: ${{ !inputs.ensaio }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          port: 2234
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            MARCA=/opt/visualdesign-releases/.cdn-validade-curta
            if [ -f "$MARCA" ]; then echo "Já feito: os deploys não limpam a cache da CDN."; exit 0; fi
            bash /opt/visualdesignmoz/scripts/limpar-cache-cdn.sh visualdesignmoz.com && touch "$MARCA"
