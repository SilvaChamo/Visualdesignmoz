name: "Ops - Contabo: diagnóstico de host.visualdesignmoz.com e da porta 2026 (SÓ LEITURA)"

# ============================================================================
# SÓ LEITURA (13/10/2026, pedido do Silva): antes de pôr o painel em
# https://host.visualdesignmoz.com:2026/ (o endereço do DirectAdmin no Hetzner),
# ver como o teste. e o host. estão no nginx/Hestia, que certificados há, o que
# escuta na 2026 e se a firewall a deixa passar. Nada é alterado; sem segredos.
# Corre só quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.
# ============================================================================

on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-contabo-host2026.yml']

jobs:
  contabo:
    name: contabo (só leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 10m
          script: |
            set +e
            H=/usr/local/hestia/bin
            campo() { echo "$1" | grep -oP "\b$2='\K[^']*"; }
            echo "===== Hestia: domínios web ====="
            for d in teste.visualdesignmoz.com host.visualdesignmoz.com visualdesignmoz.com; do
              f=$(grep -l "DOMAIN='$d'" /usr/local/hestia/data/users/*/web.conf | head -1)
              l=$(grep "DOMAIN='$d'" "$f")
              echo "  $d: dono=$(basename "$(dirname "$f")") alias='$(campo "$l" ALIAS)' tpl=$(campo "$l" TPL) proxy=$(campo "$l" PROXY) ext='$(campo "$l" PROXY_EXT)' ssl=$(campo "$l" SSL) le=$(campo "$l" LETSENCRYPT) docroot='$(campo "$l" CUSTOM_DOCROOT)'"
            done
            echo
            echo "===== nginx -v / o que escuta ====="
            nginx -v 2>&1
            ss -tlnp | grep -E ':(2026|2027|2222|3002|443|80)\b' | awk '{print "  " $4 " " $6}'
            echo
            for d in teste.visualdesignmoz.com host.visualdesignmoz.com; do
              echo "===== nginx de $d (ficheiros) ====="
              ls -la /home/vdadmin/conf/web/$d/ 2>&1 | sed 's/^/  /'
              for c in /home/vdadmin/conf/web/$d/nginx.ssl.conf /home/vdadmin/conf/web/$d/nginx.conf; do
                echo "  ---- $c"
                sed -e 's/^/    /' "$c" 2>/dev/null | head -80
              done
              echo "  ---- extras (nginx.*conf_*)"
              for c in /home/vdadmin/conf/web/$d/nginx*.conf_*; do [ -f "$c" ] && { echo "    # $c"; sed -e 's/^/    /' "$c" | head -40; }; done
              echo "  ---- certificado"
              for c in /home/vdadmin/conf/web/$d/ssl/$d.crt /home/vdadmin/conf/web/$d/ssl/$d.pem; do
                [ -f "$c" ] && echo "    $c: $(openssl x509 -in "$c" -noout -enddate -ext subjectAltName 2>/dev/null | tr '\n' ' ')"
              done
            done
            echo
            echo "===== firewall do Hestia ====="
            $H/v-list-firewall plain 2>/dev/null | awk '{print "  " $0}' | head -40
            echo
            echo "===== respostas públicas ====="
            for u in https://host.visualdesignmoz.com/ https://host.visualdesignmoz.com/vhost https://host.visualdesignmoz.com:2026/ https://teste.visualdesignmoz.com/vhost; do
              echo -n "  $u -> "; curl -s -o /tmp/r.html -w "%{http_code} %{redirect_url}" --max-time 20 "$u"; echo " | $(grep -o '<title>[^<]*' /tmp/r.html | head -1)"
            done
