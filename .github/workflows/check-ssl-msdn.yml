name: "Verificar SSL de msdn-moz.com (só leitura)"

# Só lê de fora (DNS, certificado e resposta HTTP/HTTPS); não entra no servidor nem usa segredos.
# Corre quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/check-ssl-msdn.yml']
  workflow_dispatch:

jobs:
  ssl:
    runs-on: ubuntu-latest
    steps:
      - name: DNS, certificado e respostas
        run: |
          set +e
          echo "===== registo e servidores de nomes ====="
          dig +short NS msdn-moz.com; dig +short SOA msdn-moz.com
          dig NS msdn-moz.com @a.gtld-servers.net +norec | grep -E "status|IN\s+NS" | head -5
          sudo apt-get -qq install -y whois >/dev/null 2>&1; whois msdn-moz.com | grep -iE "Domain Name|Registrar:|Name Server|Status|Expir|No match" | head -15
          for d in msdn-moz.com www.msdn-moz.com; do
            echo "===== $d ====="
            echo "A: $(dig +short $d A | tr '\n' ' ')  AAAA: $(dig +short $d AAAA | tr '\n' ' ')"
            echo | timeout 20 openssl s_client -connect $d:443 -servername $d 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
            echo | timeout 20 openssl s_client -connect $d:443 -servername $d 2>&1 | grep -E "Verify return code" | head -1
            curl -sS -o /dev/null -w "https: %{http_code} -> %{redirect_url}\n" --max-time 20 https://$d/
            curl -sS -o /dev/null -w "http:  %{http_code} -> %{redirect_url}\n" --max-time 20 http://$d/
            curl -sS --max-time 20 https://$d/ | grep -o -i "<title>[^<]*</title>" | head -1
          done
