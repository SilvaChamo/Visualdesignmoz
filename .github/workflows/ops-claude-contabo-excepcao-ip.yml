name: "Ops - Contabo: excepção em memória para a rede móvel do Silva (41.220.200.0/23) enquanto trabalhamos"

# ============================================================================
# 13/10/2026 (pedido do Silva: "desactivar isso por agora enquanto trabalhamos"):
# a 1.ª corrida desbloqueou 14 IPs de Moçambique (todos em 41.220.200.0–41.220.201.255, a rede móvel dele, que
# muda de IP a cada ligação) e pô-los como excepção. Como o IP muda, a excepção passa a ser a rede inteira
# 41.220.200.0/23 — em todos os bloqueios menos SSH e FTP (esses continuam a proteger o servidor).
# Só em memória: deixa de valer quando o fail2ban reiniciar — nada fica escrito na configuração.
# Os outros ~60 IPs de atacantes continuam bloqueados.
# Não imprime segredos. Corre só quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.
# ============================================================================

on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-contabo-excepcao-ip.yml']

jobs:
  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Excepção para a rede
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set +e
            H=/usr/local/hestia/bin
            REDE=41.220.200.0/23
            JAILS=$(fail2ban-client status 2>/dev/null | sed -n 's/.*Jail list:[[:space:]]*//p' | tr ',' ' ')
            for j in $JAILS; do
              case "$j" in ssh*|vsftpd*) echo "  $j: fica igual (protege o servidor)"; continue;; esac
              fail2ban-client set "$j" addignoreip "$REDE" >/dev/null 2>&1 && echo "  $j: excepção $REDE"
            done
            echo "===== bloqueios ainda activos nessa rede ====="
            for l in $($H/v-list-firewall-ban plain 2>/dev/null | awk '$1 ~ /^41\.220\.20[01]\./ {print $1 ":" $2}'); do
              ip=${l%%:*}; c=${l##*:}
              $H/v-delete-firewall-ban "$ip" "$c" >/dev/null 2>&1; fail2ban-client unban "$ip" >/dev/null 2>&1
              echo "  $ip ($c) -> desbloqueado"
            done
            echo -n "  restantes na rede: "; $H/v-list-firewall-ban plain 2>/dev/null | awk '$1 ~ /^41\.220\.20[01]\./' | wc -l
            echo -n "  total de IPs bloqueados (atacantes): "; $H/v-list-firewall-ban plain 2>/dev/null | wc -l
