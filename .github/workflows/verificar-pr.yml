name: Verificar PR

# Corre em cada pedido de junção a `main`, antes de se publicar (o deploy corre a cada merge e vai direito à produção):
# tipos (tsc), lint (erros), testes, build e traduções do site e do painel (0 textos sem inglês). Não toca no servidor nem usa segredos.
# Pedido do Silva a 27/10/2026 (auditoria de fecho, ponto 5 de «Configuração geral e qualidade»).

on:
  pull_request:
    branches:
      - main

concurrency:
  group: verificar-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos e traduções
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tipos (tsc)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (só os erros; os avisos não travam)
        run: npm run lint -- --quiet

      - name: Testes
        run: npm test

      - name: Traduções do site (0 textos sem inglês)
        run: npm run i18n

      - name: Traduções do painel (0 textos sem inglês)
        run: npm run i18n:painel

      - name: Construir o site (como no deploy, com endereços de mentira)
        env:
          NEXT_PUBLIC_SITE_URL: https://visualdesignmoz.com
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.exemplo.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-teste
          SUPABASE_SERVICE_ROLE_KEY: chave-de-teste
        run: npm run build
