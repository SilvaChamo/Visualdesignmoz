name: "Ops - Contas e planos no Contabo (SÓ LEITURA, 17/10/2026)"
# Pedido do Silva (17/10/2026): aamihe e mltmark no plano VD-Básico, Concordia e provisualcorporate no plano de e-mail.
# Antes de mudar alguma coisa, ver como estão: contas do Hestia, pacote, sites, domínios e contas de e-mail, e os pacotes
# que existem. Só lê, não muda nada. Corre uma vez neste ramo de trabalho e sai a seguir. O repositório é público:
# palavras-passe e chaves nunca aparecem (os comandos v-list-* não as mostram).
# 3.ª leitura: se os sites de concordia e provisualcorporate são servidos daqui. 2.ª leitura: DNS e resposta pública dos quatro sites, pastas dos sites, bases de dados do mltmark.
on:
  push:
    branches: [claude/tender-johnson-wzert9]
    paths: [.github/workflows/ops-contas-planos-leitura.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          script: |
            set +e
            H=/usr/local/hestia/bin
            echo "=== 3.ª leitura: os sites de concordia e provisualcorporate são servidos daqui? ==="
            for x in concordia:concordia.co.mz provisualcorporate:provisualcorporate.co.mz; do
              u=${x%%:*}; d=${x#*:}
              echo "--- $d"
              echo "  ficheiro no servidor: $(md5sum /home/$u/web/$d/public_html/index.html | cut -c1-12)"
              echo "  página pública:       $(curl -s -m 15 https://$d/ | md5sum | cut -c1-12) (tamanho $(curl -s -m 15 https://$d/ | wc -c))"
              echo "  www pública:          $(curl -s -m 15 -L https://www.$d/ | md5sum | cut -c1-12) (tamanho $(curl -s -m 15 -L https://www.$d/ | wc -c))"
              echo "  título público: $(curl -s -m 15 -L https://$d/ | grep -o '<title>[^<]*' | head -1)"
              echo "  título local:   $(grep -o '<title>[^<]*' /home/$u/web/$d/public_html/index.html | head -1)"
              echo "  pedidos de fora nos últimos registos do nginx: $(tail -n 2000 /var/log/nginx/domains/$d.log 2>/dev/null | grep -vc '127.0.0.1')"
              tail -n 3 /var/log/nginx/domains/$d.log 2>/dev/null | cut -c1-160
            done
            echo "=== fim ==="
