name: "Ops - Contas e planos no Contabo (SÓ LEITURA, 17/10/2026)"
# Pedido do Silva (17/10/2026): aamihe e mltmark no plano VD-Básico, Concordia e provisualcorporate no plano de e-mail.
# Antes de mudar alguma coisa, ver como estão: contas do Hestia, pacote, sites, domínios e contas de e-mail, e os pacotes
# que existem. Só lê, não muda nada. Corre uma vez neste ramo de trabalho e sai a seguir. O repositório é público:
# palavras-passe e chaves nunca aparecem (os comandos v-list-* não as mostram).
# 2.ª leitura: DNS e resposta pública dos quatro sites, pastas dos sites, bases de dados do mltmark.
on:
  push:
    branches: [claude/tender-johnson-wzert9]
    paths: [.github/workflows/ops-contas-planos-leitura.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          script: |
            set +e
            H=/usr/local/hestia/bin
            echo "=== 2.ª leitura: onde está cada site e se o pacote pode mudar ==="
            head -20 $H/v-change-user-package | grep -iE "options|force|usage|info"
            grep -n "FORCE\|force" $H/v-change-user-package | head
            cat /usr/local/hestia/conf/hestia.conf 2>/dev/null | grep -E "^VERSION" 
            for d in aamihe.com mltmark.com concordia.co.mz provisualcorporate.co.mz; do
              echo "--- $d"
              echo "  NS: $(dig +short NS $d @1.1.1.1 | tr '\n' ' ')"
              echo "  A:  $(dig +short A $d @1.1.1.1 | tr '\n' ' ')  www: $(dig +short A www.$d @1.1.1.1 | tr '\n' ' ')"
              echo "  MX: $(dig +short MX $d @1.1.1.1 | tr '\n' ' ')"
              echo "  resposta pública: $(curl -sI -m 10 https://$d | grep -iE '^(HTTP|server|x-vercel-id|x-powered-by)' | tr -d '\r' | tr '\n' ' ')"
            done
            echo "--- conteúdo das pastas dos sites de concordia e provisualcorporate (só nomes)"
            ls -la /home/concordia/web/concordia.co.mz/public_html 2>/dev/null
            ls -la /home/provisualcorporate/web/provisualcorporate.co.mz/public_html 2>/dev/null
            echo "--- bases de dados do mltmark"
            $H/v-list-databases mltmark plain 2>/dev/null | cut -f1,2,3
            echo "--- registo do Hestia: mudanças de pacote destas contas"
            grep -h "change-user-package" /usr/local/hestia/log/system.log /usr/local/hestia/log/auth.log 2>/dev/null | grep -E "mltmark|concordia|provisual|aamihe" | tail -15
            echo "=== fim ==="
