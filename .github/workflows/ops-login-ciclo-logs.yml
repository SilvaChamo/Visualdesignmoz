name: "Ops - Ciclo no login do painel: registos do site em produção (só leitura)"

# Silva, 16/10/2026: depois da publicação 8dbc2800, entrar no painel dá voltas
# (/login?redirect=/host:2026/ ↔ /host:2026/). Lê só as mensagens do site (pm2) à
# procura de erros de sessão. Nada é alterado; segredos escondidos.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-login-ciclo-logs.yml'

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            esconder() { sed -E 's/(eyJ[A-Za-z0-9_-]{6})[A-Za-z0-9._-]+/\1[…]/g; s/(token|secret|key|password)([=:" ]+)[^ ",&]+/\1\2[escondido]/Ig'; }
            L=$(ls -t /root/.pm2/logs/visualdesign-site-teste-error*.log 2>/dev/null | head -1)
            O=$(ls -t /root/.pm2/logs/visualdesign-site-teste-out*.log 2>/dev/null | head -1)
            echo "ficheiros: $L $O"
            echo "===== erros de sessão/autenticação (últimos) ====="
            grep -h -i -E "getUser|refresh token|refresh_token|session|sessão|auth|401|vhost/dados|proxy\]" "$L" "$O" 2>/dev/null | tail -60 | esconder | cut -c1-300
            echo
            echo "===== últimas 40 linhas de erro ====="
            tail -40 "$L" 2>/dev/null | esconder | cut -c1-300
