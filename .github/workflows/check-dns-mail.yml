name: "Ver DNS e SSL de mail.entrecamposblog.com e mail.visualdesignmoz.com (só leitura)"

# Só lê de fora (DNS, CAA, desafio HTTP e certificado); não entra no servidor nem usa segredos.
on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/check-dns-mail.yml']

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: DNS, CAA e desafio
        run: |
          set +e
          for d in entrecamposblog.com mail.entrecamposblog.com www.entrecamposblog.com; do
            echo "===== $d ====="
            echo "A: $(dig +short $d A | tr '\n' ' ')  AAAA: $(dig +short $d AAAA | tr '\n' ' ')  CNAME: $(dig +short $d CNAME)"
          done
          echo "NS: $(dig +short NS entrecamposblog.com | tr '\n' ' ')"
          echo "CAA: $(dig +short CAA entrecamposblog.com | tr '\n' ' ') | mail: $(dig +short CAA mail.entrecamposblog.com | tr '\n' ' ')"
          echo "IP de visualdesignmoz.com (Contabo): $(dig +short visualdesignmoz.com A | tr '\n' ' ')"
          echo "--- desafio HTTP (deve chegar ao Contabo; 404 é normal sem ficheiro) ---"
          curl -sS -o /dev/null -w "http://mail.../.well-known/acme-challenge/teste -> %{http_code} (%{remote_ip}) %{redirect_url}\n" --max-time 20 http://mail.entrecamposblog.com/.well-known/acme-challenge/teste
          curl -sSI --max-time 20 http://mail.entrecamposblog.com/ | head -5
          for m in mail.entrecamposblog.com mail.visualdesignmoz.com webmail.visualdesignmoz.com; do
            echo "--- $m: A $(dig +short $m A | tr '\n' ' ') CNAME $(dig +short $m CNAME) ---"
            curl -sS -o /dev/null -w "desafio -> %{http_code} (%{remote_ip}) %{redirect_url}\n" --max-time 20 http://$m/.well-known/acme-challenge/teste
            echo | timeout 20 openssl s_client -connect $m:443 -servername $m 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          done
          echo "CAA visualdesignmoz.com: $(dig +short CAA visualdesignmoz.com | tr '\n' ' ')  NS: $(dig +short NS visualdesignmoz.com | tr '\n' ' ')"
