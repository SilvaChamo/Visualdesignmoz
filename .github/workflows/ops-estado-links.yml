name: "Ops - Estado de ns1..ns4 na zona visualdesignmoz.com (só leitura)"

# Silva, 16/10/2026: "os ns1 a 4 sumiram na Cloudflare da VisualDesign, porquê?"
# Mostra os registos ns1..ns4 que existem agora na zona visualdesignmoz.com, quem
# os criou/alterou/apagou nos últimos dias (registo de alterações da Cloudflare) e
# que domínios ainda usam ns1..ns4 como servidores de nomes. Só leitura.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-estado-links.yml'

jobs:
  estado:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          cf() { curl -s -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" "$@"; }
          ZID=$(cf "https://api.cloudflare.com/client/v4/zones?name=visualdesignmoz.com" | jq -r '.result[0].id')
          echo "===== registos ns1..ns4 na zona visualdesignmoz.com, agora ====="
          cf "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=500" \
            | jq -r '.result[] | select(.name | test("^ns[1-4]\\.")) | "\(.type)\t\(.name)\t\(.content)\tcriado=\(.created_on[0:16])"'
          echo "(nada acima = não existem)"
          echo
          echo "===== alterações aos registos ns1..ns4 (desde 13/10) ====="
          for page in 1 2 3; do
            cf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/audit_logs?since=2026-10-13T00:00:00Z&per_page=100&page=$page"
          done | jq -r '.result[]? | select(((.newValue // "") + (.oldValue // "") + ((.metadata // {}) | tostring) + ((.newValueJson // {}) | tostring) + ((.oldValueJson // {}) | tostring)) | test("ns[1-4]\\.visualdesignmoz"))
                   | "\(.when[0:19])  \(.action.type)  \(.metadata.dns_name // .newValueJson.name // .oldValueJson.name // "?")  \(.oldValueJson.content // "-") -> \(.newValueJson.content // "-")  por=\(.actor.email // .actor.type) ip=\(.actor.ip // "-")"' | sort -u
          echo
          echo "===== domínios cujo registador ainda aponta para ns1..ns4.visualdesignmoz.com ====="
          for d in visualdesignmoz.com aamihe.com mltmark.com basededadosagro.com provisualcorporate.co.mz oshercollective.com \
                   elimservicos.com lirandzojewelry.com msdn-moz.org msdnmoz.org shalomdeco.com entrecamposblog.com concordia.co.mz menocrazy.app; do
            ns=$(dig +short NS $d @1.1.1.1 | tr '\n' ' ')
            echo "$ns" | grep -q 'ns[1-4].visualdesignmoz' && echo "  $d -> $ns"
          done
          echo "(nada acima = nenhum destes domínios depende de ns1..ns4)"
