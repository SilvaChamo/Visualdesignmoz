name: "Ops - DNS autoritário no Contabo: inventário (só leitura)"

# ============================================================================
# Pedido do Silva (16/10/2026): "coloque como autoritário… vamos continuar com sites
# na Cloudflare… mas os nameservers não podem ser identificados como REFUSED".
# Antes de criar zonas no Hestia (alteração ao servidor, só com o "avança" dele),
# lista: zonas da Cloudflare (estado, nameservers, registos por tipo), domínios de
# cada conta do Hestia e as zonas DNS que o Hestia já tem. Nada é alterado.
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-dns-autoritario-inventario.yml'

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set +e
          API=https://api.cloudflare.com/client/v4
          cf() { curl -sS -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" "$@"; }
          echo "zona | estado | NS públicos | registos por tipo (proxied) | Contabo responde"
          cf "$API/zones?per_page=100" | jq -r '.result[] | "\(.id) \(.name) \(.status)"' | sort -k2 | while read -r zid zona estado; do
            tipos=$(cf "$API/zones/$zid/dns_records?per_page=500" | jq -r '[.result[] | .type + (if .proxied then "*" else "" end)] | group_by(.) | map("\(.[0])=\(length)") | join(" ")')
            ns=$(dig +short NS $zona @1.1.1.1 | sed 's/\.$//' | sort | tr '\n' ',' | sed 's/,$//')
            st=$(dig +norec SOA $zona @169.58.148.144 2>&1 | grep -o 'status: [A-Z]*' | head -1 | cut -d' ' -f2)
            echo "$zona | $estado | $ns | $tipos | ${st:-sem-resposta}"
          done

  contabo:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            H=/usr/local/hestia/bin
            echo "conta | domínios web | domínios de e-mail | zonas DNS | IP da conta"
            for u in $($H/v-list-users plain | cut -f1); do
              w=$($H/v-list-web-domains $u plain 2>/dev/null | cut -f1 | tr '\n' ' ')
              m=$($H/v-list-mail-domains $u plain 2>/dev/null | cut -f1 | tr '\n' ' ')
              z=$($H/v-list-dns-domains $u plain 2>/dev/null | cut -f1 | tr '\n' ' ')
              ip=$($H/v-list-web-domains $u plain 2>/dev/null | head -1 | cut -f2)
              echo "$u | $w | $m | $z | $ip"
            done
            echo
            echo "--- sintaxe de v-add-dns-domain / v-add-dns-record nesta versão do Hestia ---"
            $H/v-add-dns-domain 2>&1 | head -3
            $H/v-add-dns-record 2>&1 | head -3
            $H/v-list-sys-info plain 2>/dev/null | head -1
