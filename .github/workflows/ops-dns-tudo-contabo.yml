name: "Ops - ns1/ns2 para o Contabo + estado do DNS do Contabo (REFUSED)"

# ============================================================================
# Pedido do Silva (16/10/2026): "ns1-ns2-ns3-ns4 podem apontar na Contabo".
# Muda SÓ os registos A ns1 e ns2 da zona visualdesignmoz.com (Cloudflare) de
# 37.27.17.25 (Hetzner, avariado) para 169.58.148.144 (Contabo); ns3/ns4 já lá estão.
# O resto é só leitura: o que ainda aponta para o Hetzner em todas as zonas, os
# registos CAA da zona e, no Contabo, se o BIND ainda responde REFUSED e porquê.
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loving-cerf-gaw6vw
    paths:
      - '.github/workflows/ops-dns-tudo-contabo.yml'

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set +e
          HZ=37.27.17.25
          CT=169.58.148.144
          API=https://api.cloudflare.com/client/v4
          cf() { curl -sS -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H 'Content-Type: application/json' "$@"; }
          ZID=$(cf "$API/zones?name=visualdesignmoz.com" | jq -r '.result[0].id')
          echo "===== ns1 e ns2 → Contabo ====="
          for n in ns1 ns2; do
            REC=$(cf "$API/zones/$ZID/dns_records?type=A&name=$n.visualdesignmoz.com" | jq -c '.result[0] // empty')
            [ -z "$REC" ] && { echo "$n: não existe"; continue; }
            echo -n "$n: $(echo "$REC" | jq -r .content) → "
            cf -X PATCH "$API/zones/$ZID/dns_records/$(echo "$REC" | jq -r .id)" --data "{\"content\":\"$CT\"}" | jq -r '"\(.result.content) ok=\(.success)"'
          done
          echo
          echo "===== ainda a apontar para o Hetzner ($HZ), em todas as zonas (só leitura) ====="
          cf "$API/zones?per_page=100" | jq -r '.result[] | "\(.id) \(.name)"' | while read -r zid zona; do
            cf "$API/zones/$zid/dns_records?per_page=500" | jq -r --arg z "$zona" --arg ip "$HZ" '.result[] | select(.content==$ip) | "\($z)\t\(.type)\t\(.name)"'
          done
          echo "(nada acima = nenhum)"
          echo
          echo "===== registos CAA de visualdesignmoz.com na Cloudflare (só leitura) ====="
          cf "$API/zones/$ZID/dns_records?type=CAA" | jq -r '.result[] | "\(.name)\t\(.content)"'
          echo "(nada acima = nenhum)"
          sleep 15
          echo
          for n in ns1 ns2 ns3 ns4 host; do echo "$n.visualdesignmoz.com -> $(dig +short A $n.visualdesignmoz.com @1.1.1.1 | tr '\n' ' ')"; done
          echo
          echo "===== o DNS do Contabo responde por estes domínios? (de fora) ====="
          for d in visualdesignmoz.com oshercollective.com concordia.co.mz; do
            echo "$d @$CT: $(dig +norec SOA $d @$CT 2>&1 | grep -o 'status: [A-Z]*' | head -1) $(dig +norec +short SOA $d @$CT | head -1)"
          done

  contabo-dns:
    name: contabo — zonas do BIND (só leitura)
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            H=/usr/local/hestia/bin
            echo "===== zonas DNS no Hestia, por conta ====="
            for u in $($H/v-list-users plain | cut -f1); do
              z=$($H/v-list-dns-domains $u plain 2>/dev/null | cut -f1 | tr '\n' ' ')
              [ -n "$z" ] && echo "$u: $z"
            done
            echo
            echo "===== zonas que o BIND carregou agora ====="
            rndc status 2>&1 | grep -i -E 'zones|running'
            grep -h -o 'zone "[^"]*"' /etc/bind/named.conf /etc/bind/named.conf.local 2>/dev/null | sort -u | head -30
            echo
            echo "===== opções do BIND (allow-query / recursion / listen) ====="
            grep -h -E 'allow-query|allow-recursion|recursion|listen-on' /etc/bind/named.conf.options 2>/dev/null
            echo
            echo "===== nameservers que o Hestia dá às zonas (ns1..ns4?) ====="
            for u in $($H/v-list-users plain | cut -f1); do $H/v-list-user $u plain 2>/dev/null | awk -F'\t' -v u=$u '{print u": "$0}' | grep -o -E "^[a-z0-9]+: |ns[0-9]\.[a-z.]+" | tr '\n' ' '; echo; done | grep ns | head -10
