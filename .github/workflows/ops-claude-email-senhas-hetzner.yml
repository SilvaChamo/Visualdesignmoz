name: "Ops - E-mail: o Contabo passa a aceitar também as palavras-passe do Hetzner (todas as caixas)"

# ============================================================================
# 13/10/2026 (pedido do Silva: "copie todas incluindo de clientes"):
# as caixas de e-mail foram recriadas no Contabo com palavras-passe novas; os dispositivos (o Mail e as Notas do Mac
# dele, e os dos clientes) continuam com as do Hetzner e falham. Copiar por cima partiria o webmail do painel (usa a
# palavra-passe guardada na base de dados) e quem já mudou no Contabo. Por isso o Dovecot passa a ter uma 2.ª fonte
# de palavras-passe: se a do Contabo falhar, experimenta a do Hetzner. As duas funcionam; nada é apagado.
#  1) do Hetzner vêm só os registos cifrados (/etc/virtual/*/passwd) — direto para o Contabo pelo runner, nunca
#     impressos;
#  2) no Contabo: /etc/dovecot/hetzner-passwd/<domínio> só para caixas activas no Contabo (root:dovecot 640) e
#     /etc/dovecot/conf.d/99-visualdesign-hetzner-passwd.conf com o 2.º passdb; doveconf -n valida; se falhar,
#     retira tudo e fica como estava. A cada 5 minutos, uma limpeza retira a do Hetzner das caixas que no Contabo
#     forem suspensas, apagadas ou mudarem de palavra-passe;
#  3) espera 4 minutos e conta entradas bem/mal sucedidas desde a mudança (o Mac tenta a cada poucos minutos).
# Desfazer: rm /etc/dovecot/conf.d/99-visualdesign-hetzner-passwd.conf /etc/cron.d/visualdesign-hetzner-passwd && systemctl reload dovecot
# Corre só quando este ficheiro muda no ramo claude/kind-einstein-r6lyf6.
# ============================================================================

on:
  push:
    branches: [claude/kind-einstein-r6lyf6]
    paths: ['.github/workflows/ops-claude-email-senhas-hetzner.yml']

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar os registos cifrados do Hetzner para o Contabo (sem os mostrar)
        env:
          SSHPASS: ${{ secrets.CONTABO_ROOT_PASSWORD }}
        run: |
          set -e
          sudo apt-get install -y -qq sshpass >/dev/null
          umask 077
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hk
          chmod 600 ~/.ssh/hk
          ssh -i ~/.ssh/hk -p "${{ secrets.HETZNER_PORT }}" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'S=""; [ "$(id -u)" != 0 ] && S="sudo -n"; $S sh -c "cd /etc/virtual && tar czf - */passwd 2>/dev/null"' > /tmp/da.tgz || true
          N=$(tar tzf /tmp/da.tgz 2>/dev/null | wc -l)
          echo "do Hetzner: $N domínios com caixas de e-mail"
          [ "$N" -gt 0 ] || { echo "ERRO: nada veio do Hetzner"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new root@"${{ secrets.CONTABO_HOST }}" 'umask 077; cat > /root/da-passwd.tgz' < /tmp/da.tgz
          shred -u /tmp/da.tgz ~/.ssh/hk
          echo "copiado para o Contabo"

      - name: Contabo — 2.ª fonte de palavras-passe no Dovecot
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 15m
          script: |
            set +e
            DIR=/etc/dovecot/hetzner-passwd
            CONF=/etc/dovecot/conf.d/99-visualdesign-hetzner-passwd.conf
            TMP=$(mktemp -d); chmod 700 "$TMP"
            echo "Dovecot $(dovecot --version 2>/dev/null)"
            echo -n "exim autentica pelo Dovecot? "; grep -qE 'driver *= *dovecot' /etc/exim4/exim4.conf.template 2>/dev/null && echo sim || echo "NÃO (o envio continua só com a do Contabo)"
            tar xzf /root/da-passwd.tgz -C "$TMP" && shred -u /root/da-passwd.tgz

            echo "===== 1. palavras-passe do Hetzner, só para caixas activas no Contabo ====="
            mkdir -p "$DIR"
            python3 - "$TMP" "$DIR" <<'PY'
            import os, sys, glob, hashlib, re
            src, dst = sys.argv[1], sys.argv[2]
            esquemas = {'$6$': '{SHA512-CRYPT}', '$5$': '{SHA256-CRYPT}', '$1$': '{MD5-CRYPT}', '$2y$': '{BLF-CRYPT}', '$2a$': '{BLF-CRYPT}', '$2b$': '{BLF-CRYPT}'}
            activa = re.compile(r'^(\{[A-Z0-9-]+\})?\$')
            def hestia(d):
                r = {}
                try:
                    for x in open(f'/etc/exim4/domains/{d}/passwd', errors='ignore'):
                        f = x.rstrip('\n').split(':')
                        if len(f) > 1 and f[0]: r[f[0].lower()] = f[1]
                except OSError: pass
                return r
            dom = contas = copiadas = sem_esquema = fora = 0
            estado, proprias = [], {}
            for p in glob.glob(os.path.join(src, '*', 'passwd')):
                d = os.path.basename(os.path.dirname(p)).lower()
                h_ct = hestia(d)
                linhas = []
                for l in open(p, errors='ignore'):
                    f = l.rstrip('\n').split(':')
                    if len(f) < 2 or not f[0] or not f[1]: continue
                    u, h = f[0].strip().lower(), f[1].strip()
                    contas += 1
                    pre = '' if h.startswith('{') else next((v for k, v in esquemas.items() if h.startswith(k)), None)
                    if pre is None: sem_esquema += 1; continue
                    atual = h_ct.get(u)
                    # só caixas que existem e estão activas no Contabo (uma suspensa não volta a entrar)
                    if not atual or not activa.match(atual): fora += 1; continue
                    linhas.append(f'{u}:{pre}{h}')
                    estado.append(f'{d}:{u}:' + hashlib.sha256(atual.encode()).hexdigest())
                    copiadas += 1
                    if d == 'visualdesignmoz.com': proprias[u] = 'copiada'
                if linhas:
                    open(os.path.join(dst, d), 'w').write('\n'.join(linhas) + '\n'); dom += 1
            open(os.path.join(dst, '.estado'), 'w').write('\n'.join(estado) + '\n')
            print(f'  Hetzner: {contas} caixas; copiadas {copiadas} (em {dom} domínios); fora {fora} (não existem ou estão suspensas no Contabo); {sem_esquema} com esquema desconhecido')
            for u in ('silva.chamo', 'info', 'suporte', 'mailmarketing', 'geral'):
                print(f'  {u}@visualdesignmoz.com: {proprias.get(u, "NÃO copiada")}')
            PY
            rm -rf "$TMP"

            # limpeza a cada 5 minutos: se no Contabo a caixa for suspensa, apagada ou mudar de palavra-passe,
            # a do Hetzner deixa de valer para ela; domínios novos ganham um ficheiro vazio
            SYNC=/usr/local/sbin/visualdesign-hetzner-passwd-sync
            cat > "$SYNC" <<'PY'
            #!/usr/bin/env python3
            # Palavras-passe antigas do Hetzner no Dovecot (13/10/2026): retira as das caixas que no Contabo foram
            # suspensas, apagadas ou mudaram de palavra-passe. Corre pelo /etc/cron.d/visualdesign-hetzner-passwd.
            import hashlib, os
            DIR = '/etc/dovecot/hetzner-passwd'
            def hestia(d):
                r = {}
                try:
                    for x in open(f'/etc/exim4/domains/{d}/passwd', errors='ignore'):
                        f = x.rstrip('\n').split(':')
                        if len(f) > 1 and f[0]: r[f[0].lower()] = f[1]
                except OSError: pass
                return r
            est = os.path.join(DIR, '.estado')
            fica, tirar = [], {}
            cache = {}
            for l in open(est):
                p = l.strip().split(':')
                if len(p) != 3: continue
                d, u, sha = p
                h = cache.setdefault(d, hestia(d)).get(u)
                if h and hashlib.sha256(h.encode()).hexdigest() == sha: fica.append(l.strip())
                else: tirar.setdefault(d, set()).add(u)
            for d, us in tirar.items():
                f = os.path.join(DIR, d)
                if not os.path.exists(f): continue
                linhas = [x for x in open(f) if x.split(':')[0] not in us]
                open(f + '.tmp', 'w').writelines(linhas); os.replace(f + '.tmp', f)
            if tirar:
                open(est + '.tmp', 'w').write('\n'.join(fica) + '\n'); os.replace(est + '.tmp', est)
            for d in os.listdir('/etc/exim4/domains'):
                f = os.path.join(DIR, d)
                if not os.path.exists(f): open(f, 'w').close()
            os.system(f'chown -R root:dovecot {DIR}; chmod 750 {DIR}; chmod 640 {DIR}/* {DIR}/.estado')
            print(f'{len(fica)} caixas com a palavra-passe do Hetzner; retiradas agora: {sum(len(v) for v in tirar.values())}')
            PY
            chmod 700 "$SYNC"
            echo "*/5 * * * * root $SYNC >/dev/null 2>&1" > /etc/cron.d/visualdesign-hetzner-passwd
            echo "  $($SYNC)"
            echo "  $(ls "$DIR" | wc -l) ficheiros em $DIR (dono $(stat -c %U:%G "$DIR" 2>/dev/null))"

            echo "===== 2. Dovecot: se a do Contabo falhar, experimenta a do Hetzner ====="
            printf '%s\n' \
              '# Palavras-passe antigas do Hetzner (pedido do Silva, 13/10/2026): só se a do Contabo falhar.' \
              '# Desfazer: apagar este ficheiro e systemctl reload dovecot' \
              'passdb {' \
              '  driver = passwd-file' \
              "  args = username_format=%n $DIR/%d" \
              '}' > "$CONF"
            if doveconf -n >/dev/null 2>&1; then
              doveconf -n 2>/dev/null | grep -A2 '^passdb' | grep -E 'driver|args' | sed 's/^/  /'
              N0=$(wc -l < /var/log/dovecot.log)
              systemctl reload dovecot && echo "  Dovecot recarregado"
              doveadm auth cache flush >/dev/null 2>&1
            else
              doveconf -n 2>&1 | tail -3; rm -f "$CONF"; systemctl reload dovecot
              echo "ERRO: o Dovecot recusou — retirado, fica como estava"; exit 1
            fi

            echo "===== 3. resultado (4 minutos depois) ====="
            sleep 240
            NOVO=$(tail -n +"$((N0+1))" /var/log/dovecot.log)
            echo "  entradas com sucesso desde a mudança: $(echo "$NOVO" | grep -c 'Login: user=<')"
            echo "  falhas desde a mudança:               $(echo "$NOVO" | grep -ciE 'auth failed|password mismatch')"
            echo "  as tuas 5 caixas a partir de Moçambique (41.220.x):"
            echo "$NOVO" | grep 'Login: user=<' | grep 'rip=41\.220\.' | grep -oE 'user=<(silva\.chamo|info|suporte|mailmarketing|geral)@visualdesignmoz\.com>' | sort | uniq -c | sed 's/^/    ok /'
            echo "$NOVO" | grep -iE 'auth failed|password mismatch' | grep 'rip=41\.220\.' | grep -oE 'user=<[^>]*@visualdesignmoz\.com>' | sort | uniq -c | sed 's/^/    falha /'
            echo "$NOVO" | grep -iE 'passwd-file|error' | grep -v 'auth failed' | tail -3 | sed 's/^/  aviso: /'
